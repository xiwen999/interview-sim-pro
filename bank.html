  {id:'wx53',scene:'xingce',lv:2,qtype:'single',q:'三个数的平均数是 12，前两个数的平均数是 10，第三个数是？',options:[{k:'A',t:'16'},{k:'B',t:'14'},{k:'C',t:'12'},{k:'D',t:'10'}],answer:'A',point:'考察平均数逆运算。',tips:['总和 = 平均×个数','第三数 = 36 - 20 = 16'],ans:['三数总和 = 12×3 = 36；前两数和 = 10×2 = 20；第三数 = 36-20 = 16。','平均数题核心是「和 = 平均 × 个数」的往返转换，配合部分和求剩余。']},
  {id:'wx54',scene:'xingce',lv:2,qtype:'judge',q:'「甲比乙高 10%，乙比甲矮 10%」这句话在数学上成立。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察百分比基准不对称（与 wx29 同族）。',tips:['甲=1.1乙 → 甲比乙高 10%','乙比甲矮：0.1/1.1≈9.1%'],ans:['设乙为 1，甲为 1.1：甲比乙高 10% 成立；但乙比甲矮的比例基准是甲：0.1/1.1 ≈ 9.1%，不是 10%。','「比谁」决定了分母，涨跌不对称是行测与金融计算共同的易错点。']},
  {id:'wx55',scene:'xingce',lv:2,qtype:'single',q:'「去操场跑步的同学都穿了运动鞋，小华穿了运动鞋」，能否推出「小华去操场跑步了」？',options:[{k:'A',t:'能'},{k:'B',t:'不能——穿运动鞋是「去跑步同学」的必要条件，非充分条件'},{k:'C',t:'取决于天气'},{k:'D',t:'能，但要加一个小前提'}],answer:'B',point:'考察必要条件的逆推陷阱（肯定后件谬误）。',tips:['去跑步→穿运动鞋；穿运动鞋 ⇏ 去跑步','与 wx28 同族：肯定后件推不出前件'],ans:['原命题是「去跑步→穿运动鞋」，小华穿运动鞋属于肯定后件，推不出前件——可能他只是穿运动鞋上学。','「逆命题不成立」是形式逻辑最经典的坑：A→B 为真时，B→A 未必为真。']},
  {id:'wx56',scene:'xingce',lv:2,qtype:'single',q:'某种彩票中奖概率为 1%，买 100 张（每张独立），中奖概率是多少？',options:[{k:'A',t:'恰好 100%'},{k:'B',t:'1-(0.99)¹⁰⁰ ≈ 63.4%'},{k:'C',t:'50%'},{k:'D',t:'仍是 1%'}],answer:'B',point:'考察独立事件概率（至少一次）。',tips:['「至少中一次」反面是「全不中」','(0.99)^100 ≈ 0.366'],ans:['至少中一次 = 1 - 全不中 = 1 - 0.99¹⁰⁰ ≈ 1 - 0.366 = 63.4%。','独立事件「至少一次」的通用公式 P = 1-(1-p)ⁿ；「买 100 张必中」是典型直觉错误——概率会随张数上升但不封顶到 1。']},
  {id:'wx57',scene:'xingce',lv:2,qtype:'single',q:'某月日历中，同一列竖排的连续 3 个日期之和为 57，这 3 个日期中最大的是？',options:[{k:'A',t:'26'},{k:'B',t:'19'},{k:'C',t:'24'},{k:'D',t:'22'}],answer:'A',point:'考察等差数列（日历竖列差 7）。',tips:['竖列相邻日期差 7','三数和 = 中间数×3 → 中间 = 57÷3 = 19','最大 = 19+7 = 26'],ans:['日历同列上下相差 7，三个日期成等差：和 = 中间数×3 → 中间 = 57÷3 = 19，最大 = 19+7 = 26。','日历题通用套路：识别等差结构（横向差 1、竖向差 7），用「和=中项×个数」秒解。']},
  {id:'wx58',scene:'xingce',lv:2,qtype:'single',q:'甲、乙两台设备同时开工生产同种零件。甲每分钟 12 个，乙每分钟 8 个。多久后甲比乙多生产 40 个？',options:[{k:'A',t:'10 分钟'},{k:'B',t:'5 分钟'},{k:'C',t:'20 分钟'},{k:'D',t:'8 分钟'}],answer:'A',point:'考察追及问题（生产场景）。',tips:['速度差 12-8=4 个/分钟','40÷4=10 分钟'],ans:['追及模型：差距 40 个，速度差 4 个/分钟 → 40÷4=10 分钟。','「多生产」=追及（速度差），「共同完成」=相遇（速度和），识别模型是关键。']},
  {id:'wx59',scene:'xingce',lv:2,qtype:'single',q:'逻辑填空：「他的演讲________，听众无不点头称是。」最贴切的成语是？',options:[{k:'A',t:'夸夸其谈'},{k:'B',t:'深入浅出'},{k:'C',t:'词不达意'},{k:'D',t:'不知所云'}],answer:'B',point:'考察成语感情色彩与语境匹配。',tips:['后文「点头称是」是褒义语境','夸夸其谈/词不达意/不知所云均为贬义'],ans:['语境褒扬演讲效果，「深入浅出」（内容深刻但表达浅显易懂）感情色彩与语义都吻合；其余三项都是贬义，与「点头称是」矛盾。','逻辑填空两步法：先定感情色彩（褒/贬），再比语义侧重。']},
  {id:'wx60',scene:'xingce',lv:2,qtype:'single',q:'「文段排序」：①最后总结全文 ②先提出问题 ③中间分析原因。合理的顺序是？',options:[{k:'A',t:'②③①'},{k:'B',t:'①②③'},{k:'C',t:'③②①'},{k:'D',t:'②①③'}],answer:'A',point:'考察「提出问题—分析问题—解决问题」的议论结构。',tips:['议论文经典三段：是什么→为什么→怎么办','总结在最后'],ans:['议论文通用骨架：提出问题（是什么）→ 分析原因（为什么）→ 总结/对策（怎么办），即 ②③①。','语句排序题先找「总起句/总结句」定首尾，再用关联词、代词指代锁定相邻关系。']},
  {id:'wx61',scene:'xingce',lv:2,qtype:'judge',q:'资料分析中，同比是与上一个相邻时段（如上月）相比，环比是与去年同一时段相比。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察同比/环比定义（易混）。',tips:['同比 = 与去年同期比','环比 = 与上一相邻期比','记忆：环=环环相扣的相邻，同=同期'],ans:['说反了：同比是与「去年同一时期」相比（消除季节性），环比是与「上一个相邻时段」相比（看短期趋势）。','资料分析题干常混用两者设置陷阱：读题先圈「同比/环比」二字再列式。']},
  {id:'wx62',scene:'xingce',lv:2,qtype:'single',q:'「基期比重」公式：现期部分 A、整体 B，部分增速 a、整体增速 b，则基期比重为？',options:[{k:'A',t:'(A/B)×(1+b)/(1+a)'},{k:'B',t:'A/B×(1+a)/(1+b)'},{k:'C',t:'A/B×(a-b)'},{k:'D',t:'A/B'}],answer:'A',point:'考察资料分析进阶公式。',tips:['基期部分 = A/(1+a)，基期整体 = B/(1+b)','基期比重 = A/(1+a) ÷ B/(1+b) = A/B × (1+b)/(1+a)'],ans:['基期比重 = 基期部分 ÷ 基期整体 = [A/(1+a)] ÷ [B/(1+b)] = (A/B)×(1+b)/(1+a)。','记忆技巧：分子分母的「1+增速」交叉放置（部分的增速挪到分母侧）。判断比重上升/下降只需比较 a 与 b 大小（a>b 则比重升）。']},
  {id:'wx63',scene:'xingce',lv:1,qtype:'single',q:'「某公司 2025 年营收比 2024 年增长 25%，增长量为 500 万元」，2025 年营收是？',options:[{k:'A',t:'2500 万元'},{k:'B',t:'2000 万元'},{k:'C',t:'3000 万元'},{k:'D',t:'2250 万元'}],answer:'A',point:'考察增长量与增长率的关系。',tips:['增长量 = 基期×r → 基期 = 500÷0.25 = 2000','现期 = 2000+500 = 2500'],ans:['基期 = 增长量÷增长率 = 500÷0.25 = 2000 万元；2025 年 = 2000+500 = 2500 万元。','「增长量÷增长率=基期」是资料分析的常用变形；B 选项 2000 是基期，是命题人放的陷阱。']},
  {id:'wx64',scene:'xingce',lv:2,qtype:'single',q:'一次会议 8 人围圆桌而坐，不区分座位旋转（旋转等价），共有几种坐法？',options:[{k:'A',t:'8! = 40320'},{k:'B',t:'7! = 5040'},{k:'C',t:'6! = 720'},{k:'D',t:'5760'}],answer:'B',point:'考察环形排列（去旋转）。',tips:['环形排列 = 直排 ÷ 人数','(n-1)! 是圆桌坐法公式','固定一人破旋转对称'],ans:['圆桌排列把「旋转相同」视为同一坐法：n 人环形排列 = (n-1)! = 7! = 5040 种。','原理：固定一人作参照（破旋转对称），其余 n-1 人直排。8! 是直线排列的答案，是命题人放的对比项。']},
  {id:'wx65',scene:'xingce',lv:2,qtype:'single',q:'「某地今年 GDP 是 5 年前的 1.8 倍」，年均增长率约为多少？',options:[{k:'A',t:'18%'},{k:'B',t:'约 12.5%'},{k:'C',t:'约 36%'},{k:'D',t:'8%'}],answer:'B',point:'考察年均增长率（开 n 次方估算）。',tips:['(1+r)⁵=1.8','1.8^(1/5)≈1.125 → r≈12.5%','考场估算：ln1.8≈0.588，÷5≈0.1176，e^0.118≈1.125'],ans:['(1+r)⁵ = 1.8 → r = 1.8^(1/5) - 1 ≈ 12.5%。','年均增长 ≠ 总增长率÷5（那是 16% 的线性错觉）；正确做法是开 n 次方。考场可用 1.125⁵≈1.8 试乘验证。']},
  {id:'wx66',scene:'xingce',lv:2,qtype:'single',q:'「所有 Metal 元素都导电。铜导电。」能否推出「铜是 Metal 元素」？',options:[{k:'A',t:'能'},{k:'B',t:'不能——肯定后件推不出前件（导电的不一定都是金属）'},{k:'C',t:'取决于铜的价格'},{k:'D',t:'能，物理常识支持'}],answer:'B',point:'考察全称命题的推理方向（常识诱饵干扰）。',tips:['所有 A→B；B ⇏ A','石墨也导电但不是金属','物理常识不是逻辑依据'],ans:['「所有金属导电」不代表「导电的都是金属」（石墨溶液也导电）。铜导电是肯定后件，推不出铜是金属。','这道题故意用「真常识」诱使考生跳过形式逻辑——逻辑有效性只看形式，不看结论是否符合事实。']},
  {id:'wx67',scene:'xingce',lv:2,qtype:'single',q:'一副牌去掉大小王共 52 张，随机抽一张，是红色牌或 K 的概率是？',options:[{k:'A',t:'28/52 ≈ 53.8%'},{k:'B',t:'30/52 ≈ 57.7%'},{k:'C',t:'26/52 = 50%'},{k:'D',t:'4/52 ≈ 7.7%'}],answer:'A',point:'考察容斥原理（P(A∪B)=P(A)+P(B)-P(A∩B)）。',tips:['红牌 26 张，K 4 张，红 K 2 张','并集 = 26+4-2 = 28','别忘减去重复的红 K'],ans:['容斥原理：P(红或K) = P(红)+P(K)-P(红且K) = 26/52 + 4/52 - 2/52 = 28/52 ≈ 53.8%。','关键细节是减去「红 K」的重复计数；B 选项 30/52 是忘记减重复的典型错误。']},

  {id:'wx69',scene:'xingce',lv:2,qtype:'single',q:'一杯纯果汁 500 克，喝掉 40% 后加满水，再喝掉一半，杯中纯果汁还剩多少克？',options:[{k:'A',t:'150 克'},{k:'B',t:'100 克'},{k:'C',t:'200 克'},{k:'D',t:'125 克'}],answer:'A',point:'考察浓度多步推演。',tips:['喝 40% 剩纯汁 500×0.6=300 克','加满水不变纯汁量 300 克、总量 500','再喝一半：纯汁剩 150 克'],ans:['第一步剩纯汁 300 克（总量 500 不变）；加水后纯汁仍 300 克；再喝掉一半（含一半纯汁）→ 纯汁剩 150 克。','多步浓度题每步只跟踪「纯汁量」与「总量」两个数，避免陷入每步浓度重算的复杂化。']},

function activeBank(){return BANK_TABS[F.type]||BANK_TABS.iv}

var F={type:'iv',role:'all',round:'all',scene:'all',lv:0,kw:'',fav:false};

/* 核心 Tab + 双轴筛选 */
function renderTabs(){
  var box=document.getElementById('bkTabs');
  box.innerHTML=Object.keys(BANK_TABS).map(function(k){
    var t=BANK_TABS[k];
    return '<button type="button" class="bk-tab'+(k===F.type?' on':'')+'" data-k="'+k+'" role="tab">'+t.icon+' '+t.name+'</button>';
  }).join('');
  $$('#bkTabs .bk-tab').forEach(function(b){b.onclick=function(){
    if(b.dataset.k===F.type)return;
    F.type=b.dataset.k;F.role='all';F.round='all';F.scene='all';
    $$('#bkTabs .bk-tab').forEach(function(x){x.classList.toggle('on',x===b)});
    renderFilters();render();
  }});
}
function dot(c){return '<span style="width:8px;height:8px;border-radius:50%;background:'+c+'"></span>'}
function renderFilters(){
  var isIv=F.type==='iv';
  var scF=document.getElementById('scFilter'), rdF=document.getElementById('rdFilter');
  if(isIv){
    scF.innerHTML='<span class="fg-lab">岗位</span><button class="chip'+(F.role==='all'?' on':'')+'" data-k="all">全部岗位</button>'+
      ROLES.map(function(r){
        return '<button class="chip'+(F.role===r.id?' on':'')+'" data-k="'+r.id+'">'+dot(r.color)+r.icon+' '+r.name+'</button>';
      }).join('');
    $$('#scFilter .chip').forEach(function(b){b.onclick=function(){
      F.role=b.dataset.k;
      $$('#scFilter .chip').forEach(function(x){x.classList.toggle('on',x===b)});render();
    }});
    rdF.innerHTML='<span class="fg-lab">类型</span><button class="chip'+(F.round==='all'?' on':'')+'" data-k="all">全部类型</button>'+
      ROUNDS.map(function(r){
        return '<button class="chip'+(F.round===r.id?' on':'')+'" data-k="'+r.id+'">'+r.icon+' '+r.name+'</button>';
      }).join('');
    $$('#rdFilter .chip').forEach(function(b){b.onclick=function(){
      F.round=b.dataset.k;
      $$('#rdFilter .chip').forEach(function(x){x.classList.toggle('on',x===b)});render();
    }});
  }else{
    scF.innerHTML='<span class="fg-lab">科目</span><button class="chip'+(F.scene==='all'?' on':'')+'" data-k="all">全部科目</button>'+
      Object.keys(WRITTEN_SCENES).map(function(k){
        return '<button class="chip'+(F.scene===k?' on':'')+'" data-k="'+k+'">'+dot(WRITTEN_COLOR[k])+WRITTEN_SCENES[k].name+'</button>';
      }).join('');
    $$('#scFilter .chip').forEach(function(b){b.onclick=function(){
      F.scene=b.dataset.k;
      $$('#scFilter .chip').forEach(function(x){x.classList.toggle('on',x===b)});render();
    }});
    rdF.innerHTML='';rdF.style.display='none';
  }
  if(isIv)rdF.style.display='';
}

/* 支持从 URL 带入搜索词/ */
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var kw=p.get('kw');if(kw){F.kw=kw;document.getElementById('kw').value=kw}
    if(p.get('type')==='wr')F.type='wr';
    var rl=p.get('role');if(rl&&ROLE_MAP[rl])F.role=rl;
    var rd=p.get('round');if(rd&&ROUND_MAP[rd])F.round=rd;
    /* 兼容旧链接 */
    var sc=p.get('scene');
    if(sc&&SCENE_AXES[sc]){F.role=SCENE_AXES[sc].role;F.round=SCENE_AXES[sc].round}
    if(F.type==='wr'&&sc&&WRITTEN_SCENES[sc])F.scene=sc;
    renderTabs();renderFilters();
  }catch(e){}
})();

function render(){
  var bank=activeBank();
  var isWr=F.type==='wr';
  var favCnt=bank.list.filter(function(q){return isFav(q.id)}).length;
  var list=bank.list.filter(function(q){
    if(isWr){ if(F.scene!=='all'&&q.scene!==F.scene)return false }
    else{
      if(F.role!=='all'&&roleOf(q)!==F.role)return false;
      if(F.round!=='all'&&roundOf(q)!==F.round)return false;
    }
    if(F.lv&&q.lv!==F.lv)return false;
    if(F.kw&&q.q.toLowerCase().indexOf(F.kw.toLowerCase())<0)return false;
    if(F.fav&&!isFav(q.id))return false;
    return true;
  });
  document.getElementById('cntLine').textContent='共 '+list.length+' 道题 · 已收藏 '+favCnt+' 道';
  if(!list.length){
    var emptyMsg=F.fav?'还没有收藏的题目，点 ⭐ 收藏喜欢的题'
      :(!isWr?'该筛选组合下暂时没有题目，试试切换岗位或面试类型':'没有匹配的题目，换个关键词或筛选条件试试');
    document.getElementById('list').innerHTML='<div class="empty"><span class="e-ic">🔍</span>'+emptyMsg+'</div>';return
  }
  document.getElementById('list').innerHTML=list.map(function(q,i){
    var favIcon=isFav(q.id)?'⭐':'☆';
    var practiceBtn=isWr

      : '<button class="qi-practice" data-s="'+q.scene+'">练这道 →</button>';
    /* 题型小标签（笔试：单选/多选/判断/填空/简答） */
    var qtTag='';
    if(isWr){var qt=WR_QTYPE[q.qtype]||WR_QTYPE.short;qtTag='<span class="tag qtype-tag" style="background:'+qt.color+'22;color:'+qt.color+';flex:none">'+qt.name+'</span>'}
    /* 收起态内联展示选项 */
    var optsHtml='';
    if(isWr&&q.options&&q.options.length){
      var isAns=function(k){return Array.isArray(q.answer)?q.answer.indexOf(k)>=0:q.answer===k};
      optsHtml='<div class="qi-opts">'+q.options.map(function(o){
        return '<div class="opt'+(isAns(o.k)?' is-ans':'')+'" data-k="'+o.k+'"><span class="opt-k">'+o.k+'</span><span class="opt-t">'+esc(o.t)+'</span></div>';
      }).join('')+'</div>';
    }
        var bodyHtml;
    if(isWr){
      var ansKey=Array.isArray(q.answer)?q.answer.join('、'):q.answer;
      bodyHtml='<div class="wr-ans"><span class="wr-ans-lab">✅ 正确答案</span><span class="wr-ans-key">'+esc(ansKey)+'</span></div>'+
        '<h5>💡 解析</h5>'+
        '<div class="wr-point">'+esc(q.point)+'</div>'+
        (q.tips&&q.tips.length?'<ul class="tip">'+q.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>':'')+
        (q.ans&&q.ans.length?'<div class="ans-box">'+q.ans.map(function(a){return '<p>'+esc(a)+'</p>'}).join('')+'</div>':'');
    }else{
      bodyHtml='<h5>🎯 考察点</h5><div style="font-size:13px;color:var(--ink2);line-height:1.7">'+esc(q.point)+'</div>'+
        '<h5>💡 作答技巧</h5><ul class="tip">'+q.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>'+
        '<h5>✅ 参考要点</h5><ul class="ans">'+q.ans.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ul>';
    }
    return '<div class="q-item" data-id="'+q.id+'">'+
      '<div class="qi-h">'+
        '<span class="qtype-ic" title="'+(isWr?'笔试题':'面试题')+'">'+bank.icon+'</span>'+
        '<span class="tag" style="background:'+(isWr?bank.color[q.scene]:ROLE_MAP[roleOf(q)].color)+'22;color:'+(isWr?bank.color[q.scene]:ROLE_MAP[roleOf(q)].color)+';flex:none">'+(isWr?bank.scenes[q.scene].name:ROLE_MAP[roleOf(q)].name)+'</span>'+
        qtTag+
        '<span class="qt">'+esc(q.q)+'</span>'+
        '<button class="qi-fav txA" data-id="'+q.id+'" title="收藏/取消" style="font-size:16px;padding:6px 8px;border-radius:8px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);cursor:pointer">'+favIcon+'</button>'+
        '<span class="tag txB2" style="background:rgba(108,140,255,.13);flex:none">'+LV_NAME[q.lv]+'</span>'+
        practiceBtn+
        '<span class="chev">'+ICONS.chev+'</span>'+
      '</div>'+
      optsHtml+
      '<div class="qi-b">'+bodyHtml+'</div></div>';
  }).join('');
  $$('#list .qi-h').forEach(function(h){h.addEventListener('click',function(e){
    if(e.target.classList.contains('qi-practice')||e.target.classList.contains('qi-fav'))return;
    h.parentNode.classList.toggle('open')})});
  /* 点击选项不触发展开 */
  $$('#list .qi-opts').forEach(function(o){o.addEventListener('click',function(e){e.stopPropagation()})});
  $$('#list .qi-practice').forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    if(b.dataset.wr){b.closest('.q-item').classList.toggle('open');return}   /* 笔试：直接展开解析 */
    if(!canUseFeature())return;location.href='interview.html?scene='+b.dataset.s
  }});
  $$('#list .qi-fav').forEach(function(b){b.onclick=function(e){e.stopPropagation();if(!canUseFeature())return;toggleFav(b.dataset.id);render()}});
}
render();
</script>
</body>
</html>
