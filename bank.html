/* 展开区：笔试正确答案色块（醒目） + 解析排版 */

.wr-ans .wr-ans-key{font-size:var(--fs-lg);font-weight:900;color:#34D399;letter-spacing:1px}

</style>

<script>
initPage('bank');
/* 壳内动态星空 */
seedStars('bkStars1',700,1,60);seedStars('bkStars2',200,2,120);seedStars('bkStars3',100,3,180);
document.getElementById('srchIc').innerHTML=ICONS.search;

var WRITTEN_SCENES = {
  fe:{id:'fe',name:'前端笔试',desc:'HTML / CSS / JavaScript 基础与高频笔试题'},
  algo:{id:'algo',name:'算法笔试',desc:'数据结构 / 算法 / 复杂度 高频笔试题'},
  xingce:{id:'xingce',name:'行测 / 综合',desc:'言语理解 / 数量关系 / 逻辑推理 行测题'}
};
var WRITTEN_COLOR = {fe:'#60A5FA',algo:'#34D399',xingce:'#F472B6'};
/* 笔试题型 */
var WR_QTYPE = {
  single:{name:'单选',color:'#60A5FA'},
  multiple:{name:'多选',color:'#F472B6'},
  judge:{name:'判断',color:'#FBBF24'},
  fill:{name:'填空',color:'#34D399'},
  short:{name:'简答',color:'#A78BFA'}
};
var WRITTEN_QUESTIONS = [
  {id:'wfe1',scene:'fe',lv:1,qtype:'single',q:'关于 CSS 盒模型，下列说法正确的是？',options:[{k:'A',t:'标准盒模型（content-box）的 width 包含 padding 和 border'},{k:'B',t:'IE 盒模型（border-box）的 width 包含 content、padding 和 border'},{k:'C',t:'margin 会影响元素自身的背景色显示范围'},{k:'D',t:'box-sizing 的默认值是 border-box'}],answer:'B',point:'考察 CSS 盒模型与 box-sizing 的理解。',tips:['从 content/padding/border/margin 四层讲起','对比 width 包含范围的差异','提到 box-sizing:border-box 的常见用法'],ans:['标准盒模型（content-box）：width 只包含 content，padding 和 border 会额外撑大元素。','IE 盒模型（border-box）：width 包含 content + padding + border，布局更可控，常全局设置 *{box-sizing:border-box}。','margin 是盒模型最外层，不影响元素自身背景，只影响与其他元素的间距；box-sizing 默认值是 content-box。']},
  {id:'wfe2',scene:'fe',lv:2,qtype:'single',q:'关于 JavaScript 事件循环，下列执行顺序正确的是？',options:[{k:'A',t:'同步代码 → 取一个宏任务 → 清空所有微任务'},{k:'B',t:'同步代码 → 清空所有微任务 → 取一个宏任务 → 再清空微任务'},{k:'C',t:'微任务全部执行完才开始执行同步代码'},{k:'D',t:'setTimeout 的回调属于微任务'}],answer:'B',point:'考察 JS 异步机制，前端高频题。',tips:['先讲调用栈与任务队列','区分宏/微任务及执行顺序','举 setTimeout + Promise 的例子'],ans:['JS 单线程，通过事件循环处理异步：调用栈先执行同步代码，异步任务完成后进入任务队列。','宏任务：setTimeout、setInterval、I/O、UI 渲染；微任务：Promise.then、MutationObserver、queueMicrotask。','顺序：同步代码 → 清空所有微任务 → 取一个宏任务执行 → 再清空微任务，循环往复。']},
  {id:'wfe3',scene:'fe',lv:2,qtype:'short',q:'什么是闭包（closure）？请举一个实际应用场景。',answer:'闭包 = 函数与其词法作用域的组合，外层函数执行完后内部函数仍可访问外层变量。',point:'考察作用域与闭包，前端核心概念。',tips:['定义：函数与其词法作用域的组合','说明能访问外层函数变量','举防抖/节流或模块化例子'],ans:['闭包是函数与其词法作用域的组合，外层函数执行完后，内部函数仍能访问外层变量。','应用：防抖/节流用闭包保存定时器 id；函数柯里化；模块化封装私有变量。','注意：闭包持有外层变量引用，滥用可能导致内存泄漏。']},
  {id:'wfe4',scene:'fe',lv:1,qtype:'short',q:'HTML5 新增了哪些常用语义化标签？为什么要用语义化标签？',answer:'header/nav/main/section/article/aside/footer 等；利于 SEO 与屏幕阅读器理解。',point:'考察 HTML 基础与可访问性意识。',tips:['列举 header/nav/main/section/article/aside/footer','说明对 SEO 和读屏器的好处','对比 div 的无语义问题'],ans:['常用语义化标签：<header>、<nav>、<main>、<section>、<article>、<aside>、<footer>、<figure> 等。','好处：结构清晰利于 SEO；便于读屏器等辅助技术理解页面；代码可读性更好。']},
  {id:'wfe5',scene:'fe',lv:3,qtype:'short',q:'请解释浏览器输入 URL 到页面渲染的完整过程。',answer:'DNS 解析 → TCP 连接 → HTTP 请求/响应 → 构建 DOM/CSSOM → 渲染树 → 布局绘制 → 合成。',point:'考察网络与渲染原理，前端综合题。',tips:['按 DNS→TCP→HTTP→解析→渲染 链路讲','提到关键渲染路径','不要漏掉回流与重绘'],ans:['1) DNS 解析域名到 IP；2) 建立 TCP 连接（三次握手）；3) 发送 HTTP 请求，服务器返回 HTML；4) 解析 HTML 构建 DOM，解析 CSS 构建 CSSOM；5) 合并为渲染树，布局（回流）与绘制；6) 合成图层显示。']},
  {id:'wfe6',scene:'fe',lv:2,qtype:'single',q:'关于列表渲染中 key 的作用，下列说法错误的是？',options:[{k:'A',t:'key 是虚拟 DOM 节点的唯一标识，用于 diff 对比'},{k:'B',t:'没有 key 时可能按位置复用错误的节点状态'},{k:'C',t:'用数组下标 index 当 key 永远是最安全的做法'},{k:'D',t:'应使用稳定且唯一的 id 作为 key'}],answer:'C',point:'考察虚拟 DOM diff 算法理解。',tips:['key 是节点的唯一标识','对比有无 key 时 diff 的差异','提醒不要用 index 当 key'],ans:['key 是虚拟 DOM 节点的唯一标识，用于 diff 算法高效对比新旧节点，判断哪些可复用、哪些需增删。','没有 key 时按位置对比，可能复用错误的节点状态（如输入框内容错位）。','用数组 index 当 key 并不安全：列表顺序变化时 index 会变，可能导致错误复用，应使用稳定唯一的 id。']},
  {id:'wal1',scene:'algo',lv:1,qtype:'short',q:'实现一个函数，判断一个字符串是否为回文串。',answer:'左右双指针从两端向中间逼近，跳过非字母数字、忽略大小写比较；时间 O(n)，空间 O(1)。',point:'考察字符串处理与双指针基础。',tips:['考虑过滤非字母数字、忽略大小写','双指针从两端向中间逼近','时间复杂度 O(n)'],ans:['用左右双指针指向首尾，跳过非字母数字字符，比较两端（忽略大小写），相等则向中间移动直到相遇。','时间复杂度 O(n)，空间复杂度 O(1)。注意大小写归一化与字符过滤。']},
  {id:'wal2',scene:'algo',lv:2,qtype:'single',q:'两数之和问题（返回两数下标），用哈希表优化后的时间复杂度是？',options:[{k:'A',t:'O(n²)'},{k:'B',t:'O(n log n)'},{k:'C',t:'O(n)'},{k:'D',t:'O(log n)'}],answer:'C',point:'考察哈希表优化，LeetCode 第一题。',tips:['暴力 O(n²)，用哈希表降到 O(n)','遍历查 map 中是否已有 target-nums[i]','边遍历边存，一次完成'],ans:['用哈希表记录已遍历数字及下标：遍历到 nums[i] 时算 need = target - nums[i]，若 map 已有 need 则返回 [map[need], i]，否则存入 nums[i]。','只遍历一遍数组，每次哈希查询 O(1)，故时间复杂度 O(n)，空间复杂度 O(n)。']},
  {id:'wal3',scene:'algo',lv:2,qtype:'single',q:'二分查找的时间复杂度是？',options:[{k:'A',t:'O(n)'},{k:'B',t:'O(n²)'},{k:'C',t:'O(log n)'},{k:'D',t:'O(1)'}],answer:'C',point:'考察算法分析基础。',tips:['随输入规模 n 增长的趋势','大 O 表示法取最高阶、忽略常数','每次比较后搜索区间减半'],ans:['二分查找每次比较都把搜索区间缩小一半，递推式 T(n)=T(n/2)+O(1)，故时间复杂度为 O(log n)。']},
  {id:'wal4',scene:'algo',lv:2,qtype:'single',q:'下列排序算法中，属于稳定排序的是？',options:[{k:'A',t:'快速排序'},{k:'B',t:'堆排序'},{k:'C',t:'选择排序'},{k:'D',t:'归并排序'}],answer:'D',point:'考察排序算法基础。',tips:['列各排序的复杂度','稳定=相等元素相对顺序不变','快排不稳定，归并/冒泡/插入稳定'],ans:['稳定排序指相等元素排序后相对顺序不变。冒泡、插入、归并是稳定排序；选择、快排、堆排不稳定。']},
  {id:'wal5',scene:'algo',lv:3,qtype:'short',q:'如何反转一个单链表？写出递归与迭代两种思路。',answer:'迭代用三指针 pre/cur/next 逐步翻转；递归到尾节点后回溯翻转指针；注意空链表与单节点边界。',point:'考察链表操作，高频题。',tips:['迭代：三指针 pre/cur/next 翻转','递归：先到尾再回溯翻转','注意空链表和单节点边界'],ans:['迭代：用 pre、cur、next 三指针，循环保存 next，将 cur.next 指向 pre，再 pre=cur、cur=next 直到 cur 为空。','递归：递归到最后一个节点作新头，回溯时 head.next.next = head，head.next = null。注意空链表/单节点直接返回。']},
  {id:'wal6',scene:'algo',lv:3,qtype:'single',q:'中序遍历一棵二叉搜索树，得到的序列是？',options:[{k:'A',t:'随机顺序'},{k:'B',t:'降序序列'},{k:'C',t:'升序序列'},{k:'D',t:'层序序列'}],answer:'C',point:'考察二叉树遍历基础。',tips:['前序：根→左→右','中序：左→根→右','二叉搜索树左小右大'],ans:['中序遍历顺序为 左子树 → 根 → 右子树；二叉搜索树满足左 < 根 < 右，因此中序遍历得到升序序列。']},
  {id:'wx1',scene:'xingce',lv:1,qtype:'single',q:'言语理解：选择最恰当的词语填空——"他的讲话内容空洞，毫无新意，实在令人 ____。"',options:[{k:'A',t:'乏味'},{k:'B',t:'兴奋'},{k:'C',t:'动容'},{k:'D',t:'振奋'}],answer:'A',point:'考察词语辨析与语境理解。',tips:['分析语境为负面评价','辨析选项语义轻重与搭配','"乏味"最贴合'],ans:['语境是对讲话的负面评价，"乏味"指缺乏趣味，与"内容空洞、毫无新意"最匹配；其余三个均为正面或积极情绪，与语境矛盾。']},
  {id:'wx2',scene:'xingce',lv:2,qtype:'single',q:'数量关系：一项工程甲单独做 12 天完成，乙单独做 18 天完成，两人合作几天完成？',options:[{k:'A',t:'6 天'},{k:'B',t:'7.2 天'},{k:'C',t:'9 天'},{k:'D',t:'15 天'}],answer:'B',point:'考察工程问题，设总工程量为 1。',tips:['甲效率 1/12，乙效率 1/18','合作效率相加','总量 1 除以合作效率'],ans:['设总工程量为 1，合作效率 = 1/12 + 1/18 = 5/36，合作时间 = 1 ÷ (5/36) = 7.2 天。']},
  {id:'wx3',scene:'xingce',lv:2,qtype:'judge',q:'逻辑推理：所有玫瑰都是花，有些花很快凋谢，所以有些玫瑰很快凋谢。这个推理是否正确？',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察三段论逻辑。',tips:['分析中项"花"是否周延','"有些花"推不出"有些玫瑰"','犯中项不周延错误'],ans:['不正确。三段论中项"花"在两个前提中都不周延，无法建立玫瑰与"很快凋谢"的必然联系，犯了"中项不周延"的逻辑错误。']},
  {id:'wx4',scene:'xingce',lv:1,qtype:'single',q:'资料分析：某公司今年营收 1200 万，同比增长 20%，去年营收是多少？',options:[{k:'A',t:'960 万'},{k:'B',t:'1000 万'},{k:'C',t:'1080 万'},{k:'D',t:'1440 万'}],answer:'B',point:'考察基期量计算。',tips:['基期 = 现期 ÷ (1+增长率)','1200 ÷ 1.2','结果 1000 万'],ans:['基期量 = 现期量 ÷ (1+增长率) = 1200 ÷ 1.2 = 1000 万。']},
  {id:'wx5',scene:'xingce',lv:3,qtype:'single',q:'数字推理：找规律——2, 6, 12, 20, 30, ( ? )',options:[{k:'A',t:'36'},{k:'B',t:'40'},{k:'C',t:'42'},{k:'D',t:'44'}],answer:'C',point:'考察数字推理。',tips:['相邻差：4,6,8,10','差是公差 2 的等差','下一个差 12，填 42'],ans:['相邻差依次为 4、6、8、10，是公差 2 的等差数列，下一个差为 12，括号填 30+12 = 42。']},
  {id:'wx6',scene:'xingce',lv:2,qtype:'single',q:'定义判断："鲶鱼效应"指引入强者激活群体，下列哪项最能体现该效应？',options:[{k:'A',t:'公司给全体员工统一涨薪 5%'},{k:'B',t:'团队引入一名业绩顶尖的新人，老员工紧迫感增强、整体效率提升'},{k:'C',t:'部门取消考勤制度'},{k:'D',t:'公司更换了办公场地'}],answer:'B',point:'考察定义理解与应用。',tips:['抓核心：引入强者→激活群体','逐项对照核心','选符合外部刺激激活内部的'],ans:['紧扣核心：通过引入外部强者/竞争刺激原有群体变活跃。B 项"引入顶尖新人→老员工紧迫感增强、效率提升"完全符合；其余选项均不涉及"引入强者激活群体"。']},
  {id:'wfe7',scene:'fe',lv:1,qtype:'single',q:'localStorage 与 sessionStorage 的主要区别是？',options:[{k:'A',t:'localStorage 关闭浏览器即清空，sessionStorage 永久保存'},{k:'B',t:'sessionStorage 会话结束（关标签页）即清空，localStorage 持久保存'},{k:'C',t:'两者都会随浏览器关闭清空'},{k:'D',t:'localStorage 只能存字符串，sessionStorage 可以存对象'}],answer:'B',point:'考察 Web 存储的生命周期理解。',tips:['从「会话级 vs 持久级」切入','注意两者都只能存字符串，存对象需 JSON 序列化'],ans:['sessionStorage 生命周期是当前标签页会话，关闭标签页即清空；localStorage 持久保存，除非手动清除或清浏览器数据。','两者都只能存字符串：存对象要 JSON.stringify，取出来 JSON.parse。']},
  {id:'wfe8',scene:'fe',lv:1,qtype:'single',q:'CSS 中选择器优先级最高的是？',options:[{k:'A',t:'.card .title（两个类）'},{k:'B',t:'#main-title（ID）'},{k:'C',t:'div span.title（两个元素+一个类）'},{k:'D',t:'*.title（通配+类）'}],answer:'B',point:'考察选择器优先级（特异性）计算。',tips:['优先级：!important > 内联 > ID > 类/伪类/属性 > 元素/伪元素','同级数量多者优先'],ans:['特异性按 (ID, 类/伪类/属性, 元素/伪元素) 逐位比较：ID 选择器权重最高，本题 #main-title 独占 ID 位直接胜出。','!important 和内联 style 会覆盖一切普通规则，但使用 !important 应克制。']},
  {id:'wfe9',scene:'fe',lv:1,qtype:'single',q:'flex 布局中，justify-content:space-between 的效果是？',options:[{k:'A',t:'项目紧靠主轴起点排列'},{k:'B',t:'两端对齐，项目之间间隔相等'},{k:'C',t:'每个项目两侧间隔相等（项目与容器边缘也有间隔）'},{k:'D',t:'交叉轴两端对齐'}],answer:'B',point:'考察 flex 主轴对齐方式。',tips:['space-between：两端贴边、中间均分','space-around：项目两侧间隔相等（边缘间隔是中间的一半）','space-evenly：完全均分'],ans:['space-between 把首尾项目贴主轴两端，剩余空间平均分配给项目之间的间隔。','区分 space-around（两侧间隔、边缘为中间一半）与 space-evenly（所有间隔含边缘完全相等）。']},
  {id:'wfe10',scene:'fe',lv:1,qtype:'single',q:"console.log(2=='2') 与 console.log(2==='2') 的输出分别是？",options:[{k:'A',t:'true、true'},{k:'B',t:'true、false'},{k:'C',t:'false、false'},{k:'D',t:'false、true'}],answer:'B',point:'考察 == 与 === 的区别，笔试常考。',tips:['== 会隐式类型转换','=== 不转换类型，类型不同直接 false'],ans:['== 比较前会把字符串 \'2\' 隐式转成数字 2，返回 true；=== 要求类型和值都相同，number 与 string 类型不同返回 false。','规范建议除 null/undefined 判断外一律用 ===，避免隐式转换带来的隐蔽 bug。']},
  {id:'wfe11',scene:'fe',lv:2,qtype:'single',q:'关于 var、let、const 的变量提升，正确的是？',options:[{k:'A',t:'三者都会提升，行为完全一致'},{k:'B',t:'var 声明提升且初始化为 undefined，let/const 提升但处于暂时性死区'},{k:'C',t:'let 和 const 不存在提升'},{k:'D',t:'const 声明的值不可修改，所以不分配内存'}],answer:'B',point:'考察三种声明方式与暂时性死区。',tips:['var 有「声明+初始化」提升','let/const 只提升声明不初始化，访问即 ReferenceError（TDZ）','const 是绑定不可变，对象内容仍可改'],ans:['var 在词法阶段被提升并初始化为 undefined；let/const 同样会被创建（提升）但在执行到声明语句前处于暂时性死区，访问会报 ReferenceError。','const 限制的是「绑定不可重新赋值」，对象属性依然可以修改；需要完全不可变要配合 Object.freeze。']},
  {id:'wfe12',scene:'fe',lv:2,qtype:'single',q:'Promise 有哪几种状态？状态能否变更多次？',options:[{k:'A',t:'pending / fulfilled / rejected；一旦落定不可再变'},{k:'B',t:'success / error；可多次变更'},{k:'C',t:'pending / done；可反复切换'},{k:'D',t:'只有成功和失败两种状态'}],answer:'A',point:'考察 Promise 基本语义。',tips:['三态：等待 / 已完成 / 已拒绝','状态「落定（settled）」后不可逆'],ans:['Promise 有 pending（等待）、fulfilled（已完成）、rejected（已拒绝）三种状态；从 pending 到 fulfilled 或 rejected 后即 settled，永远不会再变。','resolve 后再调 reject 会被忽略，这正是「状态机」设计的核心。']},
  {id:'wfe13',scene:'fe',lv:1,qtype:'single',q:'display:none 与 visibility:hidden 的区别是？',options:[{k:'A',t:'两者都脱离文档流'},{k:'B',t:'display:none 不占空间且不响应事件，visibility:hidden 仍占空间'},{k:'C',t:'visibility:hidden 会触发重排，display:none 不会'},{k:'D',t:'没有区别，只是写法不同'}],answer:'B',point:'考察隐藏元素的渲染差异。',tips:['display:none：脱离渲染树，触发重排','visibility:hidden：占位保留，只重绘不重排','opacity:0 仍可接收事件，前两者不响应点击'],ans:['display:none 让元素从渲染树移除，不占空间，切换会触发重排；visibility:hidden 保留布局占位，只是不可见。','面试常追问 opacity:0：视觉不可见但占位且能接收点击事件，与两者都不同。']},
  {id:'wfe14',scene:'fe',lv:1,qtype:'single',q:'下列哪个是块级元素？',options:[{k:'A',t:'<span>'},{k:'B',t:'<a>'},{k:'C',t:'<div>'},{k:'D',t:'<strong>'}],answer:'C',point:'考察块级 / 行内元素基础。',tips:['块级独占一行可设宽高：div/p/ul/h1 等','行内不换行宽高无效：span/a/strong/em','img/input 是行内替换元素，可设宽高'],ans:['<div> 是典型块级元素，独占一行且可设置宽高。','span、a、strong 都是行内元素；img 虽然写法像行内，但属于可替换元素，能设置宽高。']},
  {id:'wfe15',scene:'fe',lv:1,qtype:'short',q:'写出至少两种 JavaScript 数组去重的方法。',answer:'[...new Set(arr)]、filter + indexOf、双重循环、reduce 等。',point:'考察数组操作基本功。',tips:['首选 ES6 Set 一行搞定','filter+indexOf 兼容性好','注意 NaN 与对象引用的去重差异'],ans:['最简洁：[...new Set(arr)]，Set 天然去重。','filter 版：arr.filter((v,i)=>arr.indexOf(v)===i)。','注意：Set 对 NaN 视为相同可去重，而 indexOf 用 === 判断 NaN 永远找不到；对象元素去重要按 key 处理，不能直接比引用。']},
  {id:'wfe16',scene:'fe',lv:2,qtype:'single',q:'普通函数调用中（非严格模式），函数内 this 指向？',options:[{k:'A',t:'定义函数时的外层作用域'},{k:'B',t:'全局对象 window'},{k:'C',t:'undefined'},{k:'D',t:'总是 new 出来的实例'}],answer:'B',point:'考察 this 绑定规则。',tips:['默认绑定 → window（非严格模式）','隐式绑定 → 调用者对象','new 绑定 → 新实例；箭头函数无自己的 this'],ans:['独立调用的普通函数 this 默认指向全局对象（浏览器为 window），严格模式下是 undefined。','this 由「调用方式」决定：谁调用指向谁；箭头函数没有自己的 this，沿用定义时的外层 this，这也是回调中常用箭头函数的原因。']},
  {id:'wfe17',scene:'fe',lv:2,qtype:'single',q:'关于深拷贝与浅拷贝，说法正确的是？',options:[{k:'A',t:'Object.assign 是深拷贝'},{k:'B',t:'浅拷贝只复制第一层引用，嵌套对象仍共享'},{k:'C',t:'JSON.parse(JSON.stringify(obj)) 可以保留函数和 undefined'},{k:'D',t:'扩展运算符 {...obj} 是深拷贝'}],answer:'B',point:'考察引用类型复制语义。',tips:['Object.assign / 展开运算符都是浅拷贝','JSON 方式会丢函数、undefined、Symbol，循环引用直接报错','structuredClone 是新标准深拷贝'],ans:['浅拷贝只复制对象第一层，第二层开始仍是同一引用，改嵌套属性会互相影响；Object.assign 和 {...obj} 都属于浅拷贝。','JSON 方式无法保留函数、undefined、循环引用；现代浏览器可用 structuredClone 做真深拷贝，或手写递归。']},
  {id:'wfe18',scene:'fe',lv:2,qtype:'single',q:'浏览器跨域请求被拦截，是因为哪个安全策略？',options:[{k:'A',t:'同源策略（Same-Origin Policy）'},{k:'B',t:'CSP 内容安全策略'},{k:'C',t:'HTTPS 证书校验'},{k:'D',t:'CORS 预检请求'}],answer:'A',point:'考察浏览器安全基础。',tips:['同源 = 协议+域名+端口 全一致','CORS 是服务端授权跨域的官方方案','CSP 防的是 XSS 注入'],ans:['同源策略限制不同源的脚本读取响应，是浏览器内置的安全机制。','解决跨域的主流方案：服务端返回 CORS 头（Access-Control-Allow-Origin）、开发环境代理、JSONP（历史方案）。CSP 用于防 XSS，与跨域无关。']},
  {id:'wfe19',scene:'fe',lv:2,qtype:'judge',q:'cookie 会随同源（及设置域内）的每次 HTTP 请求自动携带到服务器。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察 cookie 与 Web Storage 的传输差异。',tips:['cookie 每次 HTTP 请求自动带上','localStorage/sessionStorage 纯本地，不参与请求'],ans:['cookie 设计初衷就是服务端会话标识，每次请求自动附加在请求头（受 domain/path 限制），因此要控制体积（约 4KB）并合理设置 HttpOnly、Secure、SameSite。','localStorage 不会自动发送到服务器，适合存前端本地数据。']},
  {id:'wfe20',scene:'fe',lv:2,qtype:'single',q:'事件传播的三个阶段顺序是？',options:[{k:'A',t:'冒泡 → 目标 → 捕获'},{k:'B',t:'捕获 → 目标 → 冒泡'},{k:'C',t:'目标 → 捕获 → 冒泡'},{k:'D',t:'只有冒泡一个阶段'}],answer:'B',point:'考察 DOM 事件流。',tips:['捕获从 window 向下','目标阶段触发监听','冒泡向上逐层传播','addEventListener 第三参 true 表示捕获期监听'],ans:['事件流：捕获阶段（window→document→…→父级）→ 目标阶段（触发元素自身）→ 冒泡阶段（逐级向上）。','addEventListener 第三参数为 true 时在捕获期监听；事件委托正是利用冒泡把子元素事件统一交给父级处理，减少监听器数量。']},
  {id:'wfe21',scene:'fe',lv:2,qtype:'single',q:'async 函数中 await 一个 rejected 的 Promise，正确捕获方式是？',options:[{k:'A',t:'自动被 console 吞掉，无需处理'},{k:'B',t:'用 try...catch 包裹 await 语句'},{k:'C',t:'只能用 .then 的第二个参数'},{k:'D',t:'await 会把错误转成 undefined 返回'}],answer:'B',point:'考察异步错误处理。',tips:['await 的拒绝等价于同步抛错','try/catch 或 .catch 都可','未捕获会触发 unhandledrejection'],ans:['await 一个 rejected Promise 会在该行抛出异常，用 try...catch 捕获即可，也可以对整个 async 调用链 .catch。','错误若无人接住会变成 unhandledrejection，生产环境应全局监听兜底上报。']},
  {id:'wfe22',scene:'fe',lv:2,qtype:'single',q:'box-sizing:border-box 时，设 width:100px; padding:10px; border:5px，元素实际总宽是？',options:[{k:'A',t:'130px'},{k:'B',t:'100px'},{k:'C',t:'110px'},{k:'D',t:'120px'}],answer:'B',point:'考察盒模型计算。',tips:['border-box：width 已含 padding+border','content-box：总宽 = width+padding+border'],ans:['border-box 下 width:100px 表示「内容+内边距+边框」合计 100px，总宽就是 100px（内容区被压缩为 70px）。','若为默认 content-box，总宽则是 100+20+10=130px——这就是全局设置 border-box 让布局可控的原因。']},
  {id:'wfe23',scene:'fe',lv:2,qtype:'single',q:'rem 与 em 的区别是？',options:[{k:'A',t:'rem 相对父元素字号，em 相对根元素字号'},{k:'B',t:'rem 相对根元素（html）字号，em 相对自身或父元素字号'},{k:'C',t:'两者都相对视口宽度'},{k:'D',t:'rem 是固定单位不受任何影响'}],answer:'B',point:'考察相对单位。',tips:['rem → root em','em → 当前/父级字号，会叠加放大','vw/vh 才是相对视口'],ans:['rem 基于根元素 html 的 font-size（常配合移动端方案：根字号随屏宽变化）；em 基于自身或最近父级的字号，嵌套时按倍数叠加。','相对视口的是 vw/vh，别混淆。']},
  {id:'wfe24',scene:'fe',lv:2,qtype:'single',q:'箭头函数与普通函数的关键区别是？',options:[{k:'A',t:'箭头函数运行更快'},{k:'B',t:'箭头函数没有自己的 this、arguments，不能作构造函数'},{k:'C',t:'箭头函数必须用 return'},{k:'D',t:'箭头函数不能有参数'}],answer:'B',point:'考察 ES6 箭头函数语义。',tips:['this 沿用定义时的外层','无 arguments（可用剩余参数替代）','不能 new，也没有 prototype'],ans:['箭头函数按词法作用域捕获外层 this，call/apply 无法改变；也没有 arguments、super 和 new.target，不能用 new 调用。','正因为 this 固定，箭头函数非常适合回调和事件处理中「保住外层 this」。']},
  {id:'wfe25',scene:'fe',lv:1,qtype:'single',q:"[1,2,3].map(x=>x*2) 与 [1,2,3].filter(x=>x>1) 的返回值分别是？",options:[{k:'A',t:'[2,4,6] 和 [1,2,3]'},{k:'B',t:'[2,4,6] 和 [2,3]'},{k:'C',t:'[2,4,6] 和 2'},{k:'D',t:'都返回 undefined'}],answer:'B',point:'考察数组高阶方法的返回语义。',tips:['map：逐个映射，长度不变','filter：按条件筛选，返回子集','forEach 无返回值'],ans:['map 对每个元素执行映射并返回同长度新数组 [2,4,6]；filter 返回满足条件的元素组成的新数组 [2,3]。','forEach/map 区别：forEach 只遍历无返回；两者都不会改变原数组。']},
  {id:'wfe26',scene:'fe',lv:1,qtype:'single',q:'JSON.stringify 的下列哪个说法是错误的？',options:[{k:'A',t:'undefined、函数、Symbol 在对象属性中会被忽略'},{k:'B',t:'NaN 和 Infinity 会被序列化为 null'},{k:'C',t:'序列化后的对象保留了原对象的方法'},{k:'D',t:'Date 对象会被转为 ISO 字符串'}],answer:'C',point:'考察 JSON 序列化边界行为。',tips:['JSON 只表达数据，不含函数','顶层 undefined 序列化结果是 undefined（非字符串）'],ans:['JSON.stringify 只处理数据，函数会被丢弃，因此「保留方法」说法错误——这也是它不能做完整深拷贝的原因。','NaN/Infinity → null、Date → ISO 字符串是常考细节；循环引用会抛 TypeError。']},
  {id:'wfe27',scene:'fe',lv:1,qtype:'judge',q:'HTML 标签名不区分大小写，<DIV> 与 <div> 等价。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察 HTML 基础语法。',tips:['HTML 解析器会把标签统一小写','属性名同样不区分大小写，但属性值区分'],ans:['HTML 是大小写不敏感的标记语言，<DIV> 会被解析为 div 元素；但 XHTML 与自定义组件（如 React 的 JSX）区分大小写，规范上统一写小写。']},
  {id:'wfe28',scene:'fe',lv:2,qtype:'judge',q:'CSS 中 !important 声明的样式优先级高于内联 style。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察优先级规则的极端情况。',tips:['!important > 内联 > ID > 类 > 元素','两者都加 !important 时内联胜出'],ans:['普通规则中内联样式优先级最高，但带 !important 的外部规则会覆盖它；若内联样式也带 !important，则内联仍胜出。','滥用 !important 会让样式难以维护，优先考虑提高选择器特异性。']},
  {id:'wfe29',scene:'fe',lv:2,qtype:'judge',q:'let 声明的顶层变量会成为 window 对象的属性。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察 let 与 var 在全局作用域的差异。',tips:['var 全局声明挂到 window','let/const 存在于脚本级词法环境，不挂 window'],ans:['var 在全局声明会注册为 window 属性；let/const 声明的变量保存在全局词法环境中，可通过作用域链访问但不会出现在 window 上——避免污染全局对象正是设计意图。']},
  {id:'wfe30',scene:'fe',lv:2,qtype:'judge',q:"Promise.all 传入的多个 Promise 中只要有一个 rejected，整体立即 rejected。",options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察 Promise 组合 API。',tips:['all：一败俱败','allSettled：全出结果','race：取第一个落定'],ans:['Promise.all 是「与」语义：任一失败立即整体 rejected（reject 的值是第一个失败的原因）；需要无论成败都拿到全部结果时用 Promise.allSettled；Promise.race 取最先落定的结果。']},
  {id:'wfe31',scene:'fe',lv:1,qtype:'multiple',q:'下列哪些是 HTML5 的语义化标签？（多选）',options:[{k:'A',t:'<header>'},{k:'B',t:'<article>'},{k:'C',t:'<blockquote>'},{k:'D',t:'<nav>'}],answer:['A','B','D'],point:'考察语义化标签识别。',tips:['blockquote 是 HTML4 就有的引用标签','HTML5 新增：header/footer/nav/article/section/aside/main/figure'],ans:['header、article、nav 都是 HTML5 新增的语义化结构标签；blockquote（引用块）并非 HTML5 新增，但也是语义标签——本题考的是 HTML5 新增集合。','语义化的价值：利于 SEO、可访问性（读屏器）与代码可维护性。']},
  {id:'wfe32',scene:'fe',lv:2,qtype:'multiple',q:'下列哪些属于宏任务（macrotask）？（多选）',options:[{k:'A',t:'setTimeout 回调'},{k:'B',t:'Promise.then 回调'},{k:'C',t:'setInterval 回调'},{k:'D',t:'I/O 操作回调'}],answer:['A','C','D'],point:'考察事件循环中的任务分类。',tips:['宏任务：setTimeout/setInterval/I/O/UI 渲染','微任务：Promise.then/queueMicrotask/MutationObserver'],ans:['setTimeout、setInterval 与 I/O 回调都是宏任务；Promise.then、queueMicrotask、MutationObserver 是微任务。','执行顺序：同步代码 → 清空全部微任务 → 取一个宏任务 → 再清空微任务，循环往复。']},
  {id:'wfe33',scene:'fe',lv:1,qtype:'fill',q:'CSS 中设置 box-sizing:____ 可让 width 属性包含 padding 和 border。',answer:'border-box',point:'考察盒模型切换属性值。',tips:['默认值是 content-box'],ans:['box-sizing:border-box 后，width/height 表示「内容+内边距+边框」的总尺寸，布局更直观，常全局设置 *{box-sizing:border-box}。']},
  {id:'wfe34',scene:'fe',lv:1,qtype:'fill',q:"typeof null 的返回值是____（注意带引号的字符串）。",answer:"'object'",point:'考察 JS 著名历史遗留 bug。',tips:['typeof 判数组用 Array.isArray 更可靠'],ans:["typeof null === 'object' 是 JS 初版实现遗留的类型标签 bug，无法修复（会影响兼容）。判断 null 用 value === null；判断数组用 Array.isArray。"]},
  {id:'wfe35',scene:'fe',lv:3,qtype:'short',q:'什么是 BFC？它会解决哪些布局问题？如何触发？',answer:'块级格式化上下文：独立渲染区域，内部布局不影响外部。触发：float 非 none、overflow 非 visible、position:absolute/fixed、display:flow-root 等。',point:'考察 CSS 布局核心概念。',tips:['先定义再讲三大应用场景','触发方式列举 3 个以上','提到 display:flow-root 这个现代方案'],ans:['BFC（Block Formatting Context）是一块独立的渲染区域，内部元素的布局不会影响外部。','解决的典型问题：①父元素高度塌陷（浮动子元素撑不开父级）——让父级形成 BFC；②margin 折叠——相邻元素分属不同 BFC 即不折叠；③浮动元素覆盖文字——文字容器形成 BFC 自动避让。','触发：根元素、float 非 none、position:absolute/fixed、overflow:hidden/auto、display:flow-root（语义最明确的现代方案）。']},
  {id:'wfe36',scene:'fe',lv:2,qtype:'short',q:'列举至少三种解决浏览器跨域的方案并简述原理。',answer:'CORS、代理服务器、JSONP；另有 postMessage、WebSocket 等。',point:'考察跨域方案体系。',tips:['CORS 是标准答案，讲清预检','开发环境 proxy 原理要讲「同源是浏览器行为」','JSONP 只支持 GET'],ans:['①CORS：服务端设置 Access-Control-Allow-Origin 等响应头授权跨域；非简单请求会先发 OPTIONS 预检。②代理：同源策略只是浏览器的限制，让同源服务器转发请求即可绕开（开发环境 webpack proxy / 生产 Nginx 反代）。③JSONP：利用 <script> 不受同源限制的漏洞，回调函数接收数据，只支持 GET，基本淘汰。','补充：window.postMessage 用于窗口间通信，WebSocket 自身不受同源策略限制。']},
  {id:'wfe37',scene:'fe',lv:2,qtype:'single',q:'sessionStorage 中保存的数据在什么情况下清空？',options:[{k:'A',t:'页面刷新即清空'},{k:'B',t:'关闭浏览器标签页/窗口后清空'},{k:'C',t:'电脑关机才清空'},{k:'D',t:'永远不会自动清空'}],answer:'B',point:'考察会话存储生命周期。',tips:['刷新页面不清空，新开标签页互不共享'],ans:['sessionStorage 按标签页隔离，刷新页面数据保留；关闭标签页（会话结束）才清空。','iframe 与多窗口各有一份独立 sessionStorage。']},
  {id:'wfe38',scene:'fe',lv:2,qtype:'single',q:'下列哪个操作不会触发浏览器重排（reflow）？',options:[{k:'A',t:'修改元素宽度 width'},{k:'B',t:'读取 offsetHeight'},{k:'C',t:'修改 color 颜色'},{k:'D',t:'插入新 DOM 节点'}],answer:'C',point:'考察渲染性能：重排 vs 重绘。',tips:['几何属性 → 重排；外观属性 → 仅重绘','读布局属性也会强制刷新队列'],ans:['改颜色只影响绘制层，触发重绘不重排；改宽高、增删节点、读 offsetTop/offsetHeight 都会触发或强制执行重排。','优化：批量改 class、动画用 transform/opacity（合成层）、避免读写交替。']},
  {id:'wfe39',scene:'fe',lv:2,qtype:'single',q:"flex 子项设置 flex:1 等价于？",options:[{k:'A',t:'flex-grow:1; flex-shrink:0; flex-basis:0%'},{k:'B',t:'flex-grow:1; flex-shrink:1; flex-basis:0%'},{k:'C',t:'flex-grow:0; flex-shrink:1; flex-basis:auto'},{k:'D',t:'flex-grow:1; flex-basis:100%'}],answer:'B',point:'考察 flex 简写展开规则（易错点）。',tips:['flex:1 的 basis 是 0%','flex:auto 的 basis 才是 auto'],ans:['flex:1 展开为 grow:1、shrink:1、basis:0%——子项按剩余空间比例分配、忽略内容尺寸。','flex:auto（grow:1 shrink:1 basis:auto）会先按内容分配再分剩余空间，两者效果不同，常考辨析。']},
  {id:'wfe40',scene:'fe',lv:1,qtype:'single',q:'HTTP 状态码 304 Not Modified 表示？',options:[{k:'A',t:'请求的资源永久重定向'},{k:'B',t:'协商缓存命中，可直接用本地缓存副本'},{k:'C',t:'服务器内部错误'},{k:'D',t:'资源暂时无法访问'}],answer:'B',point:'考察 HTTP 缓存状态码。',tips:['200 全量返回；304 协商缓存命中；404 不存在','304 响应没有 body，节省带宽'],ans:['浏览器带着 If-None-Match（ETag）或 If-Modified-Since 询问服务器，资源未变化时服务器返回 304（空 body），浏览器直接用本地副本——这是协商缓存命中的标志。']},
  {id:'wfe41',scene:'fe',lv:3,qtype:'single',q:'强缓存生效时，请求根本不会发到服务器，靠的是哪个响应头？',options:[{k:'A',t:'ETag'},{k:'B',t:'Cache-Control: max-age=xxx'},{k:'C',t:'Last-Modified'},{k:'D',t:'Set-Cookie'}],answer:'B',point:'考察强缓存与协商缓存的区别。',tips:['强缓存：Cache-Control/Expires，不发请求','协商缓存：ETag/Last-Modified，发请求验证'],ans:['Cache-Control: max-age 设定本地缓存有效期，期内请求直接读本地副本、完全不发网络请求（Expires 是旧版绝对时间）。','ETag/Last-Modified 用于协商缓存：每人都发一次验证请求，命中返回 304。']},
  {id:'wfe42',scene:'fe',lv:2,qtype:'single',q:'防范 XSS 攻击最有效的做法是？',options:[{k:'A',t:'把所有用户输入转义后再插入页面，富文本用白名单过滤'},{k:'B',t:'使用 HTTPS'},{k:'C',t:'禁用浏览器缓存'},{k:'D',t:'把 JS 代码全部放底部'}],answer:'A',point:'考察前端安全：XSS 防御。',tips:['XSS = 注入恶意脚本，核心是「不可信输入不得当 HTML 执行」','转义/白名单 + CSP + HttpOnly 组合拳'],ans:['XSS 是把恶意脚本注入页面执行，防御核心：插入 DOM 前对用户内容 HTML 转义（textContent 优于 innerHTML）、富文本走标签白名单过滤、配合 CSP 与 HttpOnly cookie 降低危害。','HTTPS 防的是传输窃听，与 XSS 无关。']},
  {id:'wfe43',scene:'fe',lv:1,qtype:'single',q:'搜索框输入联想（停止输入 500ms 后才请求）应该用？',options:[{k:'A',t:'节流 throttle'},{k:'B',t:'防抖 debounce'},{k:'C',t:'懒加载 lazyload'},{k:'D',t:'轮询 polling'}],answer:'B',point:'考察防抖节流的场景匹配。',tips:['防抖：等最后一次','节流：固定频率','联想/校验用防抖，滚动/拖拽用节流'],ans:['搜索联想关注「用户停下来了再搜」，属于防抖场景：每次输入重置定时器，停止 500ms 才发请求，避免每敲一个字就请求一次。','节流适合 scroll、mousemove 等需要固定频率响应的场景。']},
  {id:'wfe44',scene:'fe',lv:2,qtype:'single',q:'实现原型继承，Child.prototype = Object.create(Parent.prototype) 的作用是？',options:[{k:'A',t:'把 Parent 的实例属性复制给 Child'},{k:'B',t:'让 Child 的原型以 Parent 原型为原型，形成原型链'},{k:'C',t:'深拷贝 Parent.prototype'},{k:'D',t:'让 Child 与 Parent 共用同一个 prototype'}],answer:'B',point:'考察原型链继承机制。',tips:['Object.create 创建以指定对象为原型的新对象','实例属性用构造函数内 call 借用','class extends 是语法糖'],ans:['Object.create(Parent.prototype) 创建了一个原型指向 Parent.prototype 的对象，赋给 Child.prototype 后，Child 实例沿原型链能访问 Parent 原型方法。','注意：它不执行 Parent 构造函数（不复制实例属性），所以还要在 Child 里 Parent.call(this)；ES6 的 class/extends 本质是这套机制的语法糖。']},
  {id:'wfe45',scene:'fe',lv:2,qtype:'single',q:'事件委托（Event Delegation）的主要优点是？',options:[{k:'A',t:'事件响应速度一定更快'},{k:'B',t:'减少监听器数量，且新增子元素无需重新绑定'},{k:'C',t:'可以捕获阶段触发'},{k:'D',t:'避免所有内存泄漏'}],answer:'B',point:'考察事件委托的价值。',tips:['利用冒泡，父级统一处理','列表项动态增减场景尤其适合'],ans:['事件委托把子元素事件统一绑在共同父级，通过 e.target 识别真正来源：监听器数量从 N 个降到 1 个，动态新增的子元素天然生效，节省内存。','注意：focus/blur 等不冒泡事件不能用常规委托（可用 capture 或 focusin/focusout）。']},
  {id:'wfe46',scene:'fe',lv:1,qtype:'single',q:'GET 与 POST 的说法正确的是？',options:[{k:'A',t:'GET 参数有长度限制是因为 HTTP 协议规定的'},{k:'B',t:'POST 一定比 GET 安全，因为不可抓包'},{k:'C',t:'GET 参数在 URL 中、可被缓存收藏，POST 数据在请求体中'},{k:'D',t:'GET 只能获取，不能带参数'}],answer:'C',point:'考察 HTTP 方法语义。',tips:['URL 长度限制来自浏览器/服务器实现','POST 也可抓包，安全要靠 HTTPS'],ans:['GET 把参数放 URL，浏览器与服务器对 URL 长度有实现限制（非协议规定），可被缓存、收藏、记录在历史；POST 数据放 body，语义上用于提交。','两者明文传输都不安全，安全靠 HTTPS；POST 并非不可抓包。']},
  {id:'wfe47',scene:'fe',lv:2,qtype:'single',q:'Grid 与 Flex 布局的核心区别是？',options:[{k:'A',t:'Grid 只能横向布局'},{k:'B',t:'Flex 是一维布局（主轴方向），Grid 是二维布局（行+列同时规划）'},{k:'C',t:'Grid 兼容性更差已废弃'},{k:'D',t:'Flex 不能嵌套使用'}],answer:'B',point:'考察两大布局模型的定位。',tips:['一维流用 Flex','二维网格（页面骨架）用 Grid','两者可嵌套配合'],ans:['Flex 处理单一方向的弹性分布，适合导航栏、卡片列表等一维场景；Grid 按「行 × 列」同时划分区域，适合页面骨架、不规则网格。','现代开发两者嵌套使用：Grid 搭骨架、Flex 排内容。']},
  {id:'wfe48',scene:'fe',lv:2,qtype:'multiple',q:'下列哪些方式可以实现元素水平垂直居中？（多选）',options:[{k:'A',t:'flex 容器加 align-items:center; justify-content:center'},{k:'B',t:'position:absolute + top/left:50% + transform:translate(-50%,-50%)'},{k:'C',t:'display:grid + place-items:center'},{k:'D',t:'line-height 等于 height（仅适用单行文字的水平+垂直）'}],answer:['A','B','C'],point:'考察居中方案储备。',tips:['D 选项只能垂直居中单行文本，无水平居中能力'],ans:['A、B、C 都是标准方案：flex 通用性最强；absolute+transform 兼容老浏览器且不依赖父容器类型；grid 的 place-items:center 最简洁。','D（line-height:height）只能让单行文本垂直居中，水平居中还要配 text-align，描述不完整故不选。']},
  {id:'wfe49',scene:'fe',lv:3,qtype:'single',q:"console 输出顺序：setTimeout(()=>console.log(1)); Promise.resolve().then(()=>console.log(2)); console.log(3); 结果是？",options:[{k:'A',t:'1 2 3'},{k:'B',t:'3 2 1'},{k:'C',t:'3 1 2'},{k:'D',t:'2 3 1'}],answer:'B',point:'考察事件循环执行顺序（高频压轴题）。',tips:['同步 → 微任务 → 宏任务','console.log(3) 是同步','then 是微任务，setTimeout 是宏任务'],ans:['先执行同步代码输出 3；再清空微任务队列输出 2（Promise.then）；最后执行宏任务 setTimeout 输出 1。','记住顺序口诀：同步 → 微 → 宏；微任务一次清空，宏任务一次取一个。']},
  {id:'wfe50',scene:'fe',lv:2,qtype:'single',q:'setTimeout(fn, 0) 的含义是？',options:[{k:'A',t:'fn 立即同步执行'},{k:'B',t:'fn 在下一轮事件循环的宏任务中执行，且浏览器最小间隔约 4ms'},{k:'C',t:'fn 会在微任务之前执行'},{k:'D',t:'0 表示至少等 1 秒'}],answer:'B',point:'考察定时器真实语义。',tips:['setTimeout 是宏任务','嵌套 5 层以上最小 4ms','不会「立即」执行'],ans:['延迟 0ms 只是「尽早」，fn 仍要等当前同步代码和全部微任务执行完，进入下一轮宏任务才执行；浏览器对嵌套定时器还有约 4ms 的最小间隔。','想让代码「尽快但异步」可在 Promise 中调用（微任务时机更早）。']},
  {id:'wfe51',scene:'fe',lv:1,qtype:'multiple',q:'判断一个变量是否为数组，可靠的方法有哪些？（多选）',options:[{k:'A',t:'Array.isArray(v)'},{k:'B',t:'v instanceof Array'},{k:'C',t:'typeof v === "array"'},{k:'D',t:'Object.prototype.toString.call(v) === "[object Array]"'}],answer:['A','B','D'],point:'考察类型判断的坑。',tips:['typeof 数组返回 "object"','instanceof 跨 iframe 失效','toString.call 是最全面的方案'],ans:['Array.isArray 最直接可靠；instanceof 通常可用但跨 iframe/多 realm 会失效；Object.prototype.toString.call 万能。','typeof 无法区分数组与普通对象（都返回 "object"），C 是经典错误项。']},
  {id:'wfe52',scene:'fe',lv:1,qtype:'single',q:'null 与 undefined 的说法正确的是？',options:[{k:'A',t:'完全相同可以互换'},{k:'B',t:'undefined 表示「未定义/尚未赋值」，null 表示「有意的空值」'},{k:'C',t:'null 是 undefined 的子类型'},{k:'D',t:'undefined 会参与 JSON 序列化'}],answer:'B',point:'考察两个空值语义。',tips:['undefined：系统给的默认','null：开发者主动置空','JSON.stringify 会忽略对象中的 undefined 属性'],ans:['undefined 是变量声明未赋值、函数缺返回值时的默认值；null 是程序主动表示「空对象引用」。','== 两者相等（true），=== 不等；对象属性值为 undefined 时 JSON.stringify 直接跳过该键。']},
  {id:'wfe53',scene:'fe',lv:2,qtype:'single',q:"arr = [1,2,3,4,5]; arr.length = 2; 此时 arr 是？",options:[{k:'A',t:'报错，length 只读'},{k:'B',t:'[1,2]，多余元素被截断'},{k:'C',t:'[1,2,3,4,5]，赋值无效'},{k:'D',t:'[1,2,undefined,undefined,undefined]'}],answer:'B',point:'考察数组 length 的可写性。',tips:['length 可写，缩小即截断','扩大会在尾部补 empty 槽位'],ans:['数组 length 是可写属性：设小直接截断为 [1,2]；设大则尾部补空槽（不占用真实存储）。','清空数组惯用写法 arr.length = 0 就是利用这个特性。']},
  {id:'wfe54',scene:'fe',lv:1,qtype:'judge',q:'模板字符串（反引号）支持换行和 ${} 内嵌表达式。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察 ES6 模板字符串。',tips:['保留空格换行、支持表达式与函数调用','标签模板是其高级用法'],ans:['反引号字符串保留换行与缩进，${expression} 内可以是任意表达式甚至函数调用，比拼接字符串更清晰安全；高级用法还有标签模板（styled-components 的基础）。']},
  {id:'wfe55',scene:'fe',lv:2,qtype:'single',q:'ES Module 与 CommonJS 的说法错误的是？',options:[{k:'A',t:'ESM 是编译期确定依赖（静态），CJS 是运行时加载（动态）'},{k:'B',t:'ESM 导出的是值的引用绑定，CJS 导出的是值的拷贝'},{k:'C',t:'CJS 顶层 this 是 module，ESM 顶层 this 是 undefined'},{k:'D',t:'ESM 只能在 Node.js 中使用，浏览器不支持'}],answer:'D',point:'考察模块化体系对比。',tips:['浏览器原生 <script type="module"> 就是 ESM','Tree-shaking 依赖 ESM 静态性'],ans:['浏览器原生支持 ESM（<script type="module">），D 说法错误。','其余正确：ESM 静态分析利于 Tree-shaking，导出绑定实时同步；CJS require 运行时加载、值拷贝；顶层 this 分别为 undefined 与 module。']},
  {id:'wfe56',scene:'fe',lv:3,qtype:'multiple',q:'首屏性能优化手段有哪些？（多选）',options:[{k:'A',t:'路由/组件懒加载，按需加载代码'},{k:'B',t:'静态资源 gzip/br 压缩 + CDN 加速'},{k:'C',t:'关键 CSS 内联，JS 加 defer/async'},{k:'D',t:'图片懒加载与 WebP 格式'}],answer:['A','B','C','D'],point:'考察性能优化全景。',tips:['从「加载量、加载体、渲染时机」三条线归纳','再补白屏骨架屏/预加载'],ans:['首屏优化三主线：①少加载（懒加载、按需引入、压缩、Tree-shaking、CDN）；②加载快（HTTP2、缓存策略、图片 WebP/懒加载）；③渲染早（关键 CSS 内联、JS defer/async、骨架屏、SSR）。','答题时按线归类比罗列散点更显体系。']},
  {id:'wfe57',scene:'fe',lv:1,qtype:'judge',q:'localStorage 中的数据会被浏览器自动定期清理。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察存储持久性。',tips:['持久保存，除非手动清除','清除方式：removeItem/clear/用户清浏览器数据'],ans:['localStorage 是持久存储，浏览器不会自动清理（部分浏览器的隐私模式/存储压力策略除外）；要清只能 removeItem、clear，或用户手动清除浏览器数据。']},
  {id:'wfe58',scene:'fe',lv:1,qtype:'judge',q:':hover 是 CSS 伪元素（pseudo-element）。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察伪类与伪元素区分。',tips:['伪类单冒号：状态（:hover/:focus/:nth-child）','伪元素双冒号：虚拟节点（::before/::after/::placeholder）'],ans:[':hover 是伪类，表示元素的「状态」；::before、::after 才是伪元素，用于创建虚拟节点。单冒号 vs 双冒号是快速识别方法（旧规范伪元素也可单冒号，但现代一律写双冒号）。']},
  {id:'wfe59',scene:'fe',lv:1,qtype:'fill',q:"Array.isArray([]) 的返回值是____（true/false）。",answer:'true',point:'考察数组判断 API。',tips:['typeof [] 是 "object"'],ans:['Array.isArray 专用于判断数组，[] 返回 true；类数组对象（arguments、querySelectorAll 结果）返回 false，这是它优于 instanceof 的场景。']},
  {id:'wfe60',scene:'fe',lv:1,qtype:'fill',q:"typeof undefined 的返回值是____。",answer:"'undefined'",point:'考察 typeof 行为。',tips:['六种返回："undefined"/"number"/"string"/"boolean"/"object"/"function"（ES6 加 "symbol"/"bigint"'],ans:['typeof undefined 返回字符串 \'undefined\'——未声明的变量用 typeof 检测也返回 \'undefined\' 而不报错，这是它独有的安全特性。']},
  {id:'wfe61',scene:'fe',lv:3,qtype:'short',q:'简述浏览器事件循环（Event Loop）机制，并说明宏任务与微任务的执行顺序。',answer:'调用栈清空后先清空全部微任务队列，再取一个宏任务执行，随后再清微任务，循环往复。',point:'考察 JS 异步机制核心（笔试压轴）。',tips:['画执行顺序图：同步 → 微（一次清空）→ 宏（取一个）','举 setTimeout + Promise 输出题为例','提到微任务让异步「插队」的设计意义'],ans:['JS 单线程：同步代码在调用栈执行；异步完成后回调进入任务队列。事件循环每次取一个宏任务（setTimeout/setInterval/I/O/渲染），执行前先清空整个微任务队列（Promise.then/queueMicrotask/MutationObserver）。','因此微任务天然「插队」在同批宏任务之前；UI 渲染发生在宏任务之后（requestAnimationFrame 时机）。答题时给一个「同步 3 → 微 2 → 宏 1」的输出题演示最加分。']},
  {id:'wfe62',scene:'fe',lv:3,qtype:'short',q:'XSS 与 CSRF 的区别是什么？分别如何防范？',answer:'XSS：注入脚本窃取信息，靠转义/白名单/CSP 防；CSRF：伪造用户请求，靠 CSRF Token/SameSite/校验 Referer 防。',point:'考察两大 Web 攻击的对比（安全必考）。',tips:['先一句话区分攻击面：XSS 偷数据、CSRF 借身份','防范各列 3 条'],ans:['XSS（跨站脚本）：攻击者注入恶意 JS 在受害者浏览器执行，窃取 cookie/操作页面。防范：输出转义、富文本白名单、CSP、敏感 cookie 加 HttpOnly。','CSRF（跨站请求伪造）：攻击者借受害者已登录身份，诱导其浏览器向目标站发请求。防范：服务端下发 CSRF Token 校验、Cookie 设 SameSite=Lax/Strict、校验 Referer/Origin。','一句话记忆：XSS 需要「我能在你页面跑代码」，CSRF 只需要「你带着 cookie 点了我的链接」。']},
  {id:'wfe63',scene:'fe',lv:2,qtype:'single',q:'<script src="a.js" defer> 与 <script src="a.js" async> 的区别是？',options:[{k:'A',t:'完全相同'},{k:'B',t:'defer 下载不阻塞、DOM 解析完后按序执行；async 下载不阻塞、下载完立即执行且不保证顺序'},{k:'C',t:'两者都阻塞 HTML 解析'},{k:'D',t:'async 保证执行顺序'}],answer:'B',point:'考察脚本加载策略。',tips:['无属性：下载+执行都阻塞','defer：DOM ready 前按序执行','async：谁先下完谁先执行'],ans:['defer：并行下载，等 HTML 解析完、DOMContentLoaded 之前按出现顺序执行，适合依赖 DOM 的脚本；async：下载完立即执行，顺序不确定，适合独立脚本（如统计）。','普通 <script> 下载和执行都会阻塞解析，放 body 底部或加 defer 是常见优化。']},
  {id:'wfe64',scene:'fe',lv:2,qtype:'single',q:'后代选择器 .a .b 与子选择器 .a > .b 的区别是？',options:[{k:'A',t:'完全等价'},{k:'B',t:'.a .b 匹配任意层级后代；.a > .b 只匹配直接子元素'},{k:'C',t:'.a > .b 匹配任意层级；.a .b 只匹配子代'},{k:'D',t:'两者都不匹配嵌套元素'}],answer:'B',point:'考察选择器语义。',tips:['空格 = 后代（任意层级）','> = 直接子代','+ 相邻兄弟、~ 后续兄弟'],ans:['.a .b 选中 .a 内所有层级的 .b 后代；.a > .b 只选中 .a 的直接子元素 .b。','同族还有 +（紧邻下一个兄弟）、~（其后所有兄弟），笔试爱混在一起考。']},
  {id:'wfe65',scene:'fe',lv:2,qtype:'single',q:'opacity:0 与 visibility:hidden 都让元素不可见，共同点是？',options:[{k:'A',t:'都不占布局空间'},{k:'B',t:'都保留布局占位（不像 display:none 那样脱离文档流）'},{k:'C',t:'都不能参与 CSS 过渡动画'},{k:'D',t:'都阻止子元素显示'}],answer:'B',point:'考察三种隐藏方式的精细对比。',tips:['占位：visibility/opacity 占，display 不占','事件：visibility/opacity 拦，display 拦','过渡：opacity 可渐变，visibility 可配合延迟切换'],ans:['两者都保留布局占位，触发的是重绘（不重排）。差异：visibility:hidden 的子元素可单独设 visibility:visible 恢复显示，且不响应事件；opacity:0 仍响应点击，且能参与过渡动画（淡入淡出常用）。','display:none 三者中最「彻底」：不占位、不响应事件、离开渲染树。']},
  {id:'wfe66',scene:'fe',lv:2,qtype:'single',q:'协商缓存验证资源是否变化，依赖哪一对请求/响应头？',options:[{k:'A',t:'Cache-Control / Pragma'},{k:'B',t:'ETag / If-None-Match（或 Last-Modified / If-Modified-Since）'},{k:'C',t:'Content-Type / Accept'},{k:'D',t:'Connection / Keep-Alive'}],answer:'B',point:'考察协商缓存头部配对。',tips:['响应给指纹 ETag，请求回带 If-None-Match','时间对：Last-Modified ↔ If-Modified-Since'],ans:['服务器下发 ETag（资源指纹），浏览器下次带 If-None-Match 回去验证，一致返回 304；时间维度用 Last-Modified ↔ If-Modified-Since。','ETag 优先级更高（能解决秒级修改时间不准的问题）；Cache-Control 属于强缓存。']},
  {id:'wfe67',scene:'fe',lv:2,qtype:'single',q:'浏览器 localStorage 的典型容量上限约为？',options:[{k:'A',t:'4KB'},{k:'B',t:'5MB 左右（各浏览器略有差异）'},{k:'C',t:'500MB'},{k:'D',t:'无限制'}],answer:'B',point:'考察存储容量常识。',tips:['cookie ≈ 4KB；localStorage ≈ 5MB','更大容量走 IndexedDB'],ans:['localStorage 一般 5MB 左右（Chrome/Edge/Firefox 各有细微差异）；cookie 约 4KB 且每域数量有限；需要结构化大数据存储用 IndexedDB。']},
  {id:'wfe68',scene:'fe',lv:1,qtype:'single',q:'页面滚动加载更多，应对 scroll 高频触发的标准做法是？',options:[{k:'A',t:'防抖 debounce'},{k:'B',t:'节流 throttle'},{k:'C',t:'把监听从 window 换到 document 就不用优化'},{k:'D',t:'禁用滚动事件'}],answer:'B',point:'考察防抖节流的场景选择（与 wfe43 对照）。',tips:['scroll 需要持续响应 → 节流','停止后才动作 → 防抖','现代方案：IntersectionObserver 替代 scroll 监听'],ans:['滚动加载需要在滚动过程中按固定频率检查，用节流（如每 200ms 一次）；若用防抖则必须等用户完全停止滚动才触发，体验差。','更优方案是 IntersectionObserver 监听哨兵元素进入视口，从「高频事件」变成「回调通知」，性能更好。']},
  {id:'wfe69',scene:'fe',lv:1,qtype:'judge',q:'GET 请求的结果可以被浏览器缓存，POST 默认不被缓存。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察方法语义与缓存行为。',tips:['GET 幂等可缓存；POST 副作用不缓存'],ans:['GET 语义是「获取」，幂等且无副作用，浏览器/代理可缓存（配合 Cache-Control）；POST 语义是「提交」，有副作用，默认不缓存。这也是接口设计「查询用 GET、提交用 POST」的根据。']},
  {id:'wfe70',scene:'fe',lv:2,qtype:'judge',q:"JSON.stringify(undefined) 的返回值是字符串 \"undefined\"。",options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察 JSON 序列化边界。',tips:['对象中的 undefined 属性被忽略','顶层 undefined 序列化结果就是 undefined（非字符串）'],ans:['JSON.stringify(undefined) 返回 undefined（不是字符串）；数组中的 undefined 会被转为 null；对象属性值为 undefined 时该键被直接忽略。']},
  {id:'wfe71',scene:'fe',lv:1,qtype:'fill',q:'CSS 中让块内文字水平居中的属性是 text-align:____。',answer:'center',point:'考察基础属性。',tips:['text-align 控制行内内容的水平对齐','垂直居中是另一套方案（line-height/flex）'],ans:['text-align:center 让块级容器内的行内内容（文字、行内元素）水平居中；注意它控制的是「行内内容」而非块自身——块自身居中用 margin:0 auto。']},
  {id:'wfe72',scene:'fe',lv:1,qtype:'fill',q:'<a> 标签在新窗口打开链接，target 属性的值应为____。',answer:'_blank',point:'考察链接基础属性。',tips:['四个保留值：_self/_blank/_parent/_top','安全写法配合 rel="noopener"'],ans:['target="_blank" 在新标签页打开；建议同时加 rel="noopener noreferrer" 防止新页面通过 window.opener 操控原页面（钓鱼风险）。']},
  {id:'wfe73',scene:'fe',lv:3,qtype:'short',q:'描述浏览器缓存的完整工作流程（强缓存 + 协商缓存）。',answer:'先查强缓存（Cache-Control/Expires）命中直接用本地；未命中发请求带 If-None-Match/If-Modified-Since 协商，服务器 304 则用本地副本，否则 200 返回新资源。',point:'考察 HTTP 缓存体系（性能必考）。',tips:['按「不发请求 → 发验证请求 → 拉新资源」三层讲','提 ETag 与 Last-Modified 优先级'],ans:['①浏览器发起请求前先查本地缓存副本：Cache-Control: max-age 未过期（强缓存命中）→ 直接使用，不发网络请求（DevTools 显示 from disk/memory cache）。②强缓存失效 → 发请求携带 If-None-Match(ETag)/If-Modified-Since 协商：资源未变服务器回 304（无 body），浏览器用本地副本并刷新有效期。③资源已变 → 200 返回新资源和新指纹。','ETag 优先于 Last-Modified（前者能识别秒级内的内容变化）；Cache-Control 优先于 Expires。']},
  {id:'wfe74',scene:'fe',lv:1,qtype:'single',q:'下列哪个是 HTML5 为 <input> 新增的 type 类型？',options:[{k:'A',t:'text'},{k:'B',t:'password'},{k:'C',t:'email'},{k:'D',t:'radio'}],answer:'C',point:'考察 HTML5 表单增强。',tips:['HTML5 新增：email/url/tel/number/date/search/range/color','text/password/radio/checkbox 是 HTML4 就有的'],ans:['email 是 HTML5 新增类型，自带格式校验并唤起移动端邮箱键盘；text、password、radio 是传统类型。','HTML5 表单还有 placeholder、required、pattern 等校验属性，能减少大量手写校验代码。']},
  {id:'wal7',scene:'algo',lv:1,qtype:'single',q:'数组按下标随机访问元素的时间复杂度是？',options:[{k:'A',t:'O(1)'},{k:'B',t:'O(log n)'},{k:'C',t:'O(n)'},{k:'D',t:'O(n log n)'}],answer:'A',point:'考察数组随机访问特性。',tips:['连续内存 + 下标计算 = 直接寻址','插入删除才是 O(n)'],ans:['数组内存连续，访问 arr[i] 通过首地址+i*元素大小直接计算地址，时间复杂度 O(1)。','代价是插入/删除要移动元素，平均 O(n)——空间换时间的典型结构。']},
  {id:'wal8',scene:'algo',lv:1,qtype:'single',q:'单链表在已知节点后插入一个新节点的时间复杂度是？',options:[{k:'A',t:'O(1)'},{k:'B',t:'O(log n)'},{k:'C',t:'O(n)'},{k:'D',t:'O(n²)'}],answer:'A',point:'考察链表插入操作。',tips:['指针改向即可，无需移动元素','但按值查找定位是 O(n)'],ans:['已持有目标节点时，插入只需修改两个指针（new.next=p.next; p.next=new），O(1) 完成。','整体题目若问「在第 i 个位置插入」则要先遍历定位 O(n)。']},
  {id:'wal9',scene:'algo',lv:1,qtype:'single',q:'栈的特点是？',options:[{k:'A',t:'先进先出 FIFO'},{k:'B',t:'后进先出 LIFO'},{k:'C',t:'按优先级出队'},{k:'D',t:'任意位置可取'}],answer:'B',point:'考察栈与队列的基本语义。',tips:['栈：函数调用栈、括号匹配、撤销操作','队列：任务调度、BFS'],ans:['栈是后进先出（LIFO）：只能在栈顶进出，典型应用有函数调用栈、括号匹配、浏览器前进后退、撤销。','队列是先进先出（FIFO），典型应用是任务队列、BFS 层序遍历。']},
  {id:'wal10',scene:'algo',lv:2,qtype:'single',q:'二分查找的前提条件与时间复杂度是？',options:[{k:'A',t:'无需条件，O(n)'},{k:'B',t:'数组有序（或答案单调），O(log n)'},{k:'C',t:'元素互不相同，O(n log n)'},{k:'D',t:'链式存储，O(log n)'}],answer:'B',point:'考察二分查找适用条件。',tips:['有序或「单调性」是前提','每次范围减半','注意溢出写法 mid = left + (right-left)/2'],ans:['二分查找要求数据有序（或问题具有单调性，如旋转数组、第一个坏版本），每步把搜索区间减半，O(log n)。','笔试注意边界：left<=right、mid 防溢出写法、边界收缩 ±1，写错一格全盘皆输。']},
  {id:'wal11',scene:'algo',lv:2,qtype:'single',q:'哈希表平均查找复杂度与最坏复杂度分别是？',options:[{k:'A',t:'O(1)、O(n)'},{k:'B',t:'O(log n)、O(log n)'},{k:'C',t:'O(n)、O(n²)'},{k:'D',t:'O(1)、O(1)'}],answer:'A',point:'考察哈希表性能特征。',tips:['平均 O(1) 靠散列均匀','最坏全冲突退化为链表 O(n)','负载因子与扩容是关键'],ans:['哈希表通过散列函数直接定位桶，平均 O(1)；当散列设计差或所有键冲突时退化为链表扫描 O(n)。','工程上通过负载因子触发扩容（rehash）保持均摊 O(1)，JS 的 Map/Object 内部即如此。']},
  {id:'wal12',scene:'algo',lv:2,qtype:'single',q:'完全二叉树用数组存储，节点下标 i 的左孩子下标是？',options:[{k:'A',t:'i+1'},{k:'B',t:'2*i'},{k:'C',t:'2*i+1'},{k:'D',t:'2*i+2'}],answer:'C',point:'考察堆的数组表示（0 起始下标）。',tips:['0 起始：左 2i+1、右 2i+2、父 (i-1)/2','1 起始：左 2i、右 2i+1、父 i/2'],ans:['下标从 0 开始时：左孩子 2i+1、右孩子 2i+2、父节点 (i-1)/2（下取整）。','堆排序、优先队列都基于此映射，笔试若说「从 1 开始存储」则全部下标偏移一位，务必看清题面。']},
  {id:'wal13',scene:'algo',lv:2,qtype:'single',q:'二叉树的前序 / 中序 / 后序遍历中，根节点被访问的时机分别是？',options:[{k:'A',t:'中 / 前 / 后'},{k:'B',t:'前 / 中 / 后'},{k:'C',t:'后 / 前 / 中'},{k:'D',t:'都在最后访问'}],answer:'B',point:'考察三种 DFS 遍历的定义。',tips:['序=根的位置','中序 + BST → 升序序列','层序是 BFS 不是这三种'],ans:['前序（根左右）、中序（左根右）、后序（左右根）——名字即根的访问位置。','经典组合：前序+中序或后序+中序可唯一重建二叉树；BST 的中序遍历得到升序序列。']},
  {id:'wal14',scene:'algo',lv:2,qtype:'single',q:'冒泡排序的平均时间复杂度与是否稳定分别是？',options:[{k:'A',t:'O(n log n)、稳定'},{k:'B',t:'O(n²)、稳定'},{k:'C',t:'O(n²)、不稳定'},{k:'D',t:'O(n)、不稳定'}],answer:'B',point:'考察排序算法特性对比。',tips:['稳定：相邻交换不跨越相等元素','冒泡/插入/归并稳定；选择/快排/堆排不稳定'],ans:['冒泡排序两两比较相邻元素，平均与最坏 O(n²)，最好（已有序+提前退出优化）O(n)；相等元素不会互换位置，稳定。','记忆口诀：插冒归（稳定）vs 选快堆希（不稳定），希尔也不稳定。']},
  {id:'wal15',scene:'algo',lv:2,qtype:'single',q:'快排平均时间复杂度是？最坏情况出现在？',options:[{k:'A',t:'O(n log n)；数组已有序且基准取端点'},{k:'B',t:'O(n²)；任何情况'},{k:'C',t:'O(n log n)；数据完全随机'},{k:'D',t:'O(n)；元素很少时'}],answer:'A',point:'考察快排复杂度分析。',tips:['基准划分均匀 → log n 层','有序数据取首元素做基准 → 退化成 O(n²)','随机化基准/三数取中规避'],ans:['快排平均 O(n log n)：每次划分大致均分，递归深度 log n。若数组已有序且固定取第一个元素为基准，每次只能切出一个空区间，退化为 O(n²)。','工程实现用随机基准或三数取中避免退化；快排不稳定、原地排序省空间。']},
  {id:'wal16',scene:'algo',lv:2,qtype:'single',q:'归并排序的空间复杂度是？',options:[{k:'A',t:'O(1)'},{k:'B',t:'O(log n)'},{k:'C',t:'O(n)'},{k:'D',t:'O(n²)'}],answer:'C',point:'考察归并排序的辅助空间。',tips:['合并需要 O(n) 辅助数组','稳定且时间稳定 O(n log n)','代价就是空间'],ans:['归并排序合并两个有序段需要与原数组等长的辅助数组，空间 O(n)；时间稳定 O(n log n) 且排序稳定。','对比：快排 O(log n) 栈空间但不稳定；堆排 O(1) 空间也不稳定。']},
  {id:'wal17',scene:'algo',lv:2,qtype:'judge',q:'堆排序建立大顶堆后，每次将堆顶（最大值）与末尾元素交换并重新调整，最终得到升序序列。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察堆排序流程。',tips:['升序用大顶堆，降序用小顶堆','建堆 O(n)，调整每次 O(log n)'],ans:['堆排序流程：①自底向上建大顶堆 O(n)；②每次堆顶（当前最大）与末尾交换，堆规模减一，下沉调整 O(log n)；③重复 n-1 次，末尾从小到大积累 → 升序序列。','总复杂度 O(n log n)，原地 O(1) 空间，不稳定。']},
  {id:'wal18',scene:'algo',lv:1,qtype:'judge',q:'O(1) 的算法一定比 O(n) 的算法快。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察大 O 记号的理解。',tips:['大 O 描述增长趋势，隐藏常数','n 很小时常数项可能主导','是「规模足够大时的渐进对比」'],ans:['大 O 只描述随规模增长的趋势，忽略常数因子：O(1) 算法的常数若极大（如涉及大数运算），在 n 很小时可能比 O(n) 更慢。','渐进意义与实际性能要分开看，工程选型还要考虑缓存友好性等常数因素。']},
  {id:'wal19',scene:'algo',lv:1,qtype:'short',q:'说出数组与链表各自的优缺点及适用场景。',answer:'数组：随机访问 O(1)、缓存友好，插入删除 O(n)；链表：插入删除 O(1)、可变长，访问 O(n) 且指针开销大。',point:'考察基础数据结构对比。',tips:['从「访问 / 增删 / 内存分布」三维度展开','联系实际：数组适合读多写少、随机访问'],ans:['数组：内存连续，按下标随机访问 O(1)，CPU 缓存命中率高；插入删除需移动元素 O(n)，扩容要搬迁。适合读多写少、按下标访问的场景。','链表：节点离散、指针连接，任意位置插入删除 O(1)（已定位时）；访问第 i 个元素必须遍历 O(n)，且指针额外开销、缓存不友好。适合频繁增删、长度多变的场景。','实战：绝大多数语言默认用动态数组（vector/list of python 是数组），因为现代 CPU 缓存让连续内存优势巨大。']},
  {id:'wal20',scene:'algo',lv:2,qtype:'single',q:'用两个栈实现队列：入队 O(1)，出队均摊复杂度是？',options:[{k:'A',t:'O(1) 均摊'},{k:'B',t:'O(n) 每次都要倒腾'},{k:'C',t:'O(log n)'},{k:'D',t:'无法实现'}],answer:'A',point:'考察经典题「两个栈实现队列」分析。',tips:['出栈只在「出栈为空」时批量倒一次','每个元素最多被搬 2 次 → 均摊 O(1)'],ans:['入栈只压入栈；出栈若出栈非空直接 pop，为空则把入栈全部倒入出栈再 pop。每个元素一生最多被搬入和弹出各一次，均摊 O(1)。','「均摊分析」是本题的得分点，只会说「每次 O(n)」说明没理解摊还。']},
  {id:'wal21',scene:'algo',lv:2,qtype:'single',q:'有效的括号匹配（如 "{[()]}"）用什么结构求解最自然？',options:[{k:'A',t:'队列'},{k:'B',t:'栈'},{k:'C',t:'哈希表'},{k:'D',t:'堆'}],answer:'B',point:'考察栈的典型应用识别。',tips:['最近匹配 → 栈','左括号入栈，右括号弹栈比对','结束栈空且无剩余即匹配'],ans:['括号匹配是「最近的未闭合括号要先被闭合」，正是栈的 LIFO 特性：左括号入栈；右括号弹栈比对类型，不匹配即无效；扫描结束栈空才有效。','同类问题：函数调用栈、编辑器撤销、HTML 标签校验。']},
  {id:'wal22',scene:'algo',lv:2,qtype:'single',q:'广度优先搜索（BFS）通常借助什么辅助结构？',options:[{k:'A',t:'栈'},{k:'B',t:'队列'},{k:'C',t:'堆'},{k:'D',t:'并查集'}],answer:'B',point:'考察 BFS/DFS 的实现载体。',tips:['BFS=队列（层序）','DFS=栈/递归','最短无权路径用 BFS'],ans:['BFS 借助队列按层扩展，天然求无权图/网格最短步数；DFS 借助栈或递归深入到底，适合连通性、路径搜索、回溯。','带权最短路则交给 Dijkstra（贪心+优先队列）。']},
  {id:'wal23',scene:'algo',lv:2,qtype:'single',q:'在有序数组中查找「第一个大于等于 target 的位置」，应该用？',options:[{k:'A',t:'顺序查找'},{k:'B',t:'二分查找（左边界变体）'},{k:'C',t:'双指针从两端收缩'},{k:'D',t:'滑动窗口'}],answer:'B',point:'考察二分变体：lower_bound。',tips:['二分不止「找等于」，边界变体更常考','模板：r=mid 收左界 / l=mid+1 收右界'],ans:['「第一个 ≥ target」即 lower_bound，标准二分左边界变体：nums[mid]>=target 时 r=mid，否则 l=mid+1，结束时 l 即答案。','同类变体还有「最后一个 ≤ target」（upper_bound 减一）、旋转数组找最小值，套路统一：保持不变量、收缩区间。']},
  {id:'wal24',scene:'algo',lv:2,qtype:'single',q:'「有序数组中找两数之和等于 target」最适合的技巧是？',options:[{k:'A',t:'双层循环 O(n²)'},{k:'B',t:'左右双指针相向收缩'},{k:'C',t:'快速排序'},{k:'D',t:'动态规划'}],answer:'B',point:'考察双指针的适用场景。',tips:['有序 + 两端约束 → 双指针','和大了移右指针、小了移左指针','无序版用哈希表 O(n)'],ans:['有序数组两端之和：sum>target 右指针左移（减小），sum<target 左指针右移（增大），相等即答案，O(n) 时间 O(1) 空间。','无序版则用哈希表存「target-当前值」是否存在，同样 O(n)。选型依据就是「有没有序」。']},
  {id:'wal25',scene:'algo',lv:3,qtype:'single',q:'滑动窗口「无重复字符的最长子串」的时间复杂度是？',options:[{k:'A',t:'O(n²)'},{k:'B',t:'O(n log n)'},{k:'C',t:'O(n)——左右指针各最多走 n 步'},{k:'D',t:'O(1)'}],answer:'C',point:'考察滑动窗口复杂度分析。',tips:['两指针都单调右移','总步数 ≤ 2n','别被「嵌套 while」骗成 O(n²)'],ans:['左、右指针在整个过程中都只单调向右移动，最多各走 n 步，总操作 O(n)。','滑动窗口题的关键是识别「窗口单调性」：窗口扩/缩都有明确判据（如重复字符计数），绝不会来回震荡，因此均摊线性。']},
  {id:'wal26',scene:'algo',lv:2,qtype:'single',q:'斐波那契递归（无记忆化）的时间复杂度与改进方案是？',options:[{k:'A',t:'O(n)；无需改进'},{k:'B',t:'O(2ⁿ)；加记忆化或递推降至 O(n)'},{k:'C',t:'O(n log n)；用快排优化'},{k:'D',t:'O(log n)；天然如此'}],answer:'B',point:'考察重复子问题与记忆化。',tips:['画递归树：节点数指数级','memo 表把每个 f(i) 只算一次','矩阵快速幂还能到 O(log n)'],ans:['朴素递归展开成指数级递归树（大量重复计算），O(2ⁿ)；加 memo 数组缓存每个子问题结果，每个状态只算一次降为 O(n)。','进阶：矩阵快速幂可到 O(log n)。这是「动态规划」思想最直观的入门案例。']},
  {id:'wal27',scene:'algo',lv:2,qtype:'single',q:'动态规划适用的问题必须具备的两个性质是？',options:[{k:'A',t:'有序性和连通性'},{k:'B',t:'最优子结构与重叠子问题'},{k:'C',t:'贪心选择性质'},{k:'D',t:'无环性和二分性'}],answer:'B',point:'考察 DP 的适用判据。',tips:['最优子结构：大问题最优解含子问题最优解','重叠子问题：朴素递归会重复算 → 用表存','贪心选择性质是贪心算法的判据'],ans:['①最优子结构：问题的最优解可由子问题的最优解构造（无后效性）；②重叠子问题：递归展开中同一子问题反复出现，可用记忆化消除。','两者齐全 → DP；若「局部最优即全局最优」且可交换次序 → 贪心；两者皆无 → 回溯搜索。']},
  {id:'wal28',scene:'algo',lv:2,qtype:'judge',q:'贪心算法能得到全局最优解的前提是问题具有「贪心选择性质」，否则只能得到近似解。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察贪心算法的适用边界。',tips:['贪心选择性质：局部最优可导向全局最优','反例：0-1 背包不能用单价贪心','活动选择、区间调度是经典可用场景'],ans:['贪心每步取局部最优且不回退，只有在「贪心选择性质」（局部最优可扩展为全局最优）成立时才正确，通常需证明（交换论证）。','经典可用：活动选择、跳跃游戏、分发饼干；经典反例：0-1 背包贪心单价会错，必须 DP。']},
  {id:'wal29',scene:'algo',lv:2,qtype:'single',q:'图的 BFS 与 DFS 空间复杂度（邻接表存储）分别是？',options:[{k:'A',t:'都 O(V)（队列/栈与 visited 最多存全部顶点）'},{k:'B',t:'BFS O(E)，DFS O(V)'},{k:'C',t:'都 O(E)'},{k:'D',t:'BFS O(V+E)，DFS O(1)'}],answer:'A',point:'考察图遍历的空间分析。',tips:['辅助结构最多装下所有顶点','邻接表本身占 O(V+E) 是「输入空间」，不算遍历辅助'],ans:['BFS 队列与 DFS 栈最坏都容纳全部顶点，加上 visited 数组，辅助空间都是 O(V)。','时间上邻接表遍历 O(V+E)，邻接矩阵 O(V²)——稀疏图选邻接表。']},
  {id:'wal30',scene:'algo',lv:2,qtype:'single',q:'判断无向图是否有环，除了 DFS 染色外还可以用？',options:[{k:'A',t:'并查集（加边时两端已连通即成环）'},{k:'B',t:'二分查找'},{k:'C',t:'滑动窗口'},{k:'D',t:'前缀和'}],answer:'A',point:'考察并查集的应用场景。',tips:['并查集：合并集合+查连通，近 O(1) 均摊','Kruskal 最小生成树也靠它判环'],ans:['并查集处理「动态连通性」：依次加边，若边的两端点已属同一集合，说明这条边会形成环。','有路径压缩+按秩合并后单次操作均摊 O(α(n)) 近常数；最小生成树 Kruskal 算法的核心就是它。']},
  {id:'wal31',scene:'algo',lv:1,qtype:'single',q:'哈希表解决冲突的常见方法是？',options:[{k:'A',t:'链地址法 / 开放寻址法'},{k:'B',t:'二分插入法'},{k:'C',t:'排序去重法'},{k:'D',t:'梯度下降法'}],answer:'A',point:'考察哈希冲突处理。',tips:['链地址：桶里挂链表（Java HashMap）','开放寻址：线性/平方探测，缓存友好','负载因子过高 → 扩容 rehash'],ans:['链地址法：每个桶挂链表或红黑树（冲突多时 Java8 会树化）；开放寻址法：冲突后按探测序列找下一空槽（Python dict），缓存友好但删除要用墓碑标记。','共同兜底手段是负载因子超阈值时扩容重散列。']},
  {id:'wal32',scene:'algo',lv:2,qtype:'single',q:'位运算 x & (x-1) 的作用是？',options:[{k:'A',t:'把 x 最右边的 1 变成 0'},{k:'B',t:'把 x 所有位取反'},{k:'C',t:'判断奇偶'},{k:'D',t:'计算 x 的 2 倍'}],answer:'A',point:'考察经典位运算技巧。',tips:['x&(x-1) 消除最低位 1','统计 1 的个数：循环执行直到 0','x&1 判奇偶；x>>1 除 2'],ans:['x&(x-1) 会将 x 二进制中最低位的 1 置 0，用于：①统计二进制中 1 的个数（循环消 1 计数）；②判断 2 的幂（x>0 且 x&(x-1)==0）；③Brian Kernighan 快速算法。','常用位运算全家桶：x&1 判奇偶、x>>1 除 2、x^x=0（找单独数字）。']},
  {id:'wal33',scene:'algo',lv:1,qtype:'short',q:'简述时间复杂度 O(1)、O(log n)、O(n)、O(n log n)、O(n²) 的大小关系并各举一个例子。',answer:'O(1)<O(log n)<O(n)<O(n log n)<O(n²)；例：哈希取值 / 二分 / 遍历 / 归并排序 / 冒泡排序。',point:'考察复杂度阶的直观认知。',tips:['按增长速度排序','每档配一个最熟悉的算法','提一句 n 大时差距会被指数放大'],ans:['增长由慢到快：O(1)<O(log n)<O(n)<O(n log n)<O(n²)。','对应例子：O(1) 哈希查找；O(log n) 二分查找；O(n) 单次遍历求和；O(n log n) 归并/快排平均；O(n²) 冒泡/选择排序。','直观感受：n=10⁶ 时 O(n log n) 约 2×10⁷ 次操作可秒级完成，O(n²) 则是 10¹² 要跑数小时——这就是算法选型的意义。']},
  {id:'wal34',scene:'algo',lv:2,qtype:'short',q:'如何判断一个链表是否有环？要求 O(1) 额外空间。',answer:'快慢指针（Floyd 判圈）：慢走 1 快走 2，相遇则有环。',point:'考察链表经典双指针。',tips:['讲清「为什么一定会相遇」：快指针每轮追近 1 步','延伸：找环入口——相遇后一头从 head 走','对比哈希表法：O(n) 空间'],ans:['Floyd 快慢指针：slow 每次走 1 步、fast 走 2 步；若有环，两指针都会进入环内且相对速度为 1，必然相遇；fast 到 null 则无环。','找环入口：相遇后把一指针放回 head，两指针同速前进，再次相遇处即入口（数学：head 到入口距离 = 相遇点绕回入口距离）。','哈希表法简单但 O(n) 空间；快慢指针是「O(1) 空间」要求的正解。']},
  {id:'wal35',scene:'algo',lv:2,qtype:'single',q:'合并两个有序链表的最佳做法是？',options:[{k:'A',t:'拼接后整体排序 O((m+n)log(m+n))'},{k:'B',t:'双指针逐节点比较拼接，O(m+n)'},{k:'C',t:'转成数组再合并'},{k:'D',t:'递归必然栈溢出'}],answer:'B',point:'考察归并思想在链表上的应用。',tips:['哑结点简化头处理','归并排序链表版的基础操作','数组归并要辅助空间，链表只需改指针'],ans:['两个指针分别指向两链表，每次取较小节点接到结果尾部，O(m+n) 完成；用哑结点（dummy）统一头部处理逻辑。','这是「排序链表」（归并排序 O(n log n)）的核心子过程，笔试高频。']},
  {id:'wal36',scene:'algo',lv:2,qtype:'single',q:'「多数元素」（出现次数超过 n/2）的最优解法是？',options:[{k:'A',t:'排序取中位数 O(n log n)'},{k:'B',t:'Boyer-Moore 投票算法 O(n) 时间 O(1) 空间'},{k:'C',t:'双层循环计数 O(n²)'},{k:'D',t:'堆排序后取首元素'}],answer:'B',point:'考察摩尔投票算法。',tips:['核心：不同元素两两抵消','超过半数的元素必然幸存','扩展：出现超过 n/3 用两个候选人'],ans:['摩尔投票：candidate 计数，遇到相同 +1 不同 -1，归零换候选人；由于多数元素出现超过一半，两两抵消后必然幸存。','O(n) 时间 O(1) 空间完胜排序法；进阶题「求出现超过 n/3 的元素」用两个候选人配对抵消。']},
  {id:'wal37',scene:'algo',lv:2,qtype:'single',q:'前缀和数组能把「区间求和」查询从 O(n) 降到？',options:[{k:'A',t:'O(1)（P[i]=P[i-1]+nums[i]，区间和=P[r+1]-P[l]）'},{k:'B',t:'O(log n)'},{k:'C',t:'O(n)'},{k:'D',t:'查询不变，只是好写'}],answer:'A',point:'考察前缀和技巧。',tips:['预处理 O(n)，单次区间和 O(1)','二维前缀和同样套路','动态更新场景换树状数组/线段树'],ans:['前缀和预处理后任意区间 [l,r] 的和 = P[r+1]-P[l]，O(1) 查询；适合「静态数组多次区间查询」。','数据会修改时用树状数组/线段树（单点更新 O(log n)）；差分数组则是「区间批量加减」的对偶技巧。']},
  {id:'wal38',scene:'algo',lv:2,qtype:'judge',q:'二叉搜索树（BST）中序遍历得到降序序列。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察 BST 性质。',tips:['左<根<右','中序遍历升序','平衡后查找 O(log n)，退化成链表 O(n)'],ans:['BST 性质是左子树 < 根 < 右子树，中序（左根右）遍历得到升序序列——降序说法正好相反。','考点延伸：判断合法 BST（不能用局部比较，要用上下界或中序递增）、第 k 小元素（中序第 k 个）。']},
  {id:'wal39',scene:'algo',lv:2,qtype:'single',q:'「爬楼梯」（每次 1 或 2 阶）的递推式与复杂度是？',options:[{k:'A',t:'f(n)=f(n-1)+f(n-2)，DP O(n) 时间 O(1) 空间'},{k:'B',t:'f(n)=2f(n-1)，O(n²)'},{k:'C',t:'只能递归，无法优化'},{k:'D',t:'f(n)=f(n-1)*f(n-2)'}],answer:'A',point:'考察最简 DP 的状态设计。',tips:['到第 n 阶只有两种来路','滚动变量即可，无需数组','本质是斐波那契'],ans:['最后一步要么跨 1 阶（来自 n-1）要么跨 2 阶（来自 n-2），f(n)=f(n-1)+f(n-2)；用两个滚动变量迭代，O(n) 时间 O(1) 空间。','答题时讲清「状态定义 → 转移方程 → 边界 → 优化」四步，是 DP 题的标准答题框架。']},
  {id:'wal40',scene:'algo',lv:3,qtype:'single',q:'「最长递增子序列（LIS）」的普通 DP 与贪心+二分解法复杂度分别是？',options:[{k:'A',t:'都是 O(n²)'},{k:'B',t:'O(n²) 与 O(n log n)'},{k:'C',t:'O(n log n) 与 O(n²)'},{k:'D',t:'都 O(n)'}],answer:'B',point:'考察 LIS 两种解法对比。',tips:['DP：f[i]=以 i 结尾的最长升序，向前找更小值','贪心：tails 数组维护各长度升序的最小尾元素','tails 有序所以插入用二分'],ans:['DP 版：f[i] = max(f[j]+1)，j<i 且 nums[j]<nums[i]，O(n²)；贪心+二分：tails[k] 存「长度 k+1 的 LIS 的最小尾元素」，长度增加时追加、否则二分替换，O(n log n)。','贪心版只能求长度，要求具体序列时用 DP 版记录前驱。']},
  {id:'wal41',scene:'algo',lv:2,qtype:'single',q:'「两数之和」（无序数组）的最优解法是？',options:[{k:'A',t:'排序后二分，O(n log n)'},{k:'B',t:'哈希表一次遍历存「target-当前值」，O(n) 时间 O(n) 空间'},{k:'C',t:'双层循环 O(n²) 已是最优'},{k:'D',t:'堆排序'}],answer:'B',point:'考察哈希表以空间换时间。',tips:['遍历时查「配对值是否见过」','一次遍历即可，无需先建表','对比：有序版用双指针省空间'],ans:['遍历数组，对每个 x 先查哈希表里有没有 target-x，有即返回，没有则把 x 存入；一次遍历 O(n)。','「空间换时间」的典型：哈希表 O(n) 空间换掉内层循环；数组有序时可用双指针 O(1) 空间。']},
  {id:'wal42',scene:'algo',lv:3,qtype:'single',q:'「岛屿数量」（网格 1 是陆地 0 是水）的标准解法与复杂度是？',options:[{k:'A',t:'动态规划 O(mn)'},{k:'B',t:'DFS/BFS 感染标记，O(mn) 时间，递归深度最坏 O(mn)'},{k:'C',t:'双指针 O(m+n)'},{k:'D',t:'二分查找'}],answer:'B',point:'考察网格搜索类题型。',tips:['每个格子最多访问常数次','沉岛技巧（访问后置 0）省 visited','进阶：并查集处理动态加岛'],ans:['遍历网格，遇到 1 就从该点 DFS/BFS 把整座岛「感染」（标记为已访问或直接改 0），计数加一；每个格子至多被访问常数次，总 O(mn)。','注意递归 DFS 在超大网格可能栈溢出，工程实现用显式栈或 BFS 队列；「最大岛屿面积」「周长」是同族变体。']},
  {id:'wal43',scene:'algo',lv:3,qtype:'single',q:'0-1 背包的状态定义与转移方程是？',options:[{k:'A',t:'f[i][w]=前 i 件容量 w 的最大价值；f[i][w]=max(f[i-1][w], f[i-1][w-v]+val)'},{k:'B',t:'f[i]=f[i-1]+1'},{k:'C',t:'f[w]=val，直接累加'},{k:'D',t:'没有状态转移方程'}],answer:'A',point:'考察背包问题建模。',tips:['每件物品「选或不选」两分支','一维优化：w 从大到小遍历','完全背包（可重复选）w 从小到大'],ans:['f[i][w] 表示考虑前 i 件、容量 w 时的最大价值：不选第 i 件继承 f[i-1][w]，选则 f[i-1][w-v]+val，取较大者。','空间优化为滚动一维数组，但遍历容量必须「从大到小」防重复选；完全背包恰好相反「从小到大」。这是笔试 DP 压轴常客。']},
  {id:'wal44',scene:'algo',lv:2,qtype:'single',q:'「最长公共子序列（LCS）」的时间与空间复杂度是？',options:[{k:'A',t:'O(nm) 时间，O(nm) 空间（可滚动优化到 O(min(n,m))）'},{k:'B',t:'O(n+m)'},{k:'C',t:'O(n²m)'},{k:'D',t:'O(log n)'}],answer:'A',point:'考察经典二维 DP。',tips:['相等：左上+1；不等：上/左取大','只求长度可滚动数组','求具体序列需要记录决策或回溯'],ans:['f[i][j] 表示两串前 i、j 个字符的 LCS 长度：字符相等 f[i-1][j-1]+1，否则 max(f[i-1][j], f[i][j-1])，时间空间均 O(nm)。','空间可滚动优化到一行；与「编辑距离」同框架，都是二维 DP 模板题。']},
  {id:'wal45',scene:'algo',lv:1,qtype:'single',q:'递归调用过深导致「栈溢出」，常见的解决方式不包括？',options:[{k:'A',t:'改为显式栈迭代'},{k:'B',t:'尾递归优化（语言支持时）'},{k:'C',t:'把递归改为记忆化+递推'},{k:'D',t:'增大时间复杂度'}],answer:'D',point:'考察递归与迭代转换。',tips:['栈深度是空间问题，与时间复杂度无关','JS 引擎对尾递归优化支持不一'],ans:['增大时间复杂度与栈溢出毫无关系。有效手段：改显式栈迭代（DFS 非递归版）、尾递归（部分引擎支持 TCO）、直接改递推（DP）。','JS 注意：V8 对尾递归优化支持有限，深度递归建议直接迭代化。']},
  {id:'wal46',scene:'algo',lv:2,qtype:'single',q:'「反转链表」迭代解法的核心操作是？',options:[{k:'A',t:'交换节点值'},{k:'B',t:'三个指针（prev/cur/next）逐个翻转 next 指向'},{k:'C',t:'递归必然更快'},{k:'D',t:'转成数组再反转'}],answer:'B',point:'考察链表指针操作基本功。',tips:['先存 next 再改指向，防止断链','O(n) 时间 O(1) 空间','递归版同样 O(n) 但 O(n) 栈'],ans:['迭代三指针：next 暂存 cur.next → cur.next=prev → prev=cur → cur=next，一次遍历完成，O(n)/O(1)。','「先暂存再翻转」防断链是关键细节；这题是链表操作的地基，k 组反转、回文链表都基于它。']},
  {id:'wal47',scene:'algo',lv:2,qtype:'single',q:'「合并区间」（如 [1,3][2,6] → [1,6]）的正确流程是？',options:[{k:'A',t:'直接两两合并'},{k:'B',t:'按左端点排序，再线性扫描合并重叠区间'},{k:'C',t:'哈希表计数'},{k:'D',t:'堆排序后倒序输出'}],answer:'B',point:'考察区间类问题的排序预处理。',tips:['排序让「可能重叠」的区间相邻','start>当前 end 即新区间','延伸：插入区间、无重叠区间删除'],ans:['先按左端点排序 O(n log n)，扫描时若当前区间 start ≤ 结果集末尾的 end 则合并（end 取两者较大），否则新增。总 O(n log n)。','排序预处理把「任意两两可能重叠」简化为「只需看相邻」，是区间题的通用起手式。']},
  {id:'wal48',scene:'algo',lv:2,qtype:'single',q:'「移动零」（把 0 移到末尾且保持非零相对顺序）的最优解法是？',options:[{k:'A',t:'快慢指针：非零元素前移覆盖，最后补 0，一次遍历'},{k:'B',t:'新开数组过滤'},{k:'C',t:'每遇到 0 就整体后移'},{k:'D',t:'先排序'}],answer:'A',point:'考察原地双指针分区。',tips:['慢指针指向「下一个非零应放位置」','快指针扫描，遇非零交换/覆盖','延伸到「按奇偶分区」「颜色排序」'],ans:['慢指针 slow 记录非零区边界：快指针遇非零就与 slow 位置交换（或覆盖），slow++；结束后 slow 之后全部填 0。一次遍历、原地、保序。','这是「数组分区」思想的模板，荷兰国旗问题（三色排序）是它的三区升级版。']},
  {id:'wal49',scene:'algo',lv:3,qtype:'single',q:'「接雨水」（柱状图蓄水总量）双指针解法的时间与空间复杂度是？',options:[{k:'A',t:'O(n) 时间 O(1) 空间'},{k:'B',t:'O(n) 时间 O(n) 空间'},{k:'C',t:'O(n²) 时间 O(1) 空间'},{k:'D',t:'O(n log n) 时间 O(n) 空间'}],answer:'A',point:'考察高频 Hard 题的最优解复杂度。',tips:['DP 版预处理左右最大值：O(n)/O(n)','双指针维护两侧最大值：O(n)/O(1)','单调栈按层累计：O(n)/O(n)'],ans:['双指针从两端向中间收缩，分别维护左右两侧已见最大高度：较短一侧决定当前列水位，可安全收缩，时间 O(n)、空间 O(1)——是该题的最优解。','同题多解对比是面试加分点：DP 版最好写、单调栈思路新颖、双指针最省空间。']},
  {id:'wal50',scene:'algo',lv:2,qtype:'single',q:'快速选择（QuickSelect）求「第 K 大元素」的平均时间复杂度是？',options:[{k:'A',t:'O(n log n)'},{k:'B',t:'O(n)（每次只递归一侧）'},{k:'C',t:'O(log n)'},{k:'D',t:'O(n²) 且无法优化'}],answer:'B',point:'考察部分排序思想。',tips:['快排只走包含答案的一侧','n+n/2+n/4+... ≈ 2n','最坏仍 O(n²)，随机化基准缓解'],ans:['快排分区后判断第 K 大落在哪一侧，只递归那一侧：n + n/2 + n/4 + … ≈ 2n，平均 O(n)。','对比：堆解法（维护 K 大小的小顶堆）O(n log K)，K 很小时更稳；「前 K 个高频元素」是它的哈希+桶/堆组合变体。']},
  {id:'wal51',scene:'algo',lv:2,qtype:'single',q:'「字符串排列/组合/子集」这类枚举所有可能的问题，通用解法是？',options:[{k:'A',t:'动态规划'},{k:'B',t:'回溯（DFS + 状态重置）'},{k:'C',t:'贪心'},{k:'D',t:'二分'}],answer:'B',point:'考察回溯算法识别。',tips:['回溯三要素：路径、选择列表、结束条件','排列去重：排序+used 数组/跳过同层重复','复杂度 = 解的个数 × 单解构造'],ans:['枚举型问题用回溯：每层做选择 → 递归 → 撤销选择（状态重置）。子集/排列/组合三大模板的区别在于：子集每节点都收集、排列用 used 标记、组合用 start 防重。','去重技巧：先排序，同一层跳过相同值（nums[i]==nums[i-1] && !used[i-1]）。']},
  {id:'wal52',scene:'algo',lv:2,qtype:'judge',q:'N 皇后问题的回溯解法中，判断冲突可以用三个集合分别记录列、主对角线、副对角线的占用情况，实现 O(1) 判冲突。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'A',point:'考察回溯的剪枝优化。',tips:['同列：col 集；主对角线：row-col 定值；副：row+col 定值','剪枝是回溯效率的关键','位运算版可进一步加速'],ans:['每放置一个皇后，把 col、row-col、row+col 三个键加入对应集合；后续位置任一键冲突即剪枝回溯，判冲突 O(1)。','相比逐格检查棋盘的 O(n) 判重，集合/位运算判重是标准优化，位运算版（bitmask）更快。']},
  {id:'wal53',scene:'algo',lv:2,qtype:'single',q:'「环形链表」中找到中间节点（偶数取第二个），最优雅的解法是？',options:[{k:'A',t:'先遍历求长度再走一半，两次遍历'},{k:'B',t:'快慢指针：fast 走 2 slow 走 1，fast 到尾时 slow 即中点'},{k:'C',t:'转成数组取下标'},{k:'D',t:'哈希表记录'}],answer:'B',point:'考察快慢指针技巧。',tips:['一趟遍历 O(n)/O(1)','同类：倒数第 K（先行 K 步）、判环'],ans:['快指针每次走 2、慢指针走 1，fast 到达末尾时 slow 恰好在中点，一趟完成。','快慢指针三兄弟：中点（2:1）、判环（追及）、倒数第 K（先拉开 K 距离），笔试常混着出。']},
  {id:'wal54',scene:'algo',lv:1,qtype:'single',q:'判断两个字符串是否「字母异位词」（如 listen/silent）的最优方式是？',options:[{k:'A',t:'排序后比较，O(n log n)'},{k:'B',t:'26 长度计数数组统计字符频次，O(n) 时间 O(1) 空间'},{k:'C',t:'双重循环逐字符删除'},{k:'D',t:'哈希表存整串'}],answer:'B',point:'考察字符计数技巧。',tips:['小写字母固定 26 槽','计数数组也是「哈希」思想','延伸：「找所有异位词」滑动窗口+计数差'],ans:['长度不等直接 false；等长则各建 26 槽计数数组（或一个数组一加一减最后判全零），O(n) 时间 O(1) 空间。','排序法 O(n log n) 好写但慢；「找所有异位词起点」则是定长滑动窗口维护计数差分的经典题。']},
  {id:'wal55',scene:'algo',lv:2,qtype:'single',q:'「最小栈」（push/pop/top/getMin 都 O(1)）的实现要点是？',options:[{k:'A',t:'用排序维护'},{k:'B',t:'辅助栈同步存「当前最小值」'},{k:'C',t:'每次 getMin 遍历'},{k:'D',t:'用哈希表'}],answer:'B',point:'考察设计类题目的空间换时间。',tips:['主栈正常进出','辅助栈顶永远是当前最小','进阶：一个栈存差值实现 O(1) 且省空间'],ans:['辅助栈与主栈同步：push 时压入 min(新值, 辅助栈顶)，pop 时同步弹出——辅助栈顶始终是当前栈内最小值，四个操作全 O(1)。','设计题答题框架：先给常规解，再说明优化空间（差值存法），展示权衡意识。']},
  {id:'wal56',scene:'algo',lv:2,qtype:'single',q:'「用队列实现栈」或「用栈实现队列」这类题，考察的核心是？',options:[{k:'A',t:'语法熟悉度'},{k:'B',t:'对两种结构进出顺序差异的转化能力'},{k:'C',t:'数学归纳'},{k:'D',t:'位运算'}],answer:'B',point:'考察结构语义转换。',tips:['栈→队列：双栈倒腾（均摊 O(1)）','队列→栈：单队列每次重排 O(n)，或双队列','抓住 LIFO vs FIFO 的本质'],ans:['核心是理解顺序差异并设计转化：两个栈「倒入倒出」可实现队列（均摊 O(1)）；队列实现栈可在 push 时把前面元素重新入队（O(n) push，O(1) 其他）。','答题时主动分析各操作的均摊复杂度，比只写代码更得分。']},
  {id:'wal57',scene:'algo',lv:3,qtype:'single',q:'「不用加减乘除做加法」的位运算解法核心是？',options:[{k:'A',t:'异或求「无进位和」，与后左移求「进位」，循环直到进位为 0'},{k:'B',t:'用自增模拟'},{k:'C',t:'转字符串处理'},{k:'D',t:'数学公式'}],answer:'A',point:'考察位运算替代算术。',tips:['a^b = 不带进位的和','(a&b)<<1 = 进位','负数用补码自动处理，注意 JS 位运算 32 位截断'],ans:['两数之和 = 无进位和 + 进位：a^b 得无进位和，(a&b)<<1 得进位，两者再重复此过程直到进位为 0。','理解基础：异或是「不进位的加法」，与运算恰好标记「都为 1 需要」进位的位置。同类题还有「不用乘法做乘法」（移位+加）。']},
  {id:'wal58',scene:'algo',lv:2,qtype:'single',q:'「只出现一次的数字」（其余都出现两次）最优解是？',options:[{k:'A',t:'异或全部元素：成对抵消，剩下即答案，O(n)/O(1)'},{k:'B',t:'哈希表计数'},{k:'C',t:'排序后扫描'},{k:'D',t:'双重循环'}],answer:'A',point:'考察异或性质应用。',tips:['x^x=0、x^0=x、异或满足交换律','全部异或：相同归零剩单独','变体「其余出现三次」用三进制位统计'],ans:['利用异或的自反性（x^x=0）和交换律，把数组全部异或，成对元素抵消为 0，最后剩下只出现一次的数。O(n) 时间 O(1) 空间。','进阶变体「其余出现三次」：按位统计 1 的个数对 3 取模，不能再用简单异或。']},
  {id:'wal59',scene:'algo',lv:2,qtype:'single',q:'递归三要素（正确性框架）是？',options:[{k:'A',t:'循环、判断、返回'},{k:'B',t:'明确的终止条件（基例）+ 递归调用向基例逼近 + 正确的返回值组合'},{k:'C',t:'全局变量、局部变量、静态变量'},{k:'D',t:'输入、处理、输出'}],answer:'B',point:'考察递归思维框架。',tips:['基例不明确 → 无限递归','每层递归必须「更接近」基例','返回值如何组合决定问题能否递归'],ans:['①基例（最小子问题的直接答案）；②递推方向：每次调用必须让规模减小、逼近基例；③组合：如何用子问题的返回构造当前层答案。','三条缺一不可：无基例死循环、不逼近栈溢出、组合错误结果错。回溯/分治/DP 都建立在递归框架上。']},
  {id:'wal60',scene:'algo',lv:2,qtype:'single',q:'「盛最多水的容器」（左右挡板围水）的最优解法与核心依据是？',options:[{k:'A',t:'双层循环枚举所有组合'},{k:'B',t:'双指针从两端收缩：移动较短一侧（移动长侧不可能变大）'},{k:'C',t:'动态规划'},{k:'D',t:'排序后取最大两个'}],answer:'B',point:'考察双指针的正确性论证。',tips:['面积 = min(h[l],h[r]) × 宽度','关键：为什么可以安全跳过部分解——「保持较短端不动才是更优解的前提」','与接雨水区分：本题求最大而非总量'],ans:['双指针：计算当前面积后移动较短一端——因为以短端为界的任何更窄组合面积都不会超过当前，可安全舍弃。每步缩小范围，O(n)。','答题亮点是「正确性证明」：说明跳过的解不可能更优，这是双指针题区别于枚举的灵魂。']},
  {id:'wal61',scene:'algo',lv:1,qtype:'judge',q:'二叉树的层序遍历是深度优先搜索的一种。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察遍历分类。',tips:['DFS：前中后序（栈/递归）','BFS：层序（队列）','层序按「层」扩展是 BFS 的标志'],ans:['层序遍历借助队列逐层扩展，属于广度优先搜索（BFS）；前中后序用栈或递归沿深度优先，属于 DFS。两者访问顺序完全不同。']},
  {id:'wal62',scene:'algo',lv:2,qtype:'judge',q:'快速排序是稳定的排序算法。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察排序稳定性归类。',tips:['稳定：冒泡、插入、归并、计数','不稳定：选择、快排、堆排、希尔','稳定性意义：多关键字排序可叠加'],ans:['快排分区时的远距离交换会打乱相等元素的相对顺序，不稳定。','稳定性价值：多关键字排序（先按次关键字排好再用稳定排序排主关键字）以及业务上保持原始顺序的需求。']},
  {id:'wal63',scene:'algo',lv:2,qtype:'single',q:'「满足条件的最短子数组」（正数数组、目标和）最适合？',options:[{k:'A',t:'滑动窗口，左右指针单调前进'},{k:'B',t:'二分答案'},{k:'C',t:'回溯枚举'},{k:'D',t:'堆排序'}],answer:'A',point:'考察滑动窗口的适用前提。',tips:['元素全正 → 窗口和单调','含负数 → 窗口失去单调性，需前缀和+单调队列','滑动窗口本质：双指针 + 单调性'],ans:['数组元素全为正时，窗口扩大和必增、缩小必减，单调性成立，左右指针各走一遍 O(n)。','一旦含负数，扩大窗口反而可能减小和，单调性破坏——退化为「前缀和 + 哈希/单调队列」。识别单调性是否成立是这类题的选型关键。']},
  {id:'wal64',scene:'algo',lv:3,qtype:'single',q:'「打家劫舍」（不能偷相邻两间）的 DP 要点是？',options:[{k:'A',t:'f[i]=max(f[i-1], f[i-2]+nums[i])，可滚动到 O(1) 空间'},{k:'B',t:'必须二维状态'},{k:'C',t:'贪心取最大交替'},{k:'D',t:'排序后取奇数位'}],answer:'A',point:'考察线性 DP。',tips:['每间房「偷或不偷」两分支','环形版本（首尾相连）拆两次线性','f[i-1] 是「不偷当前」，f[i-2]+num 是「偷当前」'],ans:['状态：f[i] 为考虑前 i 间房的最大金额；转移：不偷第 i 间 f[i-1]，偷则 f[i-2]+nums[i]，取大者；两个滚动变量即可，O(n)/O(1)。','环形变体（首尾相邻）拆成「去掉第一家」和「去掉最后一家」两次线性 DP 取大——这是化环为链的标准套路。']},
  {id:'wal65',scene:'algo',lv:2,qtype:'single',q:'「FizzBuzz 类计数」「约数枚举」中判断质数的最优单次判定是？',options:[{k:'A',t:'试除到 n-1'},{k:'B',t:'试除到 √n'},{k:'C',t:'试除到 n/2 且不用循环'},{k:'D',t:'位运算一步得出'}],answer:'B',point:'考察质数判定与筛法。',tips:['若 n=ab 且 a≤b，则 a≤√n','批量求质数用埃氏筛 O(n log log n)','欧拉筛线性 O(n)'],ans:['判断 n 是否质数只需试除 2 到 √n：若 n 有大于 √n 的因子，必有对应小于 √n 的因子。','批量场景用埃拉托斯特尼筛（标记倍数）或欧拉线性筛；面试偶尔追问「为什么 1 不是质数」（定义：大于 1 且只有 1 和自身两个因子）。']},
  {id:'wal66',scene:'algo',lv:2,qtype:'single',q:'「二叉树的最大深度」递归解法与复杂度是？',options:[{k:'A',t:'max(左深, 右深)+1，O(n) 时间 O(h) 栈空间'},{k:'B',t:'必须层序 BFS'},{k:'C',t:'O(n²)'},{k:'D',t:'无法递归求解'}],answer:'A',point:'考察树形递归（自底向上）。',tips:['树的问题天然可递归：左右子树答案 + 当前层处理','O(h) 是递归栈深度，最坏 O(n)（链状树）','最小深度要特判单侧为空的情况'],ans:['递归定义：树的最大深度 = max(左子树深度, 右子树深度) + 1，每个节点访问一次 O(n)，递归栈深为树高 O(h)。','同类「自底向上」题：直径（左右深之和）、平衡判断（先判子树平衡再返回高度）。递归时想清「我要从子节点拿到什么、返回什么」。']},
  {id:'wal67',scene:'algo',lv:3,qtype:'single',q:'「最大子数组和」（Kadane 算法）的转移方程是？',options:[{k:'A',t:'f[i]=max(nums[i], f[i-1]+nums[i])，答案取 max(f)'},{k:'B',t:'f[i]=f[i-1]+nums[i]'},{k:'C',t:'f[i]=max(f[i-1], nums[i])'},{k:'D',t:'必须分治'}],answer:'A',point:'考察一维 DP 经典。',tips:['f[i]=以 i 结尾的最大子数组和','前面的累计为负则「另起炉灶」','延伸：分治 O(n log n)、返回区间版本'],ans:['f[i] 表示以 i 结尾的最大子数组和：要么接在前面（f[i-1]+nums[i]），要么自起（nums[i]），取大者；全局答案为所有 f[i] 的最大值。','直觉：前面的累计和若为负只会拖后腿，丢弃。一维滚动变量即可 O(n)/O(1)。']},
  {id:'wal68',scene:'algo',lv:2,qtype:'single',q:'「两个数组的交集」用哈希表解法的复杂度与要点是？',options:[{k:'A',t:'O(m+n)：短数组建 Set，长数组逐个查'},{k:'B',t:'O(mn) 双循环'},{k:'C',t:'必须先排序'},{k:'D',t:'O(1)'}],answer:'A',point:'考察 Set/哈希的查重应用。',tips:['建表用短的、查表用长的省空间','结果去重：命中后从 Set 删除','有序版可双指针 O(1) 额外空间'],ans:['把较短数组放进 Set，遍历较长数组，命中则收集并从 Set 删除（防重复），总 O(m+n)。','两数组有序时可用双指针 O(1) 额外空间——又是一次「空间换时间」与「有序性换空间」的对照。']},
  {id:'wal69',scene:'algo',lv:2,qtype:'short',q:'什么是稳定排序？稳定性有什么实际价值？举两个稳定和两个不稳定排序。',answer:'相等元素排序后保持原相对顺序。价值：支持多关键字叠加排序、保序业务需求。稳定：冒泡/插入/归并；不稳定：快排/堆排/选择。',point:'考察排序性质与应用联系。',tips:['定义一句话讲清','价值举「按成绩排序后想按班级稳定再排」','口诀：插冒归稳定'],ans:['稳定排序保证相等关键字元素的原有相对次序不变。','实际价值：①多关键字排序——先按次要关键字排，再用稳定排序按主关键字排，次序不丢；②业务保序（如同分选手按报名时间先后）。','稳定：冒泡、插入、归并（及计数/基数）；不稳定：选择、快排、堆排、希尔。']},
  {id:'wal70',scene:'algo',lv:2,qtype:'short',q:'简述 Dijkstra 算法的流程与适用条件，为什么负权边会导致错误？',answer:'贪心+优先队列逐步确定最短路；要求边权非负。负权会让「已确定的节点」后续仍可能被更短路径更新，破坏贪心前提。',point:'考察图算法进阶。',tips:['流程：取当前最近点 → 松弛邻居 → 重复','复杂度 O((V+E)log V)（堆优化）','负权用 Bellman-Ford / SPFA'],ans:['Dijkstra：源点出发，优先队列每次取当前距离最小的未确定点，用它松弛邻居，确定后不再回头；非负权下「已确定者不可能再被更短路径更新」保证正确，堆优化 O((V+E)logV)。','负权破坏该前提：一条经过负边的中转路径可能比「已确定」的更短，导致错误；此时用 Bellman-Ford（O(VE)）或其队列优化 SPFA；「判断负环」也是 Bellman-Ford 的衍生能力。']},
  {id:'wal71',scene:'algo',lv:3,qtype:'single',q:'「最短回文串构造」「KMP」中 next 数组的含义是？',options:[{k:'A',t:'每个位置的最长公共前后缀长度，失配时跳到该位置继续匹配'},{k:'B',t:'字符出现的次数'},{k:'C',t:'字符串的哈希值'},{k:'D',t:'ASCII 码'}],answer:'A',point:'考察 KMP 核心数组。',tips:['next[i]=模式串 [0..i] 的最长相等前后缀','失配不回退主串指针','复杂度 O(n+m)','字符串匹配还有 Rabin-Karp（哈希）、Boyer-Moore'],ans:['KMP 的 next（失败函数）记录模式串每个前缀的「最长相等前后缀」长度；主串指针永不回退，失配时模式串按 next 跳到下一个可能匹配位置，整体 O(n+m)。','答题时能现场推导一个短串的 next 数组最加分；对比暴力匹配 O(nm) 的差距在于「利用已匹配信息」。']},
  {id:'wal72',scene:'algo',lv:2,qtype:'short',q:'遇到一道陌生算法题，你的通用解题流程是什么？（考察方法论）',answer:'读题明确输入输出与约束 → 数据规模反推复杂度上限 → 识别题型（双指针/滑动窗口/DP/图/回溯…）→ 先想暴力再优化 → 手推小样例验证 → 写代码时注意边界。',point:'考察解题方法论（面试官真实关注点）。',tips:['n≤20 想回溯，n≤500 想O(n³)，10⁵ 想O(n log n)','先暴力再优化，「正确」优先于「炫技」','主动向面试官沟通假设'],ans:['①审题：输入输出、取值范围、特殊边界（空/单元素/重复）；②由数据规模定复杂度预算（n=10⁵ → O(n log n) 以内）；③模式识别：有序→双指针/二分，连续子数组→滑动窗口/前缀和，求最值+决策→DP，枚举方案→回溯，连通/最短路→图；④先写暴力拿正确性，再针对瓶颈优化；⑤手推最小样例（含边界）验证后再动手写完整代码。','向面试官边讲边做的沟通本身就是考察项。']},
  {id:'wx7',scene:'xingce',lv:1,qtype:'single',q:'数列 2, 5, 11, 23, 47, （ ）的下一项是？',options:[{k:'A',t:'95'},{k:'B',t:'94'},{k:'C',t:'92'},{k:'D',t:'96'}],answer:'A',point:'考察数列递推规律识别。',tips:['先看差值：3,6,12,24（等比）','也满足「×2+1」规律','两条规律互验更稳'],ans:['相邻差值为 3,6,12,24，是公比为 2 的等比数列，下一个差值 48，故 47+48=95。','另一视角：每项 ×2+1（2→5→11→23→47），47×2+1=95，两种规律一致。']},
  {id:'wx8',scene:'xingce',lv:1,qtype:'single',q:'数列 1, 4, 9, 16, 25, （ ）的下一项是？',options:[{k:'A',t:'30'},{k:'B',t:'35'},{k:'C',t:'36'},{k:'D',t:'49'}],answer:'C',point:'考察平方数列识别。',tips:['1²,2²,3²,4²,5²…','差值 3,5,7,9 是等差（二级等差）'],ans:['数列是自然数平方：1²,2²,3²,4²,5²，下一项 6²=36。','行测数列的常用破解：先作差（3,5,7,9 等差，差 2 → 下一个差 11 → 25+11=36），两条路径殊途同归。']},
  {id:'wx9',scene:'xingce',lv:2,qtype:'single',q:'一项工程甲单独做 10 天完成，乙单独做 15 天完成，两人合作需要几天？',options:[{k:'A',t:'5 天'},{k:'B',t:'6 天'},{k:'C',t:'7 天'},{k:'D',t:'8 天'}],answer:'B',point:'考察工程问题（合作公式）。',tips:['设总量为 1','效率和 = 1/10 + 1/15 = 1/6'],ans:['设工程总量为 1：甲效率 1/10，乙效率 1/15，合作效率 1/10+1/15=1/6，需要 6 天。','工程问题口诀：总量设 1，效率相加；更快的考场技巧是设总量为 10 与 15 的最小公倍数 30，甲 3/天、乙 2/天，30÷5=6 天，全程心算。']},
  {id:'wx10',scene:'xingce',lv:2,qtype:'single',q:'一件商品先涨价 20%，再降价 20%，最终价格与原价相比？',options:[{k:'A',t:'不变'},{k:'B',t:'上涨 4%'},{k:'C',t:'下降 4%'},{k:'D',t:'下降 20%'}],answer:'C',point:'考察百分比的「基准不同」陷阱。',tips:['涨价基准是原价，降价基准是涨价后','1×1.2×0.8=0.96'],ans:['设原价 1：涨价后 1.2，降价 20% 是在 1.2 基础上降，得 1.2×0.8=0.96，比原价低 4%。','陷阱点在两次 20% 的基准不同。同族变体：先降后涨同理亏 4%——「涨跌同幅必亏」。']},
  {id:'wx11',scene:'xingce',lv:2,qtype:'single',q:'甲乙两人相距 100 公里同时相向而行，甲速 40 km/h，乙速 60 km/h，几小时相遇？',options:[{k:'A',t:'1 小时'},{k:'B',t:'1.5 小时'},{k:'C',t:'2 小时'},{k:'D',t:'2.5 小时'}],answer:'A',point:'考察行程问题（相遇）。',tips:['相向而行：速度相加','100÷(40+60)=1'],ans:['相遇问题核心是「速度和」：100÷(40+60)=1 小时。','行测行程三模型：相遇（速度和）、追及（速度差）、往返（平均速度=2ab/(a+b)），先判断属于哪类再套公式。']},
  {id:'wx12',scene:'xingce',lv:2,qtype:'single',q:'浓度为 20% 的盐水 300 克，要稀释到 10%，需加水多少克？',options:[{k:'A',t:'150 克'},{k:'B',t:'200 克'},{k:'C',t:'300 克'},{k:'D',t:'100 克'}],answer:'C',point:'考察浓度问题（溶质不变）。',tips:['加盐加水时溶质守恒','盐 = 300×20% = 60 克；60÷10% = 600 克总量'],ans:['溶质盐不变：60 克。稀释后 10% 浓度意味着总质量 = 60÷0.1 = 600 克，需加水 600-300=300 克。','浓度问题三要素：溶质、溶液、浓度，抓住「谁不变」（加水稀释时溶质不变）列方程即可。']},
  {id:'wx13',scene:'xingce',lv:2,qtype:'single',q:'5 人排成一排照相，甲必须在最中间，共有多少种排法？',options:[{k:'A',t:'24'},{k:'B',t:'20'},{k:'C',t:'12'},{k:'D',t:'120'}],answer:'A',point:'考察排列组合（约束排列）。',tips:['甲位置固定，剩 4 人全排列','4! = 24'],ans:['甲固定在第 3 位，其余 4 人在剩余 4 个位置任意排列，4! = 24 种。','排列题先处理「有约束的元素」再排「自由元素」；若追问「甲乙必须相邻」则用捆绑法（视作一个整体 + 内部排列）。']},
  {id:'wx14',scene:'xingce',lv:2,qtype:'single',q:'从 8 名男生 6 名女生中选 3 人，其中至少 1 名女生，有多少种选法？',options:[{k:'A',t:'C(14,3)-C(8,3) = 364-56 = 308'},{k:'B',t:'C(14,3) = 364'},{k:'C',t:'C(6,1)×C(8,2) = 168'},{k:'D',t:'C(6,3) = 20'}],answer:'A',point:'考察「至少一个」的正难则反。',tips:['至少 1 女 = 全部 − 0 女','直接分类（1女2男 + 2女1男 + 3女）也能算但慢','C(14,3)=364、C(8,3)=56'],ans:['正难则反：总选法 C(14,3)=364 减去全是男生的 C(8,3)=56，得 308。','B 漏减约束；C 只算了「恰好 1 女」；D 只算「3 女」。行测组合题先想「补集思想」往往更快。']},
  {id:'wx15',scene:'xingce',lv:2,qtype:'single',q:'掷两枚均匀骰子，点数之和为 7 的概率是？',options:[{k:'A',t:'1/12'},{k:'B',t:'1/9'},{k:'C',t:'1/6'},{k:'D',t:'5/36'}],answer:'C',point:'考察古典概型。',tips:['总情况 6×6=36','和为 7：(1,6)(2,5)(3,4)(4,3)(5,2)(6,1) 共 6 种'],ans:['两枚骰子共 36 种等可能结果；和为 7 的组合有 6 种（有序计数），概率 6/36=1/6。','和为 7 是骰子组合中可能性最多的（对称分布峰值），7 也是赌桌上的「魔法数字」。']},
  {id:'wx16',scene:'xingce',lv:2,qtype:'single',q:'甲乙丙三人只有一人打碎了杯子。甲说「不是我」，乙说「是丙」，丙说「乙在说谎」。只有一人说真话，谁打碎的？',options:[{k:'A',t:'甲'},{k:'B',t:'乙'},{k:'C',t:'丙'},{k:'D',t:'无法确定'}],answer:'A',point:'考察真假话逻辑推理（矛盾法）。',tips:['乙与丙的话互相矛盾 → 必有一真','唯一真话在乙丙之间 → 甲说假话','甲说「不是我」为假 → 是甲'],ans:['乙说「是丙」与丙说「乙说谎」构成矛盾，两者必有一真一假；由于只有一人说真话，甲必为假话。甲说「不是我」为假 → 恰是甲打碎的（此时乙假丙真，验证自洽）。','真假话题标准三步：找矛盾 → 定真假 → 回推事实。']},
  {id:'wx17',scene:'xingce',lv:2,qtype:'single',q:'「所有的天鹅都是白色的。有些鸟类是天鹅。由此推出：有些鸟类是白色的。」这个三段论推理？',options:[{k:'A',t:'有效，结论必然成立'},{k:'B',t:'有效但结论碰巧为真'},{k:'C',t:'无效，前提为真结论也可能为假'},{k:'D',t:'属于归纳推理'}],answer:'A',point:'考察三段论有效性判断。',tips:['大前提全称肯定 + 小前提肯定 → 特称肯定结论（有效式）','画欧拉图验证','与「事实真假」区分开：有效性只看形式'],ans:['形式为：所有 A 是 C（天鹅→白），有些 B 是 A（鸟∩天鹅非空）→ 有些 B 是 C。画图：天鹅集合整体在白色集合内，且与鸟类集合相交，交点部分必然是白色且是鸟——结论必然成立，形式有效。','注意区分「推理有效」与「结论为真」：有效性只依赖形式，本题前提若为假则结论事实真假另论，但推理形式依然有效。']},
  {id:'wx18',scene:'xingce',lv:1,qtype:'single',q:'「削苹果」「削铅笔」中的「削」字含义不同，这属于？',options:[{k:'A',t:'一词多义（多义词）'},{k:'B',t:'同音词'},{k:'C',t:'反义词'},{k:'D',t:'外来词'}],answer:'A',point:'考察词语的语义辨析。',tips:['同一个词在不同搭配下取不同义项','同音词是「音同形异义异」如「公式/攻势」'],ans:['「削」是典型的多义词：削苹果是「用刀去掉外皮」，削铅笔是「切削成尖」。同一书写形式承载多个相关义项，即一词多义。','行测言语题里，辨析多义词、近义词搭配（如「整顿/整治」「中止/终止」）是逻辑填空的常客。']},
  {id:'wx19',scene:'xingce',lv:2,qtype:'single',q:'「他不但学习好，而且乐于助人。」中「不但……而且……」表达的递进方向是？',options:[{k:'A',t:'前项轻、后项重（向更进一层递进）'},{k:'B',t:'前项重、后项轻'},{k:'C',t:'两项并列无轻重'},{k:'D',t:'转折关系'}],answer:'A',point:'考察关联词逻辑关系。',tips:['不但 A 而且 B：B 更进一层','顺序不能颠倒（学习好 < 乐于助人此处语境为递进）','关联词是主旨题与语句排序的抓手'],ans:['「不但……而且……」表示递进：后项在前项基础上更进一层。','行测言语题中，关联词（递进/转折/因果/并列/条件）决定了句间逻辑骨架——「虽然……但是……」重点在但是之后，「只要……就……」表充分条件等，需系统记忆。']},
  {id:'wx20',scene:'xingce',lv:2,qtype:'single',q:'一段文字的中心论点是「碎片化阅读导致深度思考能力下降」。文末出现「然而，也有研究表明适度利用碎片时间能提升信息获取效率。」这个「然而」之后的内容最可能是？',options:[{k:'A',t:'作者最终支持的结论'},{k:'B',t:'对前文的让步或补充视角，需结合后文判断倾向'},{k:'C',t:'与主题无关的插入信息'},{k:'D',t:'结论的重复'}],answer:'B',point:'考察主旨题的转折结构。',tips:['转折词后是语义重心','但「然而」后可能让步再反转，要看完整段落','主旨题先看首尾再看转折'],ans:['「然而」引出相反视角，常见结构是让步式补充或引出对立观点；作者最终立场需看转折之后是否再反转（然而→但/当然）。','行测主旨题的读法：转折词（然而/但是/可是）之后的句子通常是重点，但警惕「二次转折」，通读末段再定。']},
  {id:'wx21',scene:'xingce',lv:2,qtype:'single',q:'某市 2025 年 GDP 为 1200 亿元，同比增长 20%，则 2024 年 GDP 约为多少？',options:[{k:'A',t:'1000 亿元'},{k:'B',t:'960 亿元'},{k:'C',t:'1440 亿元'},{k:'D',t:'1100 亿元'}],answer:'A',point:'考察资料分析：基期量计算。',tips:['基期 = 现期 ÷ (1+增长率)','1200÷1.2=1000','区分「增长量」与「增长率」'],ans:['同比增长 20% 表示比基期多 20%：现期 = 基期×1.2，故基期 = 1200÷1.2 = 1000 亿元。','资料分析四大常用：基期量（÷(1+r)）、增长量（现期×r/(1+r)）、比重、平均数增速。「先除后乘」别用现期直接减 20%（1200-240=1160 是错的）。']},
  {id:'wx22',scene:'xingce',lv:2,qtype:'single',q:'2025 年某省出口额 800 亿元，占进出口总额的 40%，则进口额为多少？',options:[{k:'A',t:'1200 亿元'},{k:'B',t:'800 亿元'},{k:'C',t:'480 亿元'},{k:'D',t:'2000 亿元'}],answer:'A',point:'考察资料分析：比重逆推。',tips:['总额 = 800÷40% = 2000','进口 = 2000-800 = 1200'],ans:['出口占 40% → 总额 = 800÷0.4 = 2000 亿元；进口 = 总额 - 出口 = 1200 亿元。','比重类题目的关键是分清「部分/整体」：A 占 B 的 40% 则 B = A÷40%。计算时可用 800÷0.4 = 800×2.5 心算。']},
  {id:'wx23',scene:'xingce',lv:1,qtype:'single',q:'甲、乙、丙三人年龄依次相差 2 岁，三人年龄之和为 45，则甲（最大）的年龄是？',options:[{k:'A',t:'15'},{k:'B',t:'17'},{k:'C',t:'13'},{k:'D',t:'16'}],answer:'B',point:'考察和差问题（平均数思想）。',tips:['等差数列和 = 中项×3','中间人年龄 = 45÷3 = 15，甲 = 15+2'],ans:['三人年龄成等差，总和 45 → 中间人（乙）= 45÷3 = 15 岁，甲 = 15+2 = 17 岁。','等差数列的「和=中项×项数」是行测速算利器，比设方程快得多。']},
  {id:'wx24',scene:'xingce',lv:2,qtype:'single',q:'一列火车长 200 米，以 72 km/h 通过一座长 400 米的大桥，需要多少秒？',options:[{k:'A',t:'20 秒'},{k:'B',t:'30 秒'},{k:'C',t:'25 秒'},{k:'D',t:'15 秒'}],answer:'B',point:'考察火车过桥问题。',tips:['72 km/h = 20 m/s','路程 = 桥长 + 车长 = 600 米'],ans:['速度换算：72 km/h = 72×1000/3600 = 20 m/s；完全通过大桥行驶路程 = 桥长+车长 = 600 米；时间 = 600÷20 = 30 秒。','火车问题的核心：路程要「加上车长」；同类还有火车过隧道、两车错车（路程=两车长之和）。']},
  {id:'wx25',scene:'xingce',lv:2,qtype:'single',q:'某单位组织活动，若每人出 8 元则多 3 元；若每人出 7 元则少 4 元。人数与总费用各是多少？',options:[{k:'A',t:'7 人、53 元'},{k:'B',t:'8 人、61 元'},{k:'C',t:'7 人、61 元'},{k:'D',t:'6 人、51 元'}],answer:'A',point:'考察盈亏问题。',tips:['（盈+亏）÷分配差 = 人数','(3+4)÷(8-7)=7 人','总费用 7×8-3=53 或 7×7+4=53 双验证'],ans:['盈亏公式：人数 =（盈+亏）÷两次分配差 = (3+4)÷(8-7) = 7 人；总费用 = 7×8-3 = 53 元（或 7×7+4 = 53 验证一致）。','盈亏问题三变体：一盈一亏（和）、两盈（差）、两亏（差），注意分子是加还是减。']},
  {id:'wx26',scene:'xingce',lv:2,qtype:'single',q:'老虎、鲸鱼、大象、海豚四个词中，若按「主要生活环境」分类，哪两个属于同一类？',options:[{k:'A',t:'鲸鱼和海豚（水生）；老虎和大象（陆生）'},{k:'B',t:'鲸鱼和老虎（大型动物）；大象和海豚（灰色系）'},{k:'C',t:'四者全部同类'},{k:'D',t:'老虎和海豚（食肉）；鲸鱼和大象（食草）'}],answer:'A',point:'考察类比与归类（先定维度再验证）。',tips:['维度是「生活环境」：水生 vs 陆生','鲸鱼海豚是水生哺乳动物','B/C/D 换了维度或属性有误'],ans:['按生活环境：鲸鱼、海豚是水生哺乳动物，老虎、大象是陆地动物，两两分组为 A。','归类题的关键是先锁定「分类维度」再逐一验证；B 用体型、D 用食性都会得出不同分组——维度错则答案错。']},
  {id:'wx27',scene:'xingce',lv:2,qtype:'single',q:'「医生：患者」的逻辑关系，与「教师：（ ）」最相似的是？',options:[{k:'A',t:'学校'},{k:'B',t:'学生'},{k:'C',t:'课本'},{k:'D',t:'教室'}],answer:'B',point:'考察类比推理（职业与服务对象）。',tips:['医生服务患者，教师服务学生','对象是人；学校/课本/教室是场所与工具'],ans:['医生与患者是「职业：服务对象（人）」的关系，对应教师：学生。','类比题要点是先提炼词项间的「关系类型」（服务、工具、因果、并列、包含……），再逐一验证选项是否同构——对象是人的选项才吻合。']},
  {id:'wx28',scene:'xingce',lv:2,qtype:'single',q:'某公司规定「凡连续迟到三次者取消评优资格」。小王被取消了评优资格。据此能否推出小王连续迟到三次？',options:[{k:'A',t:'能，规则就是证据'},{k:'B',t:'不能，取消资格者未必都因连续迟到（可能存在其他条款）'},{k:'C',t:'取决于小王的态度'},{k:'D',t:'一定迟到过，但次数不确定'}],answer:'B',point:'考察充分条件与必要条件的混淆。',tips:['P→Q 成立时，Q 成立不能反推 P（肯定后件谬误）','「连续迟到三次」是充分条件非必要条件'],ans:['规则是「连续迟到三次 → 取消资格」，小王被取消只是肯定了后件；肯定后件不能推出前件——可能还有其他取消资格的条款（如违规操作）。','逻辑题高频谬误：肯定后件、否定前件都推不出；只有「否定后件」才能「否定前件」。']},
  {id:'wx29',scene:'xingce',lv:2,qtype:'single',q:'股票亏 10% 后需上涨多少才能回本？',options:[{k:'A',t:'10%'},{k:'B',t:'约 11.1%'},{k:'C',t:'约 9.1%'},{k:'D',t:'20%'}],answer:'B',point:'考察百分比的非对称性（金融常识+资料分析）。',tips:['0.9×(1+x)=1 → x=1/9≈11.1%','跌得深涨得难：跌 50% 需涨 100%'],ans:['设原价 1，亏 10% 后为 0.9；回本需 0.9×(1+x)=1，x=1/9≈11.1%。','涨跌百分比不对称：跌 x% 后需涨 x/(1-x) 才回本。跌 20% 需涨 25%，跌 50% 需涨 100%——这是资料分析、金融常识的高频考点。']},
  {id:'wx30',scene:'xingce',lv:2,qtype:'single',q:'12 名学生参加比赛，得分互不相同。已知小明比小红高，小刚不是最低，小红比小刚高。三人中得分最低的是？',options:[{k:'A',t:'小明'},{k:'B',t:'小红'},{k:'C',t:'小刚'},{k:'D',t:'无法确定'}],answer:'C',point:'考察排序推理。',tips:['由「小红比小刚高」直接得小刚 < 小红','小明 > 小红 > 小刚 串联起来'],ans:['由条件：小明 > 小红，小红 > 小刚，串成链：小明 > 小红 > 小刚，三人中最低是小刚。「小刚不是最低」指的是全部 12 人中不是最低，与三人内部比较不冲突。','排序推理题技巧：把条件翻译成不等式，寻找可串联的「共同元素」传递排序。']},
  {id:'wx31',scene:'xingce',lv:1,qtype:'judge',q:'行测资料分析中，「翻一番」表示增长为原来的 2 倍，「翻两番」表示增长为原来的 3 倍。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察资料分析术语精确性。',tips:['翻 n 番 = 原值 × 2ⁿ','翻两番 = ×4，不是 ×3'],ans:['翻一番 = ×2；翻两番 = ×2² = ×4（连续翻两次番）；翻三番 = ×8。「增长为原来的 3 倍」是「增长到 3 倍/增加 2 倍」的混淆陷阱。','资料分析术语要逐字抠：「是…的 n 倍」「增长 n 倍」「翻 n 番」含义各不同。']},
  {id:'wx32',scene:'xingce',lv:2,qtype:'judge',q:'概率为 0 的事件一定是不可能事件。',options:[{k:'A',t:'正确'},{k:'B',t:'错误'}],answer:'B',point:'考察概率概念的严谨性。',tips:['不可能事件 P=0；但 P=0 未必不可能','几何概型中「取中某一点」概率为 0 却可能发生'],ans:['不可能事件概率必为 0，但反之不成立：几何概型中随机点恰好落在线段某一确定点上，概率为 0 却并非不可能发生。','同族概念：概率为 1 的事件也未必是必然事件。这类「概念对称性」题考的是数学严谨性。']},
  {id:'wx33',scene:'xingce',lv:2,qtype:'fill',q:'一副去掉大小王的扑克牌共 52 张，至少抽____张才能保证有 4 张同花色。',answer:'13',point:'考察抽屉原理（最不利原则）。',tips:['最坏情况：每种花色各 3 张 = 12 张','再抽 1 张必然凑满某花色 4 张'],ans:['最不利原则：先让情况最「倒霉」——四花色各抽 3 张共 12 张仍无 4 张同色；再抽 1 张（第 13 张）无论什么花色都会使某花色达到 4 张。','抽屉原理题答法固定：构造最坏分布 + 至少数 = 最坏数 + 1。']},
  {id:'wx34',scene:'xingce',lv:2,qtype:'fill',q:'某商品原价 200 元，先打八折再立减 20 元，最终价格是____元。',answer:'140',point:'考察折扣运算顺序。',tips:['200×0.8=160','160-20=140','先折扣后立减（顺序影响结果）'],ans:['先八折：200×0.8=160 元；再减 20：160-20=140 元。','注意「先减后折」结果不同：180×0.8=144 元。商家的折扣顺序影响总价，计算题务必按题面顺序执行。']},
  {id:'wx35',scene:'xingce',lv:3,qtype:'short',q:'甲、乙、丙三个部门共有 180 人，甲部门人数是乙的 2 倍，丙部门比乙多 12 人，求三个部门各多少人？',answer:'乙 42、甲 84、丙 54。',point:'考察方程思想（设最小量为 x）。',tips:['设乙为 x：2x + x + (x+12) = 180','4x = 168 → x = 42','验算：84+42+54 = 180 ✓'],ans:['设乙为 x，则甲 2x、丙 x+12：2x+x+(x+12)=180 → 4x=168 → x=42。故乙 42、甲 84、丙 54。','验算：84+42+54=180 ✓ 且 84=2×42 ✓。应用题列完方程务必代入验证，行测时间紧张也不能省这一步。']},
  {id:'wx36',scene:'xingce',lv:2,qtype:'single',q:'「如果明天下雨，运动会就取消。」今天运动会没有取消，可以推出？',options:[{k:'A',t:'今天没下雨'},{k:'B',t:'今天下雨了但活动照常'},{k:'C',t:'规则作废'},{k:'D',t:'推不出任何结论'}],answer:'A',point:'考察假言命题的逆否规则。',tips:['P→Q 等价于 ¬Q→¬P（逆否等价）','否定后件 → 否定前件','肯定后件/否定前件推不出'],ans:['原命题「下雨→取消」，事实是「未取消」（¬Q），由逆否等价可推出「未下雨」（¬P）。','假言推理口诀：肯前必肯后、否后必否前、否前肯后都推不出。这是行测逻辑判断的核心规则，务必熟练。']},
  {id:'wx37',scene:'xingce',lv:2,qtype:'single',q:'某报告称「本院毕业生就业率达 98%」。以下哪项如果为真，最能质疑该结论的说服力？',options:[{k:'A',t:'该院就业率连续三年上升'},{k:'B',t:'「就业」统计中包含了灵活就业与自由职业，口径宽泛'},{k:'C',t:'该院今年扩大了招生规模'},{k:'D',t:'其他院校就业率也普遍较高'}],answer:'B',point:'考察削弱论证（质疑统计口径）。',tips:['削弱角度：论据可靠性、口径、样本、偷换概念','B 直击「就业」定义的模糊性','A 是加强项，C/D 无关或弱相关'],ans:['质疑论证最有效的方式是攻击「论据到结论」的链条：B 指出统计口径宽泛（灵活就业计入），使 98% 的含金量下降。','A 支持结论；C、D 与论证链无关。「攻击数据口径」是资料分析/逻辑题里最典型的削弱手段之一。']},
  {id:'wx38',scene:'xingce',lv:2,qtype:'single',q:'一只钟每小时慢 3 分钟，早上 8 点校准，当天钟面显示 11 点时，实际时间是？',options:[{k:'A',t:'11:09:28 左右'},{k:'B',t:'11:00'},{k:'C',t:'11:10 整'},{k:'D',t:'10:57'}],answer:'A',point:'考察坏钟问题（比例换算）。',tips:['坏钟走 57 分钟 = 实际 60 分钟','坏钟走 180 分钟 → 实际 180×60/57 ≈ 189.5 分钟'],ans:['坏钟 8:00→11:00 共走 180 分钟，但每小时慢 3 分意味着它走 57 分钟相当于实际 60 分钟：实际流逝 = 180×60/57 ≈ 189.47 分钟 ≈ 3 小时 9.5 分钟，实际约 11:09:28。','坏钟问题本质是「比例尺换算」，关键是找准「坏钟分钟数与真实分钟数的比率」。']},
  {id:'wx39',scene:'xingce',lv:1,qtype:'single',q:'1000 + 2000 ÷ 2 × 4 的计算结果是？',options:[{k:'A',t:'5000'},{k:'B',t:'6000'},{k:'C',t:'2400'},{k:'D',t:'1800'}],answer:'A',point:'考察运算顺序（乘除同级从左到右）。',tips:['先乘除后加减','乘除同级按出现顺序：2000÷2=1000，×4=4000'],ans:['同级运算从左到右：2000÷2=1000，1000×4=4000，再 1000+4000=5000。','行测计算题常在运算顺序上埋陷阱（如误算成 2000÷(2×4)），慢一秒看清符号比快算更保分。']},
  {id:'wx40',scene:'xingce',lv:2,qtype:'single',q:'鸡兔同笼：共有 35 个头、94 只脚，鸡有多少只？',options:[{k:'A',t:'23'},{k:'B',t:'24'},{k:'C',t:'22'},{k:'D',t:'21'}],answer:'A',point:'考察鸡兔同笼（假设法）。',tips:['假设全是鸡：脚 70，差 24','每只兔补 2 脚 → 兔 12、鸡 23'],ans:['假设全是鸡：35×2=70 只脚，实际 94，差 24；每把一只鸡换成兔多 2 脚，兔 = 24÷2 = 12，鸡 = 35-12 = 23。','验证：23×2+12×4 = 46+48 = 94 ✓。「假设法」是这类问题的通法，比二元方程更快。']},
  {id:'wx41',scene:'xingce',lv:2,qtype:'single',q:'「小张比小李高，小李比小王高，小王比小张高」这三个条件共同导致的结论是？',options:[{k:'A',t:'存在矛盾，条件不可能同时成立'},{k:'B',t:'小张最高'},{k:'C',t:'小王最高'},{k:'D',t:'三人一样高'}],answer:'A',point:'考察循环矛盾识别。',tips:['串起来：张>李>王>张 循环','严格的序关系不可成环'],ans:['张>李、李>王、王>张 串联成「张>李>王>张」，自身大于自身是逻辑矛盾——三个条件不可能同时为真。','逻辑题遇到「环状比较」要警惕矛盾；若题干声称全部为真，答案就是「条件冲突」。']},
  {id:'wx42',scene:'xingce',lv:2,qtype:'single',q:'某商店促销「满 300 减 50，可叠加商品自身八折」。买一件原价 400 元的商品，最低付款？',options:[{k:'A',t:'270 元'},{k:'B',t:'320 元'},{k:'C',t:'270 或 320 元，取决于优惠叠加顺序'},{k:'D',t:'250 元'}],answer:'A',point:'考察优惠叠加的最优组合计算。',tips:['先八折 400×0.8=320，满 300 减 50 → 270','若先减 50 后打八折：350×0.8=280，「可叠加」取更优 270'],ans:['两种顺序：先八折再满减 400×0.8-50=270；先满减再八折 (400-50)×0.8=280。商家「可叠加」通常按对消费者更有利或规则顺序执行，最低为 270 元。','优惠计算题先枚举所有叠加顺序，取最优；生活常识类题目近年常出现在行测中。']},
  {id:'wx43',scene:'xingce',lv:2,qtype:'single',q:'「文段」：甲公司的客服响应时间是 2 小时，行业平均是 30 分钟。「这」说明甲公司服务体验如何？从论证角度看最严谨的说法是？',options:[{k:'A',t:'甲公司服务一定很差'},{k:'B',t:'仅凭单一指标与平均值对比，不能直接得出整体服务差的结论，还需结合响应质量、解决率等维度'},{k:'C',t:'行业平均数据必然不准确'},{k:'D',t:'甲公司规模太大所以慢是合理的'}],answer:'B',point:'考察数据论证的严谨性（单指标陷阱）。',tips:['单一指标 ≠ 整体结论','平均数易被极端值拉偏','客服体验是多维：响应+解决率+满意度'],ans:['B 最严谨：一个指标落后于均值只能说明「响应速度待改进」，不能直接推断整体服务差；评估需多维数据（首次解决率、满意度、升级率）且平均数本身可能被极端值扭曲。','这类题考「数据≠结论」的论证意识，与 AI 产品评估、报表分析场景相通。']},
  {id:'wx44',scene:'xingce',lv:2,qtype:'single',q:'下列句子中，没有语病的一句是？',options:[{k:'A',t:'通过这次学习，使我提高了认识。'},{k:'B',t:'能否按时完成任务，是衡量工作态度的重要标准。'},{k:'C',t:'我们必须善于发现并认真克服工作中的缺点。'},{k:'D',t:'他基本上把坏习惯彻底改掉了。'}],answer:'C',point:'考察病句识别（成分残缺/两面对一面/语序/前后矛盾）。',tips:['A：介词淹没主语','B：一面对两面','D：基本上 vs 彻底矛盾','C 语序合理：先发现后克服'],ans:['C 正确：「善于发现并认真克服」语序合理（先发现后处理）。','其余为经典病句：A「通过…使…」双介词结构淹没主语；B「能否」两面对「是…标准」一面，前后不对应；D「基本上」与「彻底」语义矛盾。','病句六大类型：语序不当、搭配不当、成分残缺、句式杂糅、表意不明、不合逻辑，先归类再判断。']},
  {id:'wx45',scene:'xingce',lv:2,qtype:'single',q:'某队列初始为空。依次入队 1、2、3，然后出队一次，再入队 4、5，再出队两次。最后队首元素是？',options:[{k:'A',t:'4'},{k:'B',t:'3'},{k:'C',t:'5'},{k:'D',t:'2'}],answer:'A',point:'考察队列 FIFO 的推演（行测新趋势：基础算法常识）。',tips:['队列先进先出','入 123 → 出(得1) → 入45 → 队列为 2,3,4,5 → 出两次(得2,3) → 队首 4'],ans:['入队 1,2,3 → 出队弹出 1（剩 2,3）→ 入队 4,5（2,3,4,5）→ 出队两次弹出 2、3（剩 4,5）→ 队首为 4。','队列是先进先出，与栈（后进先出）对照记忆；行测近年开始出现这类基础算法常识题。']},
  {id:'wx46',scene:'xingce',lv:2,qtype:'single',q:'甲乙两个文具盒共有 24 支笔，甲的笔数是乙的 3 倍，乙有多少支？',options:[{k:'A',t:'6 支'},{k:'B',t:'8 支'},{k:'C',t:'12 支'},{k:'D',t:'18 支'}],answer:'A',point:'考察和倍问题。',tips:['和 ÷ (倍数+1) = 较小数','24÷(3+1)=6'],ans:['和倍公式：较小数 = 和 ÷ (倍数+1) = 24÷4 = 6 支，甲 18 支。','验证：6+18=24 ✓ 且 18=3×6 ✓。「和倍/差倍」两兄弟公式常一起考。']},
  {id:'wx47',scene:'xingce',lv:2,qtype:'single',q:'从 1 到 100 的所有整数之和是？',options:[{k:'A',t:'5050'},{k:'B',t:'5000'},{k:'C',t:'5100'},{k:'D',t:'4950'}],answer:'A',point:'考察等差数列求和（高斯配对法）。',tips:['首尾配对：1+100=101，共 50 对','101×50=5050'],ans:['等差求和公式 n(a₁+aₙ)/2 = 100×(1+100)/2 = 5050；也可以用高斯配对法：首尾配 50 对、每对 101。','这是行测数列求和的基本功，等差公式与配对法都要熟练。']},
  {id:'wx48',scene:'xingce',lv:2,qtype:'single',q:'「有些工程师喜欢加班」为真，则必然为真的是？',options:[{k:'A',t:'所有工程师都不喜欢加班'},{k:'B',t:'所有工程师都喜欢加班'},{k:'C',t:'存在至少一位工程师喜欢加班'},{k:'D',t:'有些工程师不喜欢加班'}],answer:'C',point:'考察「有些」的逻辑含义。',tips:['逻辑上的「有些」=「至少一个」，不代表「部分且非全部」','「有些 A 是 B」不能推出「有些 A 不是 B」'],ans:['逻辑中「有些」意为「至少存在一个」，故必然有 C。「有些 A 是 B」为真时，可能全体都是 B，因此推不出 D（可能没有人不喜欢）。','形式逻辑中特称量词的精确含义是常考陷阱：有些=存在，与日常语言中「部分」不同。']},
  {id:'wx49',scene:'xingce',lv:2,qtype:'single',q:'甲乙丙丁四人的职业分别是教师、医生、律师、工程师（顺序未知）。甲不会看病；乙只会教书法；丙是丁的表哥；工程师比丙年轻。问医生是谁？',options:[{k:'A',t:'甲'},{k:'B',t:'乙'},{k:'C',t:'丙'},{k:'D',t:'丁'}],answer:'D',point:'考察排除法匹配推理。',tips:['甲不会看病 → 非医生','乙只会教书法 → 教师','工程师比丙年轻 → 丙非工程师；甲乙职业已定 → 工程师是丁或丙…','丙非工程师 → 丁是工程师 → 医生只能是丙或丁中剩余 → 医生是丙？——重新排：甲教师？乙是教师 → 甲非教师 → 甲律师 → 医生/工程师给丙丁，丙非工程师 → 丙医生、丁工程师。'],ans:['逐人排除：乙只会教书法 → 乙=教师；甲不会看病 → 甲≠医生，甲=律师（教师已占）；「工程师比丙年轻」→ 丙≠工程师 → 丙=医生，丁=工程师。','此类匹配推理用「表格+排除」最稳：每人每职业一列，先填确定的，再传递排除。']},
  {id:'wx50',scene:'xingce',lv:2,qtype:'single',q:'「小明从家到学校，若每分钟走 50 米则迟到 4 分钟；若每分钟走 60 米则提前 2 分钟。」家到学校的距离是？',options:[{k:'A',t:'1800 米'},{k:'B',t:'2000 米'},{k:'C',t:'2100 米'},{k:'D',t:'1500 米'}],answer:'A',point:'考察行程问题（盈亏式行程）。',tips:['设准时需 t 分钟：50(t+4)=60(t-2)','50t+200=60t-120 → t=32','距离 = 50×36 = 1800'],ans:['设准时到达需 t 分钟，两种走法路程相等：50(t+4)=60(t-2) → 50t+200=60t-120 → t=32 分钟；距离 = 50×(32+4)=1800 米（验算 60×30=1800 ✓）。','核心是「路程相等」列方程；也可用盈亏公式：距离 = 50×60×(4+2)÷(60-50) = 1800。']},
  {id:'wx51',scene:'xingce',lv:1,qtype:'single',q:'「徒手」「徒步」「徒劳」中的「徒」字含义依次是？',options:[{k:'A',t:'三个都表示「空手」'},{k:'B',t:'空、光（徒手）；步行（徒步）；白白地（徒劳）'},{k:'C',t:'只有「徒手」是「空」的意思'},{k:'D',t:'三个都表示「步行」'}],answer:'B',point:'考察一词多义辨析。',tips:['徒手=空手；徒步=步行；徒劳=白白地','多义词在不同词语中取不同义项'],ans:['「徒」是多义字：徒手（空、光）、徒步（步行）、徒劳（白白地、徒然）。','逻辑填空题靠「组内辨义」：把同一个字放进不同词语比含义，是文言常识与语感的综合考察。']},
  {id:'wx52',scene:'xingce',lv:2,qtype:'single',q:'某班 40 人，一次测验及格 32 人。及格率是多少？不及格率是多少？',options:[{k:'A',t:'80% 和 20%'},{k:'B',t:'32% 和 8%'},{k:'C',t:'80% 和 8%'},{k:'D',t:'75% 和 25%'}],answer:'A',point:'考察百分率计算与互补关系。',tips:['32/40 = 0.8 = 80%','及格率+不及格率 = 100%'],ans:['及格率 = 32÷40 = 80%；不及格率 = 100%-80% = 20%（8÷40 验证）。','百分率题注意「互补关系」与分母：率 = 部分÷整体，别拿 8÷32 这类错分母。']},
