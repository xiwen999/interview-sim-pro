<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浏览题库 · 模拟面试训练营 Pro</title>
<link rel="stylesheet" href="shared.css?v=20261104b">
<style>
body{background:
  radial-gradient(ellipse 80% 50% at 20% -10%,rgba(138,189,255,.12),transparent),
  radial-gradient(ellipse 60% 40% at 80% 10%,rgba(94,234,212,.08),transparent),
  radial-gradient(ellipse 50% 30% at 50% 100%,rgba(108,140,255,.06),transparent),
  #0a1020}
.fp-wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at 15% 25%,rgba(138,189,255,.06) 0 2px,transparent 2px),
    radial-gradient(circle at 85% 35%,rgba(94,234,212,.05) 0 1.5px,transparent 1.5px),
    radial-gradient(circle at 45% 65%,rgba(108,140,255,.04) 0 1px,transparent 1px);
  background-size:180px 180px,220px 220px,160px 160px;opacity:.6}
.fp-shell{position:relative;overflow:hidden}
/* 壳内动态星光层：与首页/个人中心同一套 seedStars 三层视差上飘星空 */
.fx-stars{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fp-shell::after{content:"📚";position:absolute;right:-20px;top:-30px;font-size:180px;opacity:.03;
  transform:rotate(15deg);pointer-events:none;filter:grayscale(.3)}
@media (max-width:1024px){.fp-shell::after{font-size:120px;right:-10px;top:-20px}}
/* 浅色模式适配 */
body.light{background:linear-gradient(180deg,#ffffff 0%,#fcfdff 38%,#f5f8ff 100%)}
body.light .fp-wrap::before{opacity:.25}
body.light .fp-shell::after{opacity:.02}
/* 筛选按钮：对齐 interview 设置页选项风格（JS 仍用 .chip/.on，仅改视觉） */
.filters .chip{padding:10px 16px;border-radius:13px;font-size:var(--fs-base);font-weight:600;color:var(--ink2);
  background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)}
.filters .chip:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.filters .chip.on{border-color:var(--acc);color:var(--ink);background:rgba(108,140,255,.14);
  box-shadow:0 0 0 3px rgba(108,140,255,.14),0 10px 24px rgba(108,140,255,.22)}
.toolbar{padding:4px 0 14px}
.search-box{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:13px;padding:11px 16px;margin-bottom:12px;transition:.2s}
.search-box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(108,140,255,.14)}
.search-box svg{color:var(--ink3);flex:none}
.search-box input{flex:1;background:none;border:none;outline:none;font-size:var(--fs-base)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .fg-lab{font-size:var(--fs-xs);color:var(--ink3);align-self:center;margin:0 2px 0 6px}
.count-line{font-size:var(--fs-xs);color:var(--ink3);margin:14px 2px 12px}
.q-item{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;background:var(--card);transition:.2s}
.q-item:hover{border-color:var(--line2)}
.q-item .qi-h{display:flex;align-items:center;gap:11px;padding:clamp(14px,1.8vw,17px) clamp(14px,2vw,20px);cursor:pointer}
.q-item .qi-h .qt{flex:1;min-width:0;font-size:var(--fs-md);font-weight:700;line-height:1.6}
.q-item .qi-h .chev{color:var(--ink3);display:flex;transition:.25s;flex:none}
.q-item.open .qi-h .chev{transform:rotate(180deg)}
.q-item .qi-b{display:none;padding:0 20px 18px;border-top:1px dashed var(--line)}
.q-item.open .qi-b{display:block;animation:rise .3s both}
.q-item .qi-b h5{font-size:var(--fs-xs);font-weight:800;color:var(--acc2);margin:14px 0 8px}
.q-item .qi-b li{list-style:none;font-size:var(--fs-base);line-height:1.8;color:var(--ink2);padding-left:17px;position:relative;margin-bottom:5px}
.q-item .qi-b .ans li::before{content:"▸";position:absolute;left:0;color:var(--acc)}
.q-item .qi-b .tip li::before{content:"💡";position:absolute;left:-4px;font-size:var(--fs-2xs);top:3px}
.qi-practice{flex:none;font-size:var(--fs-xs);padding:7px 14px;border-radius:9px;background:rgba(108,140,255,.15);
  border:1px solid rgba(108,140,255,.4);color:#cdd8ff;transition:.18s}
.qi-practice:hover{background:rgba(108,140,255,.3)}
.empty{text-align:center;padding:clamp(40px,6vw,60px) 20px;color:var(--ink3);font-size:var(--fs-base)}
.empty .e-ic{font-size:44px;display:block;margin-bottom:12px}

/* ≤480：题目行改为多行排列，标签/按钮不再挤压题干 */
@media (max-width:480px){
  .q-item .qi-h{flex-wrap:wrap;row-gap:8px}
  .q-item .qi-h .qt{flex:1 1 100%;order:3}
  .qi-practice{margin-left:auto;order:4}
  .q-item .qi-h .chev{order:5}
  .q-item .qi-b{padding:0 16px 16px}
}
@media (pointer:coarse){
  .qi-practice{min-height:44px;padding:10px 16px}
  .q-item .qi-h .chev{min-width:44px;min-height:44px;align-items:center;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="fp-wrap">
  <div class="fp-shell rise">
    <div class="fx-stars" aria-hidden="true"><div id="bkStars1"></div><div id="bkStars2"></div><div id="bkStars3"></div></div>
    <div class="fp-head">
      <div class="fp-ic">📚</div>
      <div>
        <h1>浏览题库</h1>
        <p class="fp-sub">按场景与难度筛选高频真题，展开查看考察点、作答技巧与参考要点；遇到好题点 ⭐ 收藏。</p>
      </div>
      <div class="fp-acts"><button class="btn pri sm" onclick="location.href='interview.html'">🎤 去练一场</button></div>
    </div>
    <div class="fp-tip">
      <span class="fp-tip-ic">💡</span>
      <div style="flex:1">
        <div class="fp-tip-t">怎么用题库最高效？</div>
        <div class="fp-tip-d">先按目标场景筛选 → 看题先自己口述思路 → 再展开对照考察点与参考要点，差距就是提升点。</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="search-box"><span id="srchIc"></span><input id="kw" placeholder="搜索题目关键词，如：自我介绍 / 数据倾斜 / 留存…" aria-label="搜索题目关键词"></div>
      <div class="filters" id="scFilter"></div>
      <div class="filters" style="margin-top:8px" id="lvFilter"></div>
    </div>
    <div class="count-line" id="cntLine"></div>
    <div id="list" class="d1"></div>
  </div>
</div>

<script src="shared.js?v=20261104b"></script>
<script>
if(!initPage('bank',true))throw new Error('login required');
/* 壳内动态星空（700×1px/60s、200×2px/120s、100×3px/180s 视差上飘，与首页一致） */
seedStars('bkStars1',700,1,60);seedStars('bkStars2',200,2,120);seedStars('bkStars3',100,3,180);
document.getElementById('srchIc').innerHTML=ICONS.search;

var F={scene:'all',lv:0,kw:'',fav:false};

/* 场景筛选 */
var scF=document.getElementById('scFilter');
scF.innerHTML='<button class="chip on" data-k="all">全部场景</button>'+Object.keys(SCENES).map(function(k){
  return '<button class="chip" data-k="'+k+'"><span style="width:8px;height:8px;border-radius:50%;background:'+SCENE_COLOR[k]+'"></span>'+SCENES[k].name+'</button>'}).join('');
$$('#scFilter .chip').forEach(function(b){b.onclick=function(){F.scene=b.dataset.k;$$('#scFilter .chip').forEach(function(x){x.classList.toggle('on',x===b)});render()}});

/* 难度筛选 */
var lvF=document.getElementById('lvFilter');
lvF.innerHTML='<span class="fg-lab">难度</span><button class="chip on" data-k="0">全部</button>'+[1,2,3].map(function(l){
  return '<button class="chip" data-k="'+l+'">'+LV_NAME[l]+'</button>'}).join('')+
  '<span class="fg-lab" style="margin-left:10px">收藏</span><button class="chip" id="onlyFav">⭐ 只看收藏</button>';
$$('#lvFilter .chip').forEach(function(b){b.onclick=function(){if(b.id==='onlyFav')return;F.lv=+b.dataset.k;$$('#lvFilter .chip').forEach(function(x){x.classList.toggle('on',x===b||x.id==='onlyFav')});render()}});
document.getElementById('onlyFav').onclick=function(){F.fav=!F.fav;this.classList.toggle('on',F.fav);render()};

var kwTimer=null;
document.getElementById('kw').addEventListener('input',function(){
  var v=this.value.trim();
  clearTimeout(kwTimer);
  kwTimer=setTimeout(function(){F.kw=v;render()},200); /* 200ms debounce，避免每敲一个字就全量重渲染 */
});

function render(){
  var favs=getFavs();
  var list=QUESTIONS.filter(function(q){
    if(F.scene!=='all'&&q.scene!==F.scene)return false;
    if(F.lv&&q.lv!==F.lv)return false;
    if(F.kw&&q.q.toLowerCase().indexOf(F.kw.toLowerCase())<0)return false;
    if(F.fav&&!isFav(q.id))return false;
    return true;
  });
  document.getElementById('cntLine').textContent='共 '+list.length+' 道题 · 已收藏 '+favs.length+' 道';
  if(!list.length){document.getElementById('list').innerHTML='<div class="empty"><span class="e-ic">🔍</span>'+(F.fav?'还没有收藏的题目，点 ⭐ 收藏喜欢的题':'没有匹配的题目，换个关键词或筛选条件试试')+'</div>';return}
  document.getElementById('list').innerHTML=list.map(function(q,i){
    var favIcon=isFav(q.id)?'⭐':'☆';
    return '<div class="q-item" data-id="'+q.id+'">'+
      '<div class="qi-h">'+
        '<span class="tag" style="background:'+SCENE_COLOR[q.scene]+'22;color:'+SCENE_COLOR[q.scene]+';flex:none">'+SCENES[q.scene].name+'</span>'+
        '<span class="qt">'+esc(q.q)+'</span>'+
        '<button class="qi-fav txA" data-id="'+q.id+'" title="收藏/取消" style="font-size:16px;padding:6px 8px;border-radius:8px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);cursor:pointer">'+favIcon+'</button>'+
        '<span class="tag txB2" style="background:rgba(108,140,255,.13);flex:none">'+LV_NAME[q.lv]+'</span>'+
        '<button class="qi-practice" data-s="'+q.scene+'">练这道 →</button>'+
        '<span class="chev">'+ICONS.chev+'</span>'+
      '</div>'+
      '<div class="qi-b">'+
        '<h5>🎯 考察点</h5><div style="font-size:13px;color:var(--ink2);line-height:1.7">'+esc(q.point)+'</div>'+
        '<h5>💡 作答技巧</h5><ul class="tip">'+q.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>'+
        '<h5>✅ 参考要点</h5><ul class="ans">'+q.ans.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ul>'+
      '</div></div>';
  }).join('');
  $$('#list .qi-h').forEach(function(h){h.addEventListener('click',function(e){
    if(e.target.classList.contains('qi-practice')||e.target.classList.contains('qi-fav'))return;
    h.parentNode.classList.toggle('open')})});
  /* 练题 / 收藏属于功能，游客需先登录（看题、搜题、展开要点照常开放） */
  $$('#list .qi-practice').forEach(function(b){b.onclick=function(e){e.stopPropagation();if(!canUseFeature())return;location.href='interview.html?scene='+b.dataset.s}});
  $$('#list .qi-fav').forEach(function(b){b.onclick=function(e){e.stopPropagation();if(!canUseFeature())return;toggleFav(b.dataset.id);render()}});
}
render();
</script>
</body>
</html>
