<style>
body{background:
  radial-gradient(ellipse 80% 50% at 20% -10%,rgba(138,189,255,.12),transparent),
  radial-gradient(ellipse 60% 40% at 80% 10%,rgba(94,234,212,.08),transparent),
  radial-gradient(ellipse 50% 30% at 50% 100%,rgba(108,140,255,.06),transparent),
  #0a1020}
.fp-wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at 15% 25%,rgba(138,189,255,.06) 0 2px,transparent 2px),
    radial-gradient(circle at 85% 35%,rgba(94,234,212,.05) 0 1.5px,transparent 1.5px),
    radial-gradient(circle at 45% 65%,rgba(108,140,255,.04) 0 1px,transparent 1px);
  background-size:180px 180px,220px 220px,160px 160px;opacity:.6}
.fp-shell{position:relative;overflow:hidden}
/* 壳内动态星光层：与首页/个人中心同一套 seedStars 三层视差上飘星空 */
.fx-stars{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fp-shell::after{content:"📚";position:absolute;right:-20px;top:-30px;font-size:180px;opacity:.03;
  transform:rotate(15deg);pointer-events:none;filter:grayscale(.3)}
@media (max-width:1024px){.fp-shell::after{font-size:120px;right:-10px;top:-20px}}
/* 浅色模式适配（背景由 shared.css 的 body.light .bg-fx 统一提供） */
body.light .fp-wrap::before{opacity:.25}
body.light .fp-shell::after{opacity:.02}
/* 题库大卡片与页面背景融合：去掉壳体的底色 / 描边 / 投影，让极光背景连续铺满 */
body.light .fp-shell{
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
body.light .fp-shell::before{display:none}
/* 壳体透明后，题目卡成为唯一的“卡片层”：蓝 → 薄荷的对角渐变呼应页面极光 */
body.light .q-item{
  background:
    linear-gradient(135deg,rgba(108,140,255,.10) 0%,rgba(255,255,255,0) 48%,rgba(45,212,191,.10) 100%),
    linear-gradient(180deg,#fcfdff 0%,#f4f7fd 100%) !important;
  border-color:rgba(15,23,42,.11);
  box-shadow:var(--surface-sh);
}
body.light .q-item:hover{border-color:rgba(108,140,255,.38)}
/* 展开态：渐变稍微加深，提示“这张卡正在被阅读” */
body.light .q-item.open{
  background:
    linear-gradient(135deg,rgba(108,140,255,.15) 0%,rgba(255,255,255,.35) 46%,rgba(45,212,191,.12) 100%),
    linear-gradient(180deg,#fbfdff 0%,#f2f6fd 100%) !important;
  border-color:rgba(108,140,255,.30);
  box-shadow:0 12px 30px -20px rgba(37,99,235,.45),inset 0 1px 0 #fff;
}
/* 筛选按钮：对齐 interview 设置页选项风格（JS 仍用 .chip/.on，仅改视觉） */
.filters .chip{padding:10px 16px;border-radius:13px;font-size:var(--fs-base);font-weight:600;color:var(--ink2);
  background:var(--card);border:1.5px solid var(--line);
  box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)}
.filters .chip:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.filters .chip.on{border-color:var(--acc);color:var(--ink);background:rgba(108,140,255,.14);
  box-shadow:0 0 0 3px rgba(108,140,255,.14),0 10px 24px rgba(108,140,255,.22)}
.toolbar{padding:4px 0 14px}
.search-box{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.03);border:1px solid var(--line);
  border-radius:13px;padding:11px 16px;margin-bottom:12px;transition:.2s}
.search-box:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(108,140,255,.14)}
.search-box svg{color:var(--ink3);flex:none}
.search-box input{flex:1;background:none;border:none;outline:none;font-size:var(--fs-base)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .fg-lab{font-size:var(--fs-xs);color:var(--ink3);align-self:center;margin:0 2px 0 6px}
.count-line{font-size:var(--fs-xs);color:var(--ink3);margin:14px 2px 12px}
.q-item{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;background:var(--card);transition:.2s}
.q-item:hover{border-color:var(--line2)}
.q-item .qi-h{display:flex;align-items:center;gap:11px;padding:clamp(14px,1.8vw,17px) clamp(14px,2vw,20px);cursor:pointer}
.q-item .qi-h .qt{flex:1;min-width:0;font-size:var(--fs-md);font-weight:700;line-height:1.6}
.q-item .qi-h .chev{color:var(--ink3);display:flex;transition:.25s;flex:none}
.q-item.open .qi-h .chev{transform:rotate(180deg)}
.q-item .qi-b{display:none;padding:0 20px 18px;border-top:1px dashed var(--line)}
.q-item.open .qi-b{display:block;animation:rise .3s both}
.q-item .qi-b h5{font-size:var(--fs-xs);font-weight:800;color:var(--acc2);margin:14px 0 8px}
.q-item .qi-b li{list-style:none;font-size:var(--fs-base);line-height:1.8;color:var(--ink2);padding-left:17px;position:relative;margin-bottom:5px}
.q-item .qi-b .ans li::before{content:"▸";position:absolute;left:0;color:var(--acc)}
.q-item .qi-b .tip li::before{content:"💡";position:absolute;left:-4px;font-size:var(--fs-2xs);top:3px}
.qi-practice{flex:none;font-size:var(--fs-xs);padding:7px 14px;border-radius:9px;background:rgba(108,140,255,.15);
  border:1px solid rgba(108,140,255,.4);color:#cdd8ff;transition:.18s}
.qi-practice:hover{background:rgba(108,140,255,.3)}
.empty{text-align:center;padding:clamp(40px,6vw,60px) 20px;color:var(--ink3);font-size:var(--fs-base)}
.empty .e-ic{font-size:44px;display:block;margin-bottom:12px}

/* ≤480：题目行改为多行排列，标签/按钮不再挤压题干 */
@media (max-width:480px){
  .q-item .qi-h{flex-wrap:wrap;row-gap:8px}
  .q-item .qi-h .qt{flex:1 1 100%;order:3}
  .qi-practice{margin-left:auto;order:4}
  .q-item .qi-h .chev{order:5}
  .q-item .qi-b{padding:0 16px 16px}
}
@media (pointer:coarse){
  .qi-practice{min-height:44px;padding:10px 16px}
  .q-item .qi-h .chev{min-width:44px;min-height:44px;align-items:center;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* 核心 Tab：🎤 面试题库 / 📝 笔试题库 分段切换（搜索框下方，最醒目） */
.bk-tabs{display:flex;gap:6px;padding:5px;margin:2px 0 14px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;
  width:fit-content;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.bk-tabs button{display:inline-flex;align-items:center;gap:7px;padding:9px 22px;border-radius:10px;
  font-size:var(--fs-base);font-weight:700;color:var(--ink3);background:transparent;border:none;cursor:pointer;transition:.18s}
.bk-tabs button:hover{color:var(--ink)}
.bk-tabs button.on{color:#fff;background:linear-gradient(135deg,#2dd4bf 0%,#4f6ef0 60%,#6C8CFF 100%);
  box-shadow:0 6px 18px rgba(79,110,240,.45),inset 0 0 0 1px rgba(255,255,255,.18)}

/* 筛选分栏：用竖线 | 分组（场景 | 难度/收藏），视线瞬间找到维度 */
.filters-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters-bar .filters{margin-top:0}
.fg-sep{width:1px;height:22px;background:var(--line2);opacity:.55;flex:none}
@media(max-width:560px){.fg-sep{display:none}.filters-bar{gap:6px}}

/* 右上角帮助图标 (?)：hover 才显示使用指南，不占黄金位置 */
.bk-help{width:34px;height:34px;border-radius:50%;flex:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;
  color:var(--ink3);background:rgba(255,255,255,.04);border:1px solid var(--line);transition:.18s;position:relative}
.bk-help:hover,.bk-help:focus{color:var(--ink);border-color:var(--acc);background:rgba(108,140,255,.12);outline:none}
.bk-help::after{content:"先按目标场景筛选 → 看题先自己口述/作答思路 → 再展开对照考察点与参考要点，差距就是提升点。";
  position:absolute;right:0;top:calc(100% + 8px);width:268px;padding:10px 12px;border-radius:10px;
  font-size:var(--fs-xs);font-weight:500;line-height:1.65;color:var(--ink2);text-align:left;
  background:rgba(13,20,38,.97);border:1px solid var(--line2);
  box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;visibility:hidden;transform:translateY(-4px);transition:.18s;z-index:90;pointer-events:none}
.bk-help:hover::after,.bk-help:focus::after{opacity:1;visibility:visible;transform:translateY(0)}
body.light .bk-help::after{background:#ffffff;color:#334155}

/* 列表行最左侧：极小题型图标（🎤 面试 / 📝 笔试），一眼区分 */
.q-item .qi-h .qtype-ic{flex:none;font-size:14px;width:26px;height:26px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}

/* 练这道 / 看解析：蓝色微光边框次要按钮，hover 变亮，增加点击欲望 */
.qi-practice{background:rgba(108,140,255,.10);border:1px solid rgba(108,140,255,.5);color:#dbe4ff;
  box-shadow:0 4px 14px -6px rgba(108,140,255,.45);transition:.18s}
.qi-practice:hover{background:rgba(108,140,255,.22);border-color:rgba(108,140,255,.9);color:#fff;
  box-shadow:0 0 12px rgba(108,140,255,.45),0 6px 18px -6px rgba(108,140,255,.6);transform:translateY(-1px)}

/* 行内题型小标签（单选/多选/判断/填空/简答），略小于场景标签 */
.qtype-tag{font-size:var(--fs-2xs)!important;padding:3px 9px!important;border-radius:7px!important;font-weight:700}

/* 收起态内联选项：选择题不展开也能看到 A/B/C/D，缩进对齐题干 */
.qi-opts{margin:0 20px 14px 48px;display:grid;gap:7px}
.qi-opts .opt{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;border-radius:9px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);cursor:default;transition:.18s}
.qi-opts .opt:hover{background:rgba(255,255,255,.06);border-color:var(--line2)}
.qi-opts .opt-k{flex:none;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-size:var(--fs-xs);font-weight:800;color:var(--ink2);background:rgba(255,255,255,.08);border:1px solid var(--line)}
.qi-opts .opt-t{flex:1;min-width:0;font-size:var(--fs-sm);color:var(--ink2);line-height:1.65;padding-top:2px}

/* 正确项：收起态不透露答案，展开（.open）后才高亮为绿色 + 打勾 */
.qi-opts .opt.is-ans{position:relative}
.q-item.open .qi-opts .opt.is-ans{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.6);color:#e8fff5}
.q-item.open .qi-opts .opt.is-ans .opt-t{color:#c8f7e5}
.q-item.open .qi-opts .opt.is-ans .opt-k{background:linear-gradient(135deg,#34D399,#10B981);color:#06281d;border-color:transparent}
.q-item.open .qi-opts .opt.is-ans::after{content:"✓";color:#34D399;font-weight:900;margin-left:auto;padding-top:1px}

/* 展开区：笔试正确答案色块（醒目） + 解析排版 */
.wr-ans{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:11px;margin-bottom:4px;
  background:linear-gradient(135deg,rgba(52,211,153,.18),rgba(16,185,129,.08));
  border:1px solid rgba(52,211,153,.45);box-shadow:0 8px 22px -10px rgba(16,185,129,.5)}
.wr-ans .wr-ans-lab{font-size:var(--fs-sm);font-weight:800;color:#6ee7b7;flex:none}
.wr-ans .wr-ans-key{font-size:var(--fs-lg);font-weight:900;color:#34D399;letter-spacing:1px}
.wr-point{font-size:var(--fs-sm);color:var(--ink2);line-height:1.75}
.ans-box{margin-top:8px}
.ans-box p{font-size:var(--fs-sm);color:var(--ink2);line-height:1.8;margin:0 0 7px;padding-left:17px;position:relative}
.ans-box p::before{content:"▸";position:absolute;left:0;color:#34D399}

/* 窄屏：内联选项缩进减小，避免题干区过窄 */
@media(max-width:480px){.qi-opts{margin:0 14px 12px 14px}}

/* 浅色模式适配 */
body.light .qi-opts .opt{background:#f8fafc;border-color:#e2e8f0}
body.light .qi-opts .opt-k{background:#eef2ff;color:#4338ca;border-color:#e0e7ff}
body.light .qi-opts .opt-t{color:#334155}
body.light .q-item.open .qi-opts .opt.is-ans{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.55)}
body.light .q-item.open .qi-opts .opt.is-ans .opt-t{color:#065f46}
body.light .wr-ans{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(16,185,129,.04));border-color:rgba(16,185,129,.4)}
body.light .wr-ans .wr-ans-lab{color:#047857}
body.light .wr-ans .wr-ans-key{color:#059669}
body.light .ans-box p{color:#334155}
</style>

<script>
if(!initPage('bank',true))throw new Error('login required');
/* 壳内动态星空（700×1px/60s、200×2px/120s、100×3px/180s 视差上飘，与首页一致） */

var WRITTEN_SCENES = {
  fe:{id:'fe',name:'前端笔试',desc:'HTML / CSS / JavaScript 基础与高频笔试题'},
  algo:{id:'algo',name:'算法笔试',desc:'数据结构 / 算法 / 复杂度 高频笔试题'},
  xingce:{id:'xingce',name:'行测 / 综合',desc:'言语理解 / 数量关系 / 逻辑推理 行测题'}
};
var WRITTEN_COLOR = {fe:'#60A5FA',algo:'#34D399',xingce:'#F472B6'};
/* 笔试题型：单选 / 多选 / 判断 / 填空 / 简答，配一个识别色做行内小标签 */
var WR_QTYPE = {
  single:{name:'单选',color:'#60A5FA'},
  multiple:{name:'多选',color:'#F472B6'},
  judge:{name:'判断',color:'#FBBF24'},
  fill:{name:'填空',color:'#34D399'},
  short:{name:'简答',color:'#A78BFA'}
};
var WRITTEN_QUESTIONS = [
  {id:'wfe1',scene:'fe',lv:1,qtype:'single',q:'关于 CSS 盒模型，下列说法正确的是？',options:[{k:'A',t:'标准盒模型（content-box）的 width 包含 padding 和 border'},{k:'B',t:'IE 盒模型（border-box）的 width 包含 content、padding 和 border'},{k:'C',t:'margin 会影响元素自身的背景色显示范围'},{k:'D',t:'box-sizing 的默认值是 border-box'}],answer:'B',point:'考察 CSS 盒模型与 box-sizing 的理解。',tips:['从 content/padding/border/margin 四层讲起','对比 width 包含范围的差异','提到 box-sizing:border-box 的常见用法'],ans:['标准盒模型（content-box）：width 只包含 content，padding 和 border 会额外撑大元素。','IE 盒模型（border-box）：width 包含 content + padding + border，布局更可控，常全局设置 *{box-sizing:border-box}。','margin 是盒模型最外层，不影响元素自身背景，只影响与其他元素的间距；box-sizing 默认值是 content-box。']},
  {id:'wfe2',scene:'fe',lv:2,qtype:'single',q:'关于 JavaScript 事件循环，下列执行顺序正确的是？',options:[{k:'A',t:'同步代码 → 取一个宏任务 → 清空所有微任务'},{k:'B',t:'同步代码 → 清空所有微任务 → 取一个宏任务 → 再清空微任务'},{k:'C',t:'微任务全部执行完才开始执行同步代码'},{k:'D',t:'setTimeout 的回调属于微任务'}],answer:'B',point:'考察 JS 异步机制，前端高频题。',tips:['先讲调用栈与任务队列','区分宏/微任务及执行顺序','举 setTimeout + Promise 的例子'],ans:['JS 单线程，通过事件循环处理异步：调用栈先执行同步代码，异步任务完成后进入任务队列。','宏任务：setTimeout、setInterval、I/O、UI 渲染；微任务：Promise.then、MutationObserver、queueMicrotask。','顺序：同步代码 → 清空所有微任务 → 取一个宏任务执行 → 再清空微任务，循环往复。']},
  {id:'wfe3',scene:'fe',lv:2,qtype:'short',q:'什么是闭包（closure）？请举一个实际应用场景。',answer:'闭包 = 函数与其词法作用域的组合，外层函数执行完后内部函数仍可访问外层变量。',point:'考察作用域与闭包，前端核心概念。',tips:['定义：函数与其词法作用域的组合','说明能访问外层函数变量','举防抖/节流或模块化例子'],ans:['闭包是函数与其词法作用域的组合，外层函数执行完后，内部函数仍能访问外层变量。','应用：防抖/节流用闭包保存定时器 id；函数柯里化；模块化封装私有变量。','注意：闭包持有外层变量引用，滥用可能导致内存泄漏。']},
  {id:'wfe4',scene:'fe',lv:1,qtype:'short',q:'HTML5 新增了哪些常用语义化标签？为什么要用语义化标签？',answer:'header/nav/main/section/article/aside/footer 等；利于 SEO 与屏幕阅读器理解。',point:'考察 HTML 基础与可访问性意识。',tips:['列举 header/nav/main/section/article/aside/footer','说明对 SEO 和读屏器的好处','对比 div 的无语义问题'],ans:['常用语义化标签：<header>、<nav>、<main>、<section>、<article>、<aside>、<footer>、<figure> 等。','好处：结构清晰利于 SEO；便于读屏器等辅助技术理解页面；代码可读性更好。']},

];

/* Tab 注册表：面试 / 笔试 各自的场景、配色、题目（单一数据源，render 从 activeBank 取） */
var BANK_TABS = {
  iv:{icon:'🎤',name:'面试题库',scenes:SCENES,color:SCENE_COLOR,list:QUESTIONS},
  wr:{icon:'📝',name:'笔试题库',scenes:WRITTEN_SCENES,color:WRITTEN_COLOR,list:WRITTEN_QUESTIONS}
};
function activeBank(){return BANK_TABS[F.type]||BANK_TABS.iv}

var F={type:'iv',scene:'all',lv:0,kw:'',fav:false};

/* 核心 Tab + 场景筛选（随当前 Tab 联动重建：面试→5 大场景，笔试→前端/算法/行测） */
function renderTabs(){
  var box=document.getElementById('bkTabs');
  box.innerHTML=Object.keys(BANK_TABS).map(function(k){
    var t=BANK_TABS[k];
    return '<button type="button" class="bk-tab'+(k===F.type?' on':'')+'" data-k="'+k+'" role="tab">'+t.icon+' '+t.name+'</button>';
  }).join('');
  $$('#bkTabs .bk-tab').forEach(function(b){b.onclick=function(){
    if(b.dataset.k===F.type)return;
    F.type=b.dataset.k;F.scene='all';
    $$('#bkTabs .bk-tab').forEach(function(x){x.classList.toggle('on',x===b)});
    renderScenes();render();
  }});
}
function renderScenes(){
  var bank=activeBank();
  var scF=document.getElementById('scFilter');
  scF.innerHTML='<button class="chip on" data-k="all">全部场景</button>'+Object.keys(bank.scenes).map(function(k){
    return '<button class="chip" data-k="'+k+'"><span style="width:8px;height:8px;border-radius:50%;background:'+bank.color[k]+'"></span>'+bank.scenes[k].name+'</button>'}).join('');
  $$('#scFilter .chip').forEach(function(b){b.onclick=function(){F.scene=b.dataset.k;$$('#scFilter .chip').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
}
renderTabs();renderScenes();

/* 难度筛选 */
var lvF=document.getElementById('lvFilter');
lvF.innerHTML='<span class="fg-lab">难度</span><button class="chip on" data-k="0">全部</button>'+[1,2,3].map(function(l){
  return '<button class="chip" data-k="'+l+'">'+LV_NAME[l]+'</button>'}).join('')+
  '<span class="fg-lab" style="margin-left:10px">收藏</span><button class="chip" id="onlyFav">⭐ 只看收藏</button>';
$$('#lvFilter .chip').forEach(function(b){b.onclick=function(){if(b.id==='onlyFav')return;F.lv=+b.dataset.k;$$('#lvFilter .chip').forEach(function(x){x.classList.toggle('on',x===b||x.id==='onlyFav')});render()}});
document.getElementById('onlyFav').onclick=function(){F.fav=!F.fav;this.classList.toggle('on',F.fav);render()};

var kwTimer=null;
document.getElementById('kw').addEventListener('input',function(){
  var v=this.value.trim();
  clearTimeout(kwTimer);
  kwTimer=setTimeout(function(){F.kw=v;render()},200); /* 200ms debounce，避免每敲一个字就全量重渲染 */
});

/* 支持从 URL 带入搜索词/场景（薄弱点本「去题库搜练」、首页跳转等），自动填充并筛选 */
(function(){
  try{
    var p=new URLSearchParams(location.search);
    var kw=p.get('kw');if(kw){F.kw=kw;document.getElementById('kw').value=kw}
    var sc=p.get('scene');if(sc&&SCENES[sc]){
      F.scene=sc;
      $$('#scFilter .chip').forEach(function(x){x.classList.toggle('on',x.dataset.k===sc)});
    }
  }catch(e){}
})();

function render(){
  var bank=activeBank();
  var isWr=F.type==='wr';
  var favCnt=bank.list.filter(function(q){return isFav(q.id)}).length;
  var list=bank.list.filter(function(q){
    if(F.scene!=='all'&&q.scene!==F.scene)return false;
    if(F.lv&&q.lv!==F.lv)return false;
    if(F.kw&&q.q.toLowerCase().indexOf(F.kw.toLowerCase())<0)return false;
    if(F.fav&&!isFav(q.id))return false;
    return true;
  });
  document.getElementById('cntLine').textContent='共 '+list.length+' 道题 · 已收藏 '+favCnt+' 道';
  if(!list.length){document.getElementById('list').innerHTML='<div class="empty"><span class="e-ic">🔍</span>'+(F.fav?'还没有收藏的题目，点 ⭐ 收藏喜欢的题':'没有匹配的题目，换个关键词或筛选条件试试')+'</div>';return}
  document.getElementById('list').innerHTML=list.map(function(q,i){
    var favIcon=isFav(q.id)?'⭐':'☆';
    var practiceBtn=isWr
      ? '<button class="qi-practice" data-wr="1">看解析 →</button>'
      : '<button class="qi-practice" data-s="'+q.scene+'">练这道 →</button>';
    /* 题型小标签（笔试：单选/多选/判断/填空/简答） */
    var qtTag='';
    if(isWr){var qt=WR_QTYPE[q.qtype]||WR_QTYPE.short;qtTag='<span class="tag qtype-tag" style="background:'+qt.color+'22;color:'+qt.color+';flex:none">'+qt.name+'</span>'}
    /* 收起态内联展示选项（笔试选择题：不展开也能看到 A/B/C/D） */
    var optsHtml='';
    if(isWr&&q.options&&q.options.length){
      var isAns=function(k){return Array.isArray(q.answer)?q.answer.indexOf(k)>=0:q.answer===k};
      optsHtml='<div class="qi-opts">'+q.options.map(function(o){
        return '<div class="opt'+(isAns(o.k)?' is-ans':'')+'" data-k="'+o.k+'"><span class="opt-k">'+o.k+'</span><span class="opt-t">'+esc(o.t)+'</span></div>';
      }).join('')+'</div>';
    }
    /* 展开区：笔试用「正确答案 + 解析」语义；面试保持「考察点/技巧/参考要点」 */
    var bodyHtml;
    if(isWr){
      var ansKey=Array.isArray(q.answer)?q.answer.join('、'):q.answer;
      bodyHtml='<div class="wr-ans"><span class="wr-ans-lab">✅ 正确答案</span><span class="wr-ans-key">'+esc(ansKey)+'</span></div>'+
        '<h5>💡 解析</h5>'+
        '<div class="wr-point">'+esc(q.point)+'</div>'+
        (q.tips&&q.tips.length?'<ul class="tip">'+q.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>':'')+
        (q.ans&&q.ans.length?'<div class="ans-box">'+q.ans.map(function(a){return '<p>'+esc(a)+'</p>'}).join('')+'</div>':'');
    }else{
      bodyHtml='<h5>🎯 考察点</h5><div style="font-size:13px;color:var(--ink2);line-height:1.7">'+esc(q.point)+'</div>'+
        '<h5>💡 作答技巧</h5><ul class="tip">'+q.tips.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>'+
        '<h5>✅ 参考要点</h5><ul class="ans">'+q.ans.map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ul>';
    }
    return '<div class="q-item" data-id="'+q.id+'">'+
      '<div class="qi-h">'+
        '<span class="qtype-ic" title="'+(isWr?'笔试题':'面试题')+'">'+bank.icon+'</span>'+
        '<span class="tag" style="background:'+bank.color[q.scene]+'22;color:'+bank.color[q.scene]+';flex:none">'+bank.scenes[q.scene].name+'</span>'+
        qtTag+
        '<span class="qt">'+esc(q.q)+'</span>'+
        '<button class="qi-fav txA" data-id="'+q.id+'" title="收藏/取消" style="font-size:16px;padding:6px 8px;border-radius:8px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);cursor:pointer">'+favIcon+'</button>'+
        '<span class="tag txB2" style="background:rgba(108,140,255,.13);flex:none">'+LV_NAME[q.lv]+'</span>'+
        practiceBtn+
        '<span class="chev">'+ICONS.chev+'</span>'+
      '</div>'+
      optsHtml+
      '<div class="qi-b">'+bodyHtml+'</div></div>';
  }).join('');
  $$('#list .qi-h').forEach(function(h){h.addEventListener('click',function(e){
    if(e.target.classList.contains('qi-practice')||e.target.classList.contains('qi-fav'))return;
    h.parentNode.classList.toggle('open')})});
  /* 点击选项不触发展开（仅阅读题干与选项）；看解析/收藏属于功能，游客需先登录 */
  $$('#list .qi-opts').forEach(function(o){o.addEventListener('click',function(e){e.stopPropagation()})});
  $$('#list .qi-practice').forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    if(b.dataset.wr){b.closest('.q-item').classList.toggle('open');return}   /* 笔试：直接展开解析 */
    if(!canUseFeature())return;location.href='interview.html?scene='+b.dataset.s
  }});
  $$('#list .qi-fav').forEach(function(b){b.onclick=function(e){e.stopPropagation();if(!canUseFeature())return;toggleFav(b.dataset.id);render()}});
}
render();
</script>
