<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 · 模拟面试训练营 Pro</title>
<style>
:root{
  --bg:#f3f5fa; --panel:#ffffff; --panel2:#f8fafc;
  --ink:#16203a; --ink2:#5c6b87; --ink3:#93a1b8;
  --line:#e6eaf2; --brand:#3b5bdb; --brand2:#5c7cfa;
  --ok:#10b981; --warn:#f59e0b; --dan:#ef4444; --gold:#f59e0b;
  --side:#131b30; --side2:#1b2540;
  --shell-max:1280px;
  --top-h:58px;
  --side-w:clamp(180px,16vw,212px);
  --fs-3xs:clamp(9px,calc(2px + .6vw),10.5px);
  --fs-2xs:clamp(10px,calc(2px + .7vw),11.5px);
  --fs-xs:clamp(11px,calc(1px + .85vw),12.5px);
  --fs-sm:clamp(12px,calc(2px + .85vw),14px);
  --fs-base:clamp(13px,calc(3px + .85vw),16px);
  --fs-md:clamp(13.5px,calc(2.5px + .85vw),16px);
  --fs-lg:clamp(15px,calc(3px + .85vw),17.5px);
  --fs-xl:clamp(17px,calc(3.5px + .85vw),19px);
  --fs-2xl:clamp(19px,calc(4px + 1vw),24px);
  --g-media:clamp(200px,22vw,280px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:var(--fs-base);line-height:1.6;
  font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

.ad-top{height:var(--top-h);background:var(--side);color:#fff;display:flex;align-items:center;gap:14px;
  padding:0 18px;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(19,27,48,.18)}
.ad-top .lg{display:flex;align-items:center;gap:9px;font-weight:800;font-size:var(--fs-lg);letter-spacing:.3px}
.ad-top .lg .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:var(--fs-lg);
  background:linear-gradient(135deg,#3b5bdb,#22d3ee);box-shadow:0 4px 12px rgba(59,91,219,.4)}
.ad-top .lg .ic svg{width:17px;height:17px}
.ad-top .tag{font-size:var(--fs-2xs);padding:2px 8px;border-radius:99px;background:rgba(245,158,11,.18);
  color:#fcd34d;border:1px solid rgba(245,158,11,.35);font-weight:700;letter-spacing:.5px}
.ad-top .sp{flex:1}
.ad-top .who{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:#c7d2fe}
.ad-top .who b{color:#fff}
.src-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:20px;
  font-size:var(--fs-xs);font-weight:600;cursor:help;transition:.2s}
.src-badge .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.src-badge.src-server{background:rgba(45,212,191,.16);color:#5eead4;border:1px solid rgba(45,212,191,.4)}
.src-badge.src-server .dot{background:#34d399;box-shadow:0 0 6px #34d399}
.src-badge.src-local{background:rgba(251,191,36,.14);color:#fcd34d;border:1px solid rgba(251,191,36,.35)}
.src-badge.src-local .dot{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
.ad-tbtn{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#dbe4ff;
  padding:6px 12px;border-radius:9px;font-size:var(--fs-sm);transition:.18s}
.ad-tbtn:hover{background:rgba(255,255,255,.18);color:#fff}

.ad-body{display:flex;min-height:calc(100vh - var(--top-h))}
.ad-side{width:var(--side-w);flex:none;background:var(--side);padding:14px 10px;
  position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));overflow-y:auto}
.ad-side .grp{font-size:var(--fs-2xs);color:#64748b;letter-spacing:1.2px;padding:12px 12px 6px;font-weight:700}
.ad-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;
  color:#a9b6d0;padding:10px 12px;border-radius:10px;font-size:var(--fs-base);margin-bottom:3px;transition:.16s}
.ad-item:hover{background:rgba(255,255,255,.07);color:#fff}
.ad-item.on{background:linear-gradient(135deg,rgba(59,91,219,.5),rgba(34,211,238,.24));color:#fff;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ad-item .cnt{margin-left:auto;font-size:var(--fs-2xs);min-width:19px;height:19px;padding:0 6px;border-radius:99px;
  background:#ef4444;color:#fff;display:grid;place-items:center;font-weight:700}
.ad-main{flex:1;min-width:0;padding:clamp(14px,2.4vw,22px) clamp(12px,2.6vw,26px) clamp(40px,6vw,60px)}

.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.hd h1{font-size:var(--fs-xl);font-weight:800;margin:0}
.hd .sub{font-size:var(--fs-xs);color:var(--ink3)}
.hd .sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,1.4vw,18px);
  box-shadow:0 2px 10px rgba(19,27,48,.05);min-width:0}
.card+.card{margin-top:16px}
.card .ct{font-size:var(--fs-base);font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .ct .sp{flex:1}
/* KPI 固定列数 */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpis>*{min-width:0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;
  box-shadow:0 2px 10px rgba(19,27,48,.05);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(59,91,219,.14),transparent 70%)}
.kpi .l{font-size:var(--fs-xs);color:var(--ink3);display:flex;align-items:center;gap:5px}
.kpi .v{font-size:var(--fs-2xl);font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .x{font-size:var(--fs-2xs);color:var(--ink3);margin-top:2px}
.kpi.a .v{color:var(--brand)} .kpi.b .v{color:var(--ok)} .kpi.c .v{color:var(--warn)}
.kpi.d .v{color:var(--dan)} .kpi.e .v{color:#7c3aed}

.ad-in{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 11px;
  font-size:var(--fs-base);color:var(--ink);outline:none;font-family:inherit;transition:.16s}
.ad-in:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(92,124,250,.16)}
select.ad-in{padding-right:8px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;
  padding:8px 14px;font-size:var(--fs-sm);font-weight:700;transition:.16s}
.btn:hover{border-color:var(--brand2);color:var(--brand)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;
  box-shadow:0 4px 12px rgba(59,91,219,.25)}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ok{background:var(--ok);border-color:transparent;color:#fff}
.btn.ok:hover{filter:brightness(1.06);color:#fff}
.btn.dan{background:#fff;border-color:rgba(239,68,68,.4);color:var(--dan)}
.btn.dan:hover{background:var(--dan);color:#fff}
.btn.sm{padding:5px 10px;font-size:var(--fs-xs);border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tb-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.tb{width:100%;border-collapse:collapse;font-size:var(--fs-sm);min-width:clamp(660px,52vw,760px)}
table.tb th{background:var(--panel2);color:var(--ink2);font-weight:700;text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:var(--fs-xs)}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb tbody tr:hover{background:#f8faff}
.tb-date{white-space:nowrap}
.tb-acts{text-align:right;white-space:nowrap}
.tb-ai{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink3)}
.ucell{display:flex;align-items:center;gap:8px;min-width:clamp(96px,10vw,120px)}
.ucell .av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;
  background:linear-gradient(135deg,#eef2ff,#e0f2fe);flex:none}
.ucell .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucell .ac{font-size:var(--fs-2xs);color:var(--ink3)}
.bd{display:inline-block;padding:2px 8px;border-radius:99px;font-size:var(--fs-2xs);font-weight:700;white-space:nowrap}
.bd.ok{background:rgba(16,185,129,.13);color:#047857}
.bd.pend{background:rgba(245,158,11,.15);color:#b45309}
.bd.no{background:rgba(239,68,68,.12);color:#b91c1c}
.bd.gray{background:#eef1f6;color:var(--ink2)}
.bd.blue{background:rgba(59,91,219,.12);color:#3348a8}
.stars{color:var(--gold);letter-spacing:1px;font-size:var(--fs-xs);white-space:nowrap}
.empty{text-align:center;padding:44px 10px;color:var(--ink3);font-size:var(--fs-base)}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.75}

.bars{display:flex;align-items:flex-end;gap:10px;height:132px;padding:6px 2px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .b .bar{width:100%;max-width:38px;border-radius:6px 6px 3px 3px;min-height:3px;
  background:linear-gradient(180deg,#5c7cfa,#3b5bdb);transition:.3s}
.bars .b .n{font-size:var(--fs-2xs);font-weight:800;color:var(--ink)}
.bars .b .d{font-size:var(--fs-2xs);color:var(--ink3)}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--g-media),1fr));gap:14px}
.vc{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  box-shadow:0 2px 10px rgba(19,27,48,.05);display:flex;flex-direction:column}
.vc .th{height:96px;display:grid;place-items:center;font-size:28px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#dbeafe,#e0e7ff)}
.vc .th .vthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vc .th .pl{position:relative;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(15,23,42,.55);color:#fff;font-size:14px;pointer-events:none;
  box-shadow:0 2px 8px rgba(15,23,42,.35)}
.vc .th:hover .pl{background:rgba(59,91,219,.8)}
.vc .th .dur{position:absolute;right:8px;bottom:8px;background:rgba(15,23,42,.75);color:#fff;z-index:2;
  font-size:var(--fs-2xs);padding:2px 7px;border-radius:6px;font-weight:700}
.vc .bd2{padding:11px 12px;flex:1;display:flex;flex-direction:column;gap:6px}
.vc .ti{font-weight:800;font-size:var(--fs-base);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.vc .mt{font-size:var(--fs-xs);color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vc .rs{font-size:var(--fs-2xs);color:#b91c1c;background:rgba(239,68,68,.08);border-radius:7px;padding:4px 8px}
.vc .ac{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2)}
.vc .ac .btn{flex:1 1 0;min-width:0;text-align:center;padding:5px 6px;font-size:var(--fs-xs)}

.ad-mask{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:22px}
.ad-mask .box{background:var(--panel);border-radius:16px;width:min(560px,94vw);max-height:88vh;overflow-y:auto;
  padding:clamp(15px,2vw,22px) clamp(15px,2vw,22px);box-shadow:0 24px 60px rgba(15,23,42,.28);position:relative}
.ad-mask .mclose{position:absolute;top:10px;right:10px;z-index:3;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font-size:14px;cursor:pointer;
  display:grid;place-items:center;line-height:1;transition:.15s}
.ad-mask .mclose:hover{background:#ef4444;border-color:#ef4444;color:#fff}
.ad-mask h3{margin:0 0 4px;font-size:var(--fs-lg);font-weight:800;display:flex;align-items:center;gap:8px}
.ad-mask .ms{font-size:var(--fs-xs);color:var(--ink3);margin-bottom:14px}
.ad-mask .ft{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}
.kv{display:grid;grid-template-columns:clamp(76px,8vw,96px) 1fr;gap:7px 12px;font-size:var(--fs-sm);margin-bottom:14px}
.kv .k{color:var(--ink3)}
.kv .v{font-weight:600}
.mini-tb{width:100%;border-collapse:collapse;font-size:var(--fs-xs)}
.mini-tb th{text-align:left;color:var(--ink3);font-size:var(--fs-2xs);padding:6px 8px;border-bottom:1px solid var(--line)}
.mini-tb td{padding:6px 8px;border-bottom:1px solid var(--line)}
.mini-tb tr:last-child td{border-bottom:0}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1000px 520px at 50% -10%,#1e2a4d,#0f1628 60%)}
.gate .box{width:min(400px,94vw);background:var(--panel);border-radius:18px;padding:clamp(20px,3vw,28px) clamp(18px,3vw,26px);
  box-shadow:0 26px 60px rgba(2,6,23,.45)}
.gate .ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:var(--fs-2xl);margin:0 auto 12px;
  background:linear-gradient(135deg,#3b5bdb,#22d3ee);box-shadow:0 8px 22px rgba(59,91,219,.35)}
.gate h2{margin:0 0 4px;font-size:var(--fs-xl);text-align:center;font-weight:800}
.gate .ds{font-size:var(--fs-xs);color:var(--ink3);text-align:center;margin-bottom:18px}
.gate .f{margin-bottom:11px}
.gate .lab{font-size:var(--fs-xs);color:var(--ink2);margin-bottom:5px;font-weight:600}
.gate .ad-in{width:100%}
.gate .err{color:var(--dan);font-size:var(--fs-xs);min-height:16px;margin:2px 0 8px}
.gate .back{display:block;text-align:center;margin-top:18px;font-size:var(--fs-xs);color:var(--brand)}

/* toast：后台自己的浅色风格 */
.toast-box{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(19,27,48,.94);color:#fff;font-size:var(--fs-sm);padding:9px 16px;border-radius:11px;
  box-shadow:0 10px 26px rgba(15,23,42,.28);transition:.25s;max-width:80vw}
.toast.ok{background:rgba(16,185,129,.96)}
.toast.warn{background:rgba(245,158,11,.96)}
.toast.err{background:rgba(239,68,68,.96)}

.foot-note{font-size:var(--fs-xs);color:var(--ink3);margin-top:18px;line-height:1.9}

/* 前后台数据关联提示条 */
.link-banner{font-size:var(--fs-sm);line-height:1.7;color:#cfe3ff;background:rgba(59,130,246,.16);
  border:1px solid rgba(96,165,250,.4);border-radius:12px;padding:11px 14px;margin-bottom:14px}
.link-banner b{color:#fff}
/* 当前前台用户所在行高亮 */
.row-me{background:rgba(59,130,246,.10)}
.row-me td:first-child{border-left:3px solid #60a5fa}
@media (max-width:1024px){
  :root{--side-w:64px}
  .ad-side{padding:10px 6px}
  .ad-side .grp{display:none}
  .ad-item{justify-content:center;padding:10px 4px;font-size:0;position:relative}
  .ad-item .ic{font-size:var(--fs-lg)}
  .ad-item .cnt{position:absolute;margin-left:34px;margin-top:-14px}
  .ad-main{padding:16px 14px 50px}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:768px){
  .ad-top{gap:8px;padding:0 12px}
  .ad-top .tag,.ad-top .who{display:none}
  .hd{gap:8px;margin-bottom:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 13px}
  .ad-mask{padding:14px}
  .ad-mask .ft{flex-wrap:wrap}
  .ad-mask .ft .btn{flex:1 1 0}
  
  table.tb{min-width:540px;font-size:var(--fs-xs)}
  table.tb th,table.tb td{padding:9px 8px}
  table.tb td{word-break:break-word}
  .ucell{min-width:0}
  .ucell .nm{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.4}
  .tb-ai{max-width:150px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
  .tb-acts .btn.sm{padding:4px 8px}
}
@media (max-width:480px){
  /* 品牌收成图标 */
  .ad-top .lg{font-size:0;gap:0}
  .ad-top .lg .ic{width:28px;height:28px}
  .ad-tbtn{padding:6px 9px;font-size:var(--fs-xs);white-space:nowrap}
  .card{padding:12px}
  .bars{height:104px;gap:6px}
  .ad-mask .box{padding:14px}
  .gate{padding:16px}
}
@media (pointer:coarse){
  .ad-item,.ad-tbtn,.btn,.ad-in,select.ad-in{min-height:44px}
  .btn.sm{min-height:44px}
  .src-badge{min-height:32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ===== 门禁：未登录管理员 ===== -->
<div class="gate" id="gate" style="display:none">
  <div class="box">
    <div class="ic">🛡️</div>
    <h2>管理后台</h2>
    <div class="ds">模拟面试训练营 Pro · 运营管理控制台</div>
    <div class="f"><div class="lab">管理员账号</div><input class="ad-in" id="gAcc" placeholder="请输入管理员账号" autocomplete="username" aria-label="管理员账号"></div>
    <div class="f"><div class="lab">管理员密码</div><input class="ad-in" id="gPwd" type="password" placeholder="请输入密码" autocomplete="current-password" aria-label="管理员密码"></div>
    <div class="f" id="gPwd2F" style="display:none"><div class="lab">确认密码（首次初始化）</div><input class="ad-in" id="gPwd2" type="password" placeholder="再次输入密码" autocomplete="new-password" aria-label="确认密码"></div>
    <div class="err" id="gErr"></div>
    <button class="btn pri" id="gOk" style="width:100%">登 录 后 台</button>
    <a class="back" href="index.html">← 返回用户前台</a>
  </div>
</div>

<!-- ===== 后台主体 ===== -->
<div id="app" style="display:none">
  <header class="ad-top">
    <div class="lg">
      <span class="ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
        </svg>
      </span>
      模拟面试训练营 Pro <span class="tag">管理后台</span>
    </div>
    <div class="sp"></div>
    <div class="who">👑 <b id="topWho">管理员</b> · 数据源：<span id="topSrc">本机浏览器</span></div>
    <button class="ad-tbtn" id="topOut">退出管理员</button>
  </header>
  <div class="ad-body">
    <aside class="ad-side">
      <div class="grp">数 据</div>
      <button class="ad-item" data-go="dash"><span class="ic">📊</span>概览</button>
      <button class="ad-item" data-go="online"><span class="ic">🟢</span>实时在线<span class="cnt" id="sideOnline" style="background:#10b981"></span></button>
      <button class="ad-item" data-go="users"><span class="ic">👥</span>用户管理</button>
      <button class="ad-item" data-go="sessions"><span class="ic">🎤</span>面试数据</button>
      <div class="grp">运 营</div>
      <button class="ad-item" data-go="videos"><span class="ic">🎬</span>视频审核<span class="cnt" id="sideCnt"></span></button>
      <button class="ad-item" data-go="feedback"><span class="ic">📮</span>用户反馈<span class="cnt" id="sideFb" style="background:#f59e0b"></span></button>

/* 加载后台数据集 */
async function adminLoad(){
  var r=await apiCall('/api/admin/db',{token:adminToken(),silent:true});
  if(r&&r.data&&r.data.ok){
    var users=r.data.users||[];
    var sessions=[],videos=[];
    users.forEach(function(u){(u.sessions||[]).forEach(function(s){sessions.push({u:u,s:s})});(u.videos||[]).forEach(function(v){videos.push({u:u,v:v})})});
    /* 用户反馈：独立拉取，失败不阻塞主数据 */
    var fb=[];
    try{
      var fr=await apiCall('/api/admin/feedback',{token:adminToken(),silent:true});
      if(fr&&fr.data&&fr.data.ok)fb=fr.data.feedback||[];
    }catch(e){}
    return {src:'server',users:users,stats:r.data.stats,day7:r.data.day7,logs:r.data.logs,sessions:sessions,videos:videos,feedback:fb};
  }
  throw {loadFail:true,msg:(r&&r.data&&r.data.msg)||'服务器返回异常'};
}

}
/* 管理动作 */
async function adminAct(method,path,body,fallback){
  try{
    var r=await apiCall(path,{method:method,body:body,token:adminToken()});
    if(r.ok){render();return true;}
  }catch(e){
    /* 网络错误才回落本地 */
    if(e&&e.networkError&&fallback){fallback();render();}
  }
  return false;
}

function pad(n){return n<10?'0'+n:''+n}
function dt(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function dts(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()}
function day(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dur(s){s=Math.round(s||0);var m=Math.floor(s/60);return m+':'+(s%60<10?'0':'')+(s%60)}
function ago(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return '刚刚';
  if(s<3600)return Math.floor(s/60)+' 分钟前';
  if(s<86400)return Math.floor(s/3600)+' 小时前';
  if(s<86400*30)return Math.floor(s/86400)+' 天前';
  return day(ts);
}
function stars(n){
  n=Math.round(n||0);var s='';
  for(var i=0;i<5;i++)s+=i<n?'★':'☆';
  return '<span class="stars">'+s+' '+(n||0)+'</span>';
}
function stBadge(st){
  if(st==='approved')return '<span class="bd ok">已通过</span>';

  if(st==='private')return '<span class="bd gray">仅自己可见</span>';
  return '<span class="bd gray">'+(st||'—')+'</span>';
}

function onlineListHtml(on,list){
  var n=document.getElementById('onlineN'); if(n)n.textContent=on||0;
  if(!list||!list.length)return '<div class="empty"><span class="big">🌙</span>当前没有在线用户（60 秒内心跳才会显示）</div>';
  var now=Date.now();
  return '<div class="vgrid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">'+list.map(function(u){
    var dur=Math.floor((now-(u.onlineAt||now))/1000);
    var dm = dur<60 ? (dur+' 秒') : (Math.floor(dur/60)+' 分 '+(dur%60)+' 秒');
    var st = u.status==='banned'
      ? '<span class="bd no">已封禁</span>'
      : '<span class="bd ok" style="background:rgba(16,185,129,.13);color:#047857">🟢 在线</span>';
    return '<div class="vc" style="flex-direction:row;align-items:center;gap:12px;padding:12px">'+
      '<div class="av" style="width:42px;height:42px;font-size:20px;border-radius:12px;background:linear-gradient(135deg,#eef2ff,#e0f2fe);display:grid;place-items:center;flex:none">'+(u.avatar||'🙂')+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+esc(u.name)+' '+st+'</div>'+
        '<div style="font-size:11.5px;color:var(--ink3)">@'+esc(u.account)+'</div>'+
        '<div style="font-size:12px;margin-top:4px;color:var(--ink2)">📍 正在浏览：<b>'+pageName(u.page)+'</b> · 已在线 '+dm+'</div>'+
        '<div style="font-size:11.5px;margin-top:3px;color:var(--ink3)">面试 '+u.sessions+' 场 · 视频 '+u.videos+' 个 · 收藏 '+u.favs+' 题</div>'+
      '</div></div>';
  }).join('')+'</div>';
}
function viewOnline(){
  clearOnlineTimer();
  async function load(){
    var box=document.getElementById('onlineBody'); if(!box)return;
    var on=0,list=[];
    try{
      var r=await apiCall('/api/admin/online',{token:adminToken(),silent:true});
      if(r.data&&r.data.ok){on=r.data.count;list=r.data.online||[];}
    }catch(e){}
    box.innerHTML=onlineListHtml(on,list);
    var c=document.getElementById('sideOnline'); if(c){c.textContent=on||'';c.style.display=on?'grid':'none';}
  }
  var h='<div class="hd"><h1>🟢 实时在线</h1><div class="sub">当前已登录且活跃的用户（60 秒内心跳视为在线，每 5 秒自动刷新）</div><div class="sp"></div>'+
    '<span class="src-badge src-server" style="background:rgba(16,185,129,.14);color:#047857;border-color:rgba(16,185,129,.4)"><span class="dot" style="background:#10b981;box-shadow:0 0 6px #10b981"></span><b id="onlineN">0</b> 人在线</span>'+
    '<button class="btn sm" id="onRf" style="margin-left:10px">🔄 刷新</button></div>';
  h+='<div class="card"><div class="ct">🟢 当前在线用户 <span class="sp"></span>'+
     '<span style="font-size:12px;color:var(--ink3)">数据实时来自服务器数据库</span></div>'+
     '<div id="onlineBody"><div class="empty"><span class="big">⏳</span>加载中…</div></div></div>';
    setTimeout(function(){
    load();
    if(onlineTimer)clearInterval(onlineTimer);
    onlineTimer=setInterval(load,5000);
    var rf=document.getElementById('onRf'); if(rf)rf.onclick=function(){load()};
  },0);
  return h;
}

async function render(){
  var t=TAB;
  clearOnlineTimer();
  try{
    DATA=await adminLoad();
  }catch(e){
    return renderLoadFail(e);
  }
  $m.innerHTML = t==='dash'?viewDash() : t==='online'?viewOnline() :
                 t==='users'?viewUsers() : t==='sessions'?viewSessions() :
                 t==='videos'?viewVideos() : t==='feedback'?viewFeedback() :
                 t==='logs'?viewLogs() : viewSettings();
  /* 侧栏高亮 + 待审 / 在线数量 */
  document.querySelectorAll('.ad-item').forEach(function(b){
    b.classList.toggle('on',b.dataset.go===t);
  });
  var pc=DATA.stats.pend;
  var sc=document.getElementById('sideCnt');
  if(sc){sc.textContent=pc||'';sc.style.display=pc?'grid':'none';}
  var oc=document.getElementById('sideOnline');
  if(oc){var on=DATA.stats.online||0;oc.textContent=on||'';oc.style.display=on?'grid':'none';}
  var fc=document.getElementById('sideFb');
  if(fc){var und=(DATA.feedback||[]).filter(function(f){return !f.done}).length;fc.textContent=und||'';fc.style.display=und?'grid':'none';}
  var srcEl=document.getElementById('topSrc');
  if(srcEl){
    var isSrv=DATA.src==='server';
    srcEl.className='src-badge '+(isSrv?'src-server':'src-local');
    srcEl.innerHTML=(isSrv?'<span class="dot"></span>服务器数据库':'<span class="dot"></span>本机浏览器');
    srcEl.title=isSrv?'数据来自服务器 MySQL 数据库':'后端不可达，当前使用浏览器本地缓存';
  }
  bind();
  window.scrollTo(0,0);
}
function bind(){
  var rf=document.getElementById('rf');if(rf)rf.onclick=function(){render();toast('已刷新','ok')};
  var gv=document.getElementById('goV');if(gv)gv.onclick=function(){TAB='videos';VF='pending';render()};
  var ku=document.getElementById('kwU');
  if(ku){ku.oninput=function(){KW.u=ku.value;var p=ku.selectionStart;render();
    var n=document.getElementById('kwU');if(n){n.focus();n.setSelectionRange(p,p)}}}
  var ks=document.getElementById('kwS');
  if(ks){ks.oninput=function(){KW.s=ks.value;SESS_SHOW=SESS_PAGE;var p=ks.selectionStart;render();
    var n=document.getElementById('kwS');if(n){n.focus();n.setSelectionRange(p,p)}}}
  var moreS=document.getElementById('moreS');

    var y=window.scrollY;SESS_SHOW+=SESS_PAGE;

    toast('日志已清空','ok');
  };
  var ex=document.getElementById('expBtn');
  if(ex)ex.onclick=function(){
    var blob=new Blob([JSON.stringify({src:DATA.src,users:DATA.users,logs:DATA.logs},null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='admin-data-'+day(Date.now())+'.json';a.click();
    toast('已导出 JSON','ok');
  };
  var rs=document.getElementById('rstBtn');
  if(rs)rs.onclick=async function(){
    if(!confirm('重置为内置示例数据？当前后台记录会被覆盖。'))return;
    await adminAct('POST','/api/admin/reset',null,function(){AdminDB.reset()});
    toast('已重置为示例数据','ok');
  };
}

function showGate(){
  document.getElementById('gate').style.display='flex';
  var ga=document.getElementById('gAcc'),gp=document.getElementById('gPwd'),
      ge=document.getElementById('gErr'),go=document.getElementById('gOk');
  async function sub(){
    var acc=(ga.value||'').trim(), pw=gp.value||'';
    if(!acc){ge.textContent='请输入管理员账号';return;}
    /* 后端优先 */
    withLoading(go,function(){
      return apiCall('/api/admin/login',{method:'POST',silent:true,body:{account:acc,password:pw}})
        .then(function(r){
          if(r.data&&r.data.ok){setAdminToken(r.data.token||'');ge.textContent='';showApp();}
        })
        .catch(function(err){
          /* 后端明确拒绝 */
          if(err&&err.bizError){
            ge.textContent=err.msg||'登录失败';
            gp.value='';gp.focus();
            return;
          }
          /* 真正的网络故障才走本机兜底 */
          gateLocal(acc,pw);
        });
    });
  }
  var initMode=false,gp2=document.getElementById('gPwd2');
  function gateLocal(acc,pw){
    var l=adminLogin(acc,pw);
    /* 本机从未设置管理员 */
    if(!l.ok&&l.needInit&&!initMode){
      initMode=true;
      document.getElementById('gPwd2F').style.display='block';
      go.textContent='初始化并登录';
      ge.textContent='本机尚未初始化管理员账号：请直接设置账号与密码，仅保存在本机浏览器。';
      return;
    }
    if(!l.ok&&l.needInit&&initMode){
      var pw2=gp2.value||'';
      if(acc.length<3){ge.textContent='账号至少 3 位';return;}
      if(pw.length<6){ge.textContent='密码至少 6 位';return;}
      if(pw!==pw2){ge.textContent='两次输入的密码不一致';gp2.value='';gp2.focus();return;}
      setAdminProfile(acc,pw);
      var l2=adminLogin(acc,pw);
      if(!l2.ok){ge.textContent=l2.msg||'初始化失败';return;}
      ge.textContent='';showApp();return;
    }
    if(!l.ok){ge.textContent=l.msg||'登录失败';gp.value='';gp.focus();return;}
    ge.textContent='';showApp();
  }
  go.onclick=sub;
  [ga,gp,gp2].forEach(function(el){el.addEventListener('keydown',function(e){if(e.key==='Enter')sub()})});
  setTimeout(function(){ga.focus()},150);
}
function showApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  /* 支持 #videos / # */
  var h=(location.hash||'').replace('#','');
  if(['dash','users','sessions','videos','feedback','logs','settings'].indexOf(h)>=0)TAB=h;
  if(h==='videos')VF='pending';
  document.getElementById('topWho').textContent=(getAdminProfile()||{}).name||'管理员';
  document.getElementById('topOut').onclick=function(){
    setAdminToken(null);adminLogout();toast('已退出管理员','ok');
    setTimeout(function(){location.href='index.html'},420);
  };
  document.querySelectorAll('.ad-item').forEach(function(b){
    b.onclick=function(){TAB=b.dataset.go;render()};
  });
  document.getElementById('mask').onclick=function(e){if(e.target===this)closeM()};
  render();
  /* 概览：每分钟自动刷新一次 */
  setInterval(function(){if(TAB==='dash')render()},60000);
}
async function boot(){
  /* 必须持有有效的服务器管理员 */
  var tk=adminToken(), authed=false;
  if(tk){
    try{
      var r=await apiCall('/api/admin/db',{token:tk,silent:true});
      if(r.data&&r.data.ok)authed=true;
    }catch(e){}
  }
  if(!authed){setAdminToken(null);showGate();return;}
  showApp();
}
boot();
</script>
