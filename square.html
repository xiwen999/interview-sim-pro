<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>观摩大厅 · 模拟面试训练营 Pro</title>
<link rel="stylesheet" href="shared.css?v=20261101b">
<style>
body{background:
  radial-gradient(ellipse 70% 45% at 30% -5%,rgba(244,114,182,.1),transparent),
  radial-gradient(ellipse 55% 40% at 75% 15%,rgba(251,191,36,.07),transparent),
  radial-gradient(ellipse 45% 35% at 50% 95%,rgba(138,189,255,.05),transparent),
  #0a1020}
.fp-wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at 25% 30%,rgba(244,114,182,.05) 0 2px,transparent 2px),
    radial-gradient(circle at 75% 45%,rgba(251,191,36,.04) 0 1.5px,transparent 1.5px),
    radial-gradient(circle at 50% 75%,rgba(138,189,255,.04) 0 1px,transparent 1px);
  background-size:200px 200px,180px 180px,240px 240px;opacity:.5}
.fp-shell{position:relative;overflow:hidden}
/* 壳内动态星光层：与首页/个人中心同一套 seedStars 三层视差上飘星空 */
.fx-stars{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fp-shell::after{content:"🎬";position:absolute;right:-25px;top:-35px;font-size:190px;opacity:.028;
  transform:rotate(-12deg);pointer-events:none;filter:grayscale(.2)}
@media (max-width:1024px){.fp-shell::after{font-size:130px;right:-15px;top:-25px}}
/* 浅色模式适配 */
body.light{background:linear-gradient(180deg,#ffffff 0%,#fcfdff 38%,#f5f8ff 100%)}
body.light .fp-wrap::before{opacity:.22}
body.light .fp-shell::after{opacity:.018}
/* 统计行 */
.sq-stats{display:flex;gap:clamp(16px,2.2vw,26px);margin:2px 0 0 clamp(0px,1.4vw,18px);flex:none;flex-wrap:wrap}
.sq-stat .n{font-size:var(--fs-2xl);font-weight:900;color:var(--ink)}
.sq-stat .l{font-size:var(--fs-xs);color:var(--ink3);margin-top:2px}
@media (max-width:768px){.sq-stats{margin:12px 0 0}}

/* 场景筛选：对齐设置页选项 */
.sq-filter{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.sq-chip{padding:10px 16px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-size:var(--fs-base);font-weight:600;color:var(--ink2);cursor:pointer;transition:.18s;
  box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)}
.sq-chip:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.sq-chip.on{border-color:var(--acc);color:var(--ink);background:rgba(108,140,255,.14);
  box-shadow:0 0 0 3px rgba(108,140,255,.14),0 10px 24px rgba(108,140,255,.22)}

/* 视频网格 */
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--g-wide),1fr));gap:16px}
.vcard{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s;cursor:pointer}
.vcard:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.vthumb{height:140px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,rgba(30,40,80,.9),rgba(38,32,72,.85));position:relative}
.vthumb .vplay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,13,29,.35);opacity:0;transition:.2s}
.vcard:hover .vplay{opacity:1}
.vthumb .vplay span{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#4f6ef0,#6C8CFF);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 8px 24px rgba(79,110,240,.5)}
.vbody{padding:12px 14px}
.vtitle{font-size:var(--fs-base);font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--fs-xs);color:var(--ink3);flex-wrap:wrap}
.vowner{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.vempty{text-align:center;padding:clamp(44px,7vw,70px) 20px;color:var(--ink3);font-size:var(--fs-base)}
.vempty .big{font-size:48px;margin-bottom:12px}
@media (pointer:coarse){.sq-chip{min-height:44px;display:inline-flex;align-items:center}.vcard{min-height:44px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="fp-wrap">
  <div class="fp-shell rise">
    <div class="fx-stars" aria-hidden="true"><div id="sqStars1"></div><div id="sqStars2"></div><div id="sqStars3"></div></div>
    <div class="fp-head">
      <div class="fp-ic">🌐</div>
      <div>
        <h1>观摩大厅</h1>
        <p class="fp-sub">这里展示所有通过审核的模拟面试视频，看看别人怎么答，取长补短。</p>
      </div>
      <div class="fp-acts"><button class="btn pri sm" id="goUp">⬆️ 去个人中心上传</button></div>
    </div>
    <div class="fp-tip">
      <span class="fp-tip-ic">💡</span>
      <div style="flex:1">
        <div class="fp-tip-t">围观也是练习</div>
        <div class="fp-tip-d">先看一遍别人怎么答，再遮住要点自己复述一遍——模仿是结构化表达最快的入门方式。</div>
      </div>
      <div class="sq-stats">
        <div class="sq-stat"><div class="n" id="stTotal">0</div><div class="l">公开视频</div></div>
        <div class="sq-stat"><div class="n" id="stUser">0</div><div class="l">分享者</div></div>
        <div class="sq-stat"><div class="n" id="stMine">0</div><div class="l">我的作品</div></div>
      </div>
    </div>

    <div class="sq-filter" id="scFilter"></div>
    <div id="list"></div>
  </div>
</div>

<script src="shared.js?v=20261101b"></script>
<script>
if(!initPage('square',true))throw new Error('login required');
/* 壳内动态星空（700×1px/60s、200×2px/120s、100×3px/180s 视差上飘，与首页一致） */
seedStars('sqStars1',700,1,60);seedStars('sqStars2',200,2,120);seedStars('sqStars3',100,3,180);

var DEMO_VIDEOS=[
  {emoji:'🎯',title:'自我介绍满分示范：三段式表达法',scene:'job',owner:'金牌讲师 Linda'},
  {emoji:'💡',title:'项目难点怎么讲？STAR 法则实战',scene:'job',owner:'资深面试官 老周'},
  {emoji:'📊',title:'数据分析题：先对齐口径再拆指标',scene:'data',owner:'数据总监 Kevin'},
  {emoji:'🛠️',title:'技术深挖应对：现象→根因→验证',scene:'tech',owner:'架构师 阿澈'},
  {emoji:'🧩',title:'产品设计题：用户-场景-价值框架',scene:'product',owner:'产品专家 Mia'},
  {emoji:'💪',title:'压力面自救：被质疑时稳住节奏',scene:'general',owner:'HR 总监 Grace'}
];
function genDemoClip(meta){
  return new Promise(function(res){
    var c=document.createElement('canvas');c.width=640;c.height=360;
    var g=c.getContext('2d');
    var mr;
    try{mr=new MediaRecorder(c.captureStream(30))}catch(e){res(null);return}
    var chunks=[];
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=function(){res(new Blob(chunks,{type:mr.mimeType||'video/webm'}))};
    var t0=performance.now(),DUR=3000;
    var col=SCENE_COLOR[meta.scene]||'#6C8CFF';
    (function frame(){
      var t=(performance.now()-t0)/DUR;
      var grd=g.createLinearGradient(0,0,640,360);
      grd.addColorStop(0,'#0d1428');grd.addColorStop(1,'#151d3a');
      g.fillStyle=grd;g.fillRect(0,0,640,360);
      g.globalAlpha=.12+.08*Math.sin(t*Math.PI*4);
      g.fillStyle=col;g.beginPath();g.arc(320,150,90+10*Math.sin(t*Math.PI*2),0,7);g.fill();
      g.globalAlpha=1;
      g.font='64px serif';g.textAlign='center';g.fillText(meta.emoji,320,180);
      g.fillStyle='#fff';g.font='bold 25px sans-serif';
      g.fillText(meta.title.slice(0,18),320,278);
      g.fillStyle='rgba(255,255,255,.6)';g.font='15px sans-serif';
      g.fillText('官方示例 · '+SCENES[meta.scene].name+' · '+meta.owner,320,310);
      g.fillStyle='rgba(255,255,255,.15)';g.fillRect(0,350,640,10);
      g.fillStyle=col;g.fillRect(0,350,640*Math.min(t,1),10);
      if(t<1)requestAnimationFrame(frame);else mr.stop();
    })();
    mr.start();
  });
}
function seedDemos(){
  toast('首次访问：正在生成官方示例视频，约几秒钟…','ok');
  Promise.all(DEMO_VIDEOS.map(function(d,i){
    var id='demo_'+i;
    return genDemoClip(d).then(function(blob){
      if(!blob)return;
      return saveVideoBlob(id,blob).then(function(){
        addVideoMeta({id:id,title:d.title,scene:d.scene,owner:d.owner,status:'approved',ts:Date.now()-(DEMO_VIDEOS.length-i)*86400000,src:'demo',shared:true,demo:true});
      });
    });
  })).then(function(){render();playSound('unlock');toast('官方示例视频已就绪，点击卡片播放','ok')});
}

var SCENE_F='all';
function fmtTime(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()}
function sceneTag(sc){var s=SCENES[sc];return s?'<span class="tag" style="background:'+SCENE_COLOR[sc]+'22;color:'+SCENE_COLOR[sc]+'">'+s.name+'</span>':''}

/* 场景筛选条 */
var sf=document.getElementById('scFilter');
sf.innerHTML='<button class="sq-chip on" data-k="all">全部</button>'+Object.keys(SCENES).map(function(k){
  return '<button class="sq-chip" data-k="'+k+'">'+SCENES[k].name+'</button>'}).join('');
$$('#scFilter .sq-chip').forEach(function(b){b.onclick=function(){
  SCENE_F=b.dataset.k;$$('#scFilter .sq-chip').forEach(function(x){x.classList.toggle('on',x===b)});render();
}});

document.getElementById('goUp').onclick=function(){location.href='videos.html#videos'};

function render(){
  var me=(getUser()||{}).name||'访客';
  var uid=ensureUid();
  var all=getVideos().filter(function(v){return v.shared&&v.status==='approved'});
  /* 统计 */
  document.getElementById('stTotal').textContent=all.length;
  var owners={};all.forEach(function(v){owners[v.owner]=1});
  document.getElementById('stUser').textContent=Object.keys(owners).length;
  document.getElementById('stMine').textContent=all.filter(function(v){return (uid&&v.ownerUid)?v.ownerUid===uid:v.owner===me}).length;
  /* 列表 */
  var list=SCENE_F==='all'?all:all.filter(function(v){return v.scene===SCENE_F});
  document.getElementById('list').innerHTML=list.length?('<div class="sq-grid">'+list.map(function(v){
    return '<div class="vcard" data-id="'+v.id+'">'+
      '<div class="vthumb">'+(v.demo?'🎓':v.src==='interview'?'🎤':'📹')+'<div class="vplay"><span>▶</span></div></div>'+
      '<div class="vbody">'+
        '<div class="vtitle">'+esc(v.title)+'</div>'+
        '<div class="vmeta">'+sceneTag(v.scene)+'<span class="vowner">'+(v.demo?'🎓':'👤')+' '+esc(v.owner)+'</span><span>'+fmtTime(v.ts)+'</span></div>'+
      '</div></div>';
  }).join('')+'</div>'):'<div class="vempty"><div class="big">🌐</div>这个分类还没有公开视频<br>上传作品并通过审核后，就会出现在这里</div>';
  /* 播放 */
  $$('#list .vcard').forEach(function(c){
    c.onclick=function(){playVideo(c.dataset.id)};
  });
}

function playVideo(id){
  getVideoBlob(id).then(function(blob){
    if(!blob){toast('视频文件不存在（可能已清理）','warn');return}
    var url=URL.createObjectURL(blob);
    var v=getVideos().filter(function(x){return x.id===id})[0]||{};
    var m=openMask('<div class="m-head"><div><h3>'+esc(v.title||'视频回放')+'</h3><div class="m-sub">👤 '+esc(v.owner||'')+' · '+fmtTime(v.ts||Date.now())+'</div></div><button class="m-x" id="vpX">✕</button></div>'+
      '<video src="'+url+'" controls autoplay style="width:100%;border-radius:14px;background:#000;max-height:60vh"></video>');
    m.querySelector('#vpX').onclick=function(){closeMask()};
    m.addEventListener('click',function(){setTimeout(function(){URL.revokeObjectURL(url)},300)});
  });
}

var hasDemo=getVideos().some(function(v){return v.demo});
if(!hasDemo){seedDemos()}else{render()}
</script>
</body>
</html>
