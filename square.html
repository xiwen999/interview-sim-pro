<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* 首帧前应用已保存的主题 */
(function(){try{var s=JSON.parse(localStorage.getItem("ivsim_settings")||"{}");
if(s.theme==="light")document.documentElement.classList.add("light");}catch(e){}})();</script>
<title>观摩大厅 · 模拟面试训练营 Pro</title>
<link rel="stylesheet" href="shared.css?v=20261115h16a">
<style>
body{background:
  radial-gradient(ellipse 70% 45% at 30% -5%,rgba(244,114,182,.1),transparent),
  radial-gradient(ellipse 55% 40% at 75% 15%,rgba(251,191,36,.07),transparent),
  radial-gradient(ellipse 45% 35% at 50% 95%,rgba(138,189,255,.05),transparent),
  #0a1020}
.fp-wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at 25% 30%,rgba(244,114,182,.05) 0 2px,transparent 2px),
    radial-gradient(circle at 75% 45%,rgba(251,191,36,.04) 0 1.5px,transparent 1.5px),
    radial-gradient(circle at 50% 75%,rgba(138,189,255,.04) 0 1px,transparent 1px);
  background-size:200px 200px,180px 180px,240px 240px;opacity:.5}
.fp-shell{position:relative;overflow:hidden}
/* 壳内动态星光层 */
.fx-stars{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fp-shell::after{content:"🎬";position:absolute;right:-25px;top:-35px;font-size:190px;opacity:.028;
  transform:rotate(-12deg);pointer-events:none;filter:grayscale(.2)}
@media (max-width:1024px){.fp-shell::after{font-size:130px;right:-15px;top:-25px}}
/* 浅色模式适配 */
body.light .fp-wrap::before{opacity:.22}
body.light .fp-shell::after{opacity:.018}
/* 与题库一致：壳体贴平，让极光背景连续铺满整页 */
body.light .fp-shell{
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
body.light .fp-shell::before{display:none}
/* 统计行 */
.sq-stats{display:flex;gap:clamp(16px,2.2vw,26px);margin:2px 0 0 clamp(0px,1.4vw,18px);flex:none;flex-wrap:wrap}
.sq-stat .n{font-size:var(--fs-2xl);font-weight:900;color:var(--ink)}
.sq-stat .l{font-size:var(--fs-xs);color:var(--ink3);margin-top:2px}
@media (max-width:768px){.sq-stats{margin:12px 0 0}}

/* 场景筛选：对齐设置页选项 */
.sq-filter{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap;align-items:center}
.sq-filter+.sq-filter{margin-top:-6px}
.sq-lab{font-size:var(--fs-xs);color:var(--ink3);margin:0 4px 0 2px}
.sq-chip{padding:10px 16px;border-radius:13px;background:var(--card);border:1.5px solid var(--line);font-size:var(--fs-base);font-weight:600;color:var(--ink2);cursor:pointer;transition:.18s;
  box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.05)}
.sq-chip:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.sq-chip.on{border-color:var(--acc);color:var(--ink);background:rgba(108,140,255,.14);
  box-shadow:0 0 0 3px rgba(108,140,255,.14),0 10px 24px rgba(108,140,255,.22)}

/* 视频网格 */
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--g-wide),1fr));gap:16px}
.vcard{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s;cursor:pointer}
.vcard:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.vthumb{height:140px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,rgba(30,40,80,.9),rgba(38,32,72,.85));position:relative;overflow:hidden}
.vthumb .vph{line-height:1;transition:opacity .3s}
.vthumb.has-poster .vph{opacity:0}

.vthumb img.vposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s;display:block;pointer-events:none;z-index:1}
.vthumb img.vposter.on{opacity:1}
.vthumb::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,transparent 55%,rgba(6,10,22,.55));opacity:0;transition:opacity .4s;pointer-events:none}
.vthumb.has-poster::after{opacity:1}
.vthumb.is-loading::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.06) 45%,transparent 70%);animation:vshim 1.3s linear infinite;pointer-events:none}
@keyframes vshim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.vthumb .vplay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,13,29,.35);opacity:0;transition:.2s;z-index:2}
.vcard:hover .vplay{opacity:1}
.vthumb .vplay span{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#4f6ef0,#6C8CFF);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 8px 24px rgba(79,110,240,.5)}
.vbody{padding:12px 14px}
.vtitle{font-size:var(--fs-base);font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--fs-xs);color:var(--ink3);flex-wrap:wrap}
.vowner{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.vempty{text-align:center;padding:clamp(44px,7vw,70px) 20px;color:var(--ink3);font-size:var(--fs-base)}
.vempty .big{font-size:48px;margin-bottom:12px}
@media (pointer:coarse){.sq-chip{min-height:44px;display:inline-flex;align-items:center}.vcard{min-height:44px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="fp-wrap">
  <div class="fp-shell rise">
    <div class="fx-stars" aria-hidden="true"><div id="sqStars1"></div><div id="sqStars2"></div><div id="sqStars3"></div></div>
    <div class="fp-head">
      <div class="fp-ic">🌐</div>
      <div>
        <h1>观摩大厅</h1>
        <p class="fp-sub">这里展示所有通过审核的模拟面试视频，看看别人怎么答，取长补短。</p>
      </div>
      <div class="fp-acts"><button class="btn pri sm" id="goUp">⬆️ 去个人中心上传</button></div>
    </div>
    <div class="fp-tip">
      <span class="fp-tip-ic">💡</span>
      <div style="flex:1">
        <div class="fp-tip-t">围观也是练习</div>
        <div class="fp-tip-d">先看一遍别人怎么答，再遮住要点自己复述一遍——模仿是结构化表达最快的入门方式。</div>
      </div>
      <div class="sq-stats">
        <div class="sq-stat"><div class="n" id="stTotal">0</div><div class="l">公开视频</div></div>
        <div class="sq-stat"><div class="n" id="stUser">0</div><div class="l">分享者</div></div>
        <div class="sq-stat"><div class="n" id="stMine">0</div><div class="l">我的作品</div></div>
      </div>
    </div>

    <div class="sq-filter" id="scFilter"></div>
    <div class="sq-filter" id="rdFilter"></div>
    <div id="list"></div>
  </div>
</div>

<script src="shared.js?v=20261117a3"></script>
<script src="cloud.js?v=20261115g14b"></script>
<script>
initPage('square');
/* 壳内动态星空 */
seedStars('sqStars1',700,1,60);seedStars('sqStars2',200,2,120);seedStars('sqStars3',100,3,180);

var ROLE_F='all', ROUND_F='all';
function fmtTime(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()}
/* 与题库同一套双轴标签：岗位 + 面试类型 */
function axisTags(v){
  var r=ROLE_MAP[roleOf(v)], rd=ROUND_MAP[roundOf(v)], out='';
  if(r)out+='<span class="tag" style="background:'+r.color+'22;color:'+r.color+'">'+r.icon+' '+r.name+'</span>';
  if(rd)out+='<span class="tag" style="background:'+rd.color+'22;color:'+rd.color+'">'+rd.icon+' '+rd.name+'</span>';
  return out;
}

/* 双轴筛选条：岗位 × 面试类型 */
function renderFilters(){
  var sf=document.getElementById('scFilter'), rf=document.getElementById('rdFilter');
  sf.innerHTML='<span class="sq-lab">岗位</span><button class="sq-chip'+(ROLE_F==='all'?' on':'')+'" data-k="all">全部岗位</button>'+
    ROLES.map(function(r){return '<button class="sq-chip'+(ROLE_F===r.id?' on':'')+'" data-k="'+r.id+'">'+r.icon+' '+r.name+'</button>'}).join('');
  $$('#scFilter .sq-chip').forEach(function(b){b.onclick=function(){
    ROLE_F=b.dataset.k;$$('#scFilter .sq-chip').forEach(function(x){x.classList.toggle('on',x===b)});render();
  }});
  rf.innerHTML='<span class="sq-lab">类型</span><button class="sq-chip'+(ROUND_F==='all'?' on':'')+'" data-k="all">全部类型</button>'+
    ROUNDS.map(function(r){return '<button class="sq-chip'+(ROUND_F===r.id?' on':'')+'" data-k="'+r.id+'">'+r.icon+' '+r.name+'</button>'}).join('');
  $$('#rdFilter .sq-chip').forEach(function(b){b.onclick=function(){
    ROUND_F=b.dataset.k;$$('#rdFilter .sq-chip').forEach(function(x){x.classList.toggle('on',x===b)});render();
  }});
}
renderFilters();

document.getElementById('goUp').onclick=function(){location.href='videos.html#videos'};

function render(){
  var me=(getUser()||{}).name||'访客';
  var uid=ensureUid();
  var all=getVideos().filter(function(v){return v.shared&&v.status==='approved'});
  /* 统计 */
  document.getElementById('stTotal').textContent=all.length;
  var owners={};all.forEach(function(v){owners[v.owner]=1});
  document.getElementById('stUser').textContent=Object.keys(owners).length;
  document.getElementById('stMine').textContent=all.filter(function(v){return (uid&&v.ownerUid)?v.ownerUid===uid:v.owner===me}).length;
  /* 列表 */
  var list=all.filter(function(v){
    if(ROLE_F!=='all'&&roleOf(v)!==ROLE_F)return false;
    if(ROUND_F!=='all'&&roundOf(v)!==ROUND_F)return false;
    return true;
  });
  document.getElementById('list').innerHTML=list.length?('<div class="sq-grid">'+list.map(function(v){
    var ic=v.demo?'🎓':v.src==='interview'?'🎤':v.src==='server'&&!v.hasFile?'📼':'📹';
    return '<div class="vcard" data-id="'+v.id+'">'+
      '<div class="vthumb"><span class="vph">'+ic+'</span><img class="vposter" alt="" data-vposter="'+v.id+'"><div class="vplay"><span>▶</span></div></div>'+
      '<div class="vbody">'+
        '<div class="vtitle">'+esc(v.title)+'</div>'+
        '<div class="vmeta">'+axisTags(v)+'<span class="vowner">'+(v.demo?'🎓':'👤')+' '+esc(v.owner)+'</span><span>'+fmtTime(v.ts)+'</span></div>'+
      '</div></div>';
  }).join('')+'</div>'):'<div class="vempty"><div class="big">🌐</div>这个筛选下还没有公开视频<br>换个岗位或类型，或上传作品通过审核后就会出现在这里</div>';
  /* 播放 */
  $$('#list .vcard').forEach(function(c){
    c.onclick=function(){playVideo(c.dataset.id)};
  });
    hydrateVideoPosters(document.getElementById('list'));
}

function playVideo(id){
  getVideoBlob(id).then(function(blob){
    var v=getVideos().filter(function(x){return x.id===id})[0]||{};
    var src=null;
    if(blob){src=URL.createObjectURL(blob)}
    else{src='/api/videos/file/'+encodeURIComponent(id)} /* 别人投稿的视频：文件在服务器上 */
    var m=openMask('<div class="m-head"><div><h3>'+esc(v.title||'视频回放')+'</h3><div class="m-sub">👤 '+esc(v.owner||'')+' · '+fmtTime(v.ts||Date.now())+'</div></div><button class="m-x" id="vpX">✕</button></div>'+
      '<video id="vpEl" src="'+src+'" controls autoplay style="width:100%;border-radius:14px;background:#000;max-height:60vh"></video>');
    m.querySelector('#vpX').onclick=function(){closeMask()};
    m.querySelector('#vpEl').onerror=function(){
      closeMask();toast('该视频文件尚未上传到服务器，仅投稿者本机可播放','warn');
    };
    if(blob)m.addEventListener('click',function(){setTimeout(function(){URL.revokeObjectURL(src)},300)});
  });
}

/* 从服务器拉取审核通过的视频 */
function mergeHall(hall){
  var local=getVideos(),byId={},changed=false;
  local.forEach(function(v,i){byId[v.id]=i});
  var hallIds={};
  hall.forEach(function(sv){
    hallIds[sv.id]=1;
    var v=local[byId[sv.id]];
    if(v){
      /* 本机已有 */
      if(v.status!=='approved'||!v.shared||v.owner!==sv.owner){
        v.status='approved';v.shared=true;v.owner=sv.owner;v.ownerUid=sv.ownerUid;
        if(sv.file)v.hasFile=true;
        changed=true;
      }
    }else{
      local.unshift({id:sv.id,title:sv.title,scene:sv.scene,owner:sv.owner,ownerUid:sv.ownerUid,
        status:'approved',ts:sv.ts||Date.now(),src:'server',shared:true,hasFile:!!sv.file});
      changed=true;
    }
  });
  /* 已在服务器被下架 / 拒绝的 */
  local=local.filter(function(v){return !(v.src==='server'&&!hallIds[v.id])});
  if(changed)saveVideos(local);
}
function loadHall(){
  try{
    apiCall('/api/videos/hall',{silent:true}).then(function(r){
      mergeHall((r.data&&r.data.videos)||[]);
      render();
      reuploadLocalVideoFiles(); /* 自己投稿的视频服务器缺文件时自动补传 */
      syncVideoStatusFromServer().then(function(ch){if(ch)render()}); /* 管理员删除/拒绝后本机同步下架 */
    }).catch(function(){});
  }catch(e){}
}

render();
loadHall();
</script>
</body>
</html>
