<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>视频广场 · 模拟面试训练营 Pro</title>
<link rel="stylesheet" href="shared.css?v=202610261">
<style>
.wrap{max-width:1100px;margin:0 auto;padding:26px clamp(14px,4vw,40px) 90px}

/* Hero */
.sq-hero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);margin-top:18px;padding:34px 30px}
.sq-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(79,110,240,.55),rgba(108,140,255,.3),rgba(65,224,200,.18));z-index:-1}
.sq-hero h1{font-size:26px;font-weight:900;letter-spacing:.5px}
.sq-hero p{font-size:13px;color:rgba(255,255,255,.75);margin-top:8px;line-height:1.8}
.sq-stats{display:flex;gap:26px;margin-top:20px}
.sq-stat .n{font-size:24px;font-weight:900;color:#fff}
.sq-stat .l{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:2px}
.sq-up{position:absolute;right:26px;top:50%;transform:translateY(-50%)}

/* 场景筛选 */
.sq-filter{display:flex;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.sq-chip{padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:.18s}
.sq-chip:hover{border-color:var(--acc);color:var(--ink)}
.sq-chip.on{background:linear-gradient(135deg,#4f6ef0,#6C8CFF);color:#fff;border-color:transparent}

/* 视频网格 */
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s;cursor:pointer}
.vcard:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 14px 34px rgba(0,0,0,.3)}
.vthumb{height:140px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,rgba(79,110,240,.18),rgba(65,224,200,.1));position:relative}
.vthumb .vplay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,13,29,.35);opacity:0;transition:.2s}
.vcard:hover .vplay{opacity:1}
.vthumb .vplay span{width:54px;height:54px;border-radius:50%;background:rgba(108,140,255,.92);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 8px 24px rgba(79,110,240,.5)}
.vbody{padding:12px 14px}
.vtitle{font-size:13.5px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.vowner{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--ink2)}
.vempty{text-align:center;padding:70px 20px;color:var(--ink3);font-size:13px}
.vempty .big{font-size:48px;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="sq-hero rise">
    <h1>🌐 视频广场</h1>
    <p>这里展示所有通过审核的模拟面试视频，看看别人怎么答，取长补短。</p>
    <div class="sq-stats">
      <div class="sq-stat"><div class="n" id="stTotal">0</div><div class="l">公开视频</div></div>
      <div class="sq-stat"><div class="n" id="stUser">0</div><div class="l">分享者</div></div>
      <div class="sq-stat"><div class="n" id="stMine">0</div><div class="l">我的作品</div></div>
    </div>
    <button class="btn pri sq-up" id="goUp">⬆️ 上传我的视频</button>
  </div>

  <div class="sq-filter" id="scFilter"></div>
  <div id="list"></div>
</div>

<script src="shared.js?v=202610261"></script>
<script>
if(!initPage('square',true))throw new Error('login required');

var DEMO_VIDEOS=[
  {emoji:'🎯',title:'自我介绍满分示范：三段式表达法',scene:'job',owner:'金牌讲师 Linda'},
  {emoji:'💡',title:'项目难点怎么讲？STAR 法则实战',scene:'job',owner:'资深面试官 老周'},
  {emoji:'📊',title:'数据分析题：先对齐口径再拆指标',scene:'data',owner:'数据总监 Kevin'},
  {emoji:'🛠️',title:'技术深挖应对：现象→根因→验证',scene:'tech',owner:'架构师 阿澈'},
  {emoji:'🧩',title:'产品设计题：用户-场景-价值框架',scene:'product',owner:'产品专家 Mia'},
  {emoji:'💪',title:'压力面自救：被质疑时稳住节奏',scene:'general',owner:'HR 总监 Grace'}
];
function genDemoClip(meta){
  return new Promise(function(res){
    var c=document.createElement('canvas');c.width=640;c.height=360;
    var g=c.getContext('2d');
    var mr;
    try{mr=new MediaRecorder(c.captureStream(30))}catch(e){res(null);return}
    var chunks=[];
    mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=function(){res(new Blob(chunks,{type:mr.mimeType||'video/webm'}))};
    var t0=performance.now(),DUR=3000;
    var col=SCENE_COLOR[meta.scene]||'#6C8CFF';
    (function frame(){
      var t=(performance.now()-t0)/DUR;
      var grd=g.createLinearGradient(0,0,640,360);
      grd.addColorStop(0,'#0d1428');grd.addColorStop(1,'#151d3a');
      g.fillStyle=grd;g.fillRect(0,0,640,360);
      g.globalAlpha=.12+.08*Math.sin(t*Math.PI*4);
      g.fillStyle=col;g.beginPath();g.arc(320,150,90+10*Math.sin(t*Math.PI*2),0,7);g.fill();
      g.globalAlpha=1;
      g.font='64px serif';g.textAlign='center';g.fillText(meta.emoji,320,180);
      g.fillStyle='#fff';g.font='bold 25px sans-serif';
      g.fillText(meta.title.slice(0,18),320,278);
      g.fillStyle='rgba(255,255,255,.6)';g.font='15px sans-serif';
      g.fillText('官方示例 · '+SCENES[meta.scene].name+' · '+meta.owner,320,310);
      g.fillStyle='rgba(255,255,255,.15)';g.fillRect(0,350,640,10);
      g.fillStyle=col;g.fillRect(0,350,640*Math.min(t,1),10);
      if(t<1)requestAnimationFrame(frame);else mr.stop();
    })();
    mr.start();
  });
}
function seedDemos(){
  toast('首次访问：正在生成官方示例视频，约几秒钟…','ok');
  Promise.all(DEMO_VIDEOS.map(function(d,i){
    var id='demo_'+i;
    return genDemoClip(d).then(function(blob){
      if(!blob)return;
      return saveVideoBlob(id,blob).then(function(){
        addVideoMeta({id:id,title:d.title,scene:d.scene,owner:d.owner,status:'approved',ts:Date.now()-(DEMO_VIDEOS.length-i)*86400000,src:'demo',shared:true,demo:true});
      });
    });
  })).then(function(){render();playSound('unlock');toast('官方示例视频已就绪，点击卡片播放','ok')});
}

var SCENE_F='all';
function fmtTime(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()}
function sceneTag(sc){var s=SCENES[sc];return s?'<span class="tag" style="background:'+SCENE_COLOR[sc]+'22;color:'+SCENE_COLOR[sc]+'">'+s.name+'</span>':''}

/* 场景筛选条 */
var sf=document.getElementById('scFilter');
sf.innerHTML='<button class="sq-chip on" data-k="all">全部</button>'+Object.keys(SCENES).map(function(k){
  return '<button class="sq-chip" data-k="'+k+'">'+SCENES[k].name+'</button>'}).join('');
$$('#scFilter .sq-chip').forEach(function(b){b.onclick=function(){
  SCENE_F=b.dataset.k;$$('#scFilter .sq-chip').forEach(function(x){x.classList.toggle('on',x===b)});render();
}});

document.getElementById('goUp').onclick=function(){location.href='videos.html'};

function render(){
  var me=(getUser()||{}).name||'访客';
  var all=getVideos().filter(function(v){return v.shared&&v.status==='approved'});
  /* 统计 */
  document.getElementById('stTotal').textContent=all.length;
  var owners={};all.forEach(function(v){owners[v.owner]=1});
  document.getElementById('stUser').textContent=Object.keys(owners).length;
  document.getElementById('stMine').textContent=all.filter(function(v){return v.owner===me}).length;
  /* 列表 */
  var list=SCENE_F==='all'?all:all.filter(function(v){return v.scene===SCENE_F});
  document.getElementById('list').innerHTML=list.length?('<div class="sq-grid">'+list.map(function(v){
    return '<div class="vcard" data-id="'+v.id+'">'+
      '<div class="vthumb">'+(v.demo?'🎓':v.src==='interview'?'🎤':'📹')+'<div class="vplay"><span>▶</span></div></div>'+
      '<div class="vbody">'+
        '<div class="vtitle">'+esc(v.title)+'</div>'+
        '<div class="vmeta">'+sceneTag(v.scene)+'<span class="vowner">'+(v.demo?'🎓':'👤')+' '+esc(v.owner)+'</span><span>'+fmtTime(v.ts)+'</span></div>'+
      '</div></div>';
  }).join('')+'</div>'):'<div class="vempty"><div class="big">🌐</div>这个分类还没有公开视频<br>上传作品并通过审核后，就会出现在这里</div>';
  /* 播放 */
  $$('#list .vcard').forEach(function(c){
    c.onclick=function(){playVideo(c.dataset.id)};
  });
}

function playVideo(id){
  getVideoBlob(id).then(function(blob){
    if(!blob){toast('视频文件不存在（可能已清理）','warn');return}
    var url=URL.createObjectURL(blob);
    var v=getVideos().filter(function(x){return x.id===id})[0]||{};
    var m=openMask('<div class="m-head"><div><h3>'+esc(v.title||'视频回放')+'</h3><div class="m-sub">👤 '+esc(v.owner||'')+' · '+fmtTime(v.ts||Date.now())+'</div></div><button class="m-x" id="vpX">✕</button></div>'+
      '<video src="'+url+'" controls autoplay style="width:100%;border-radius:14px;background:#000;max-height:60vh"></video>');
    m.querySelector('#vpX').onclick=function(){closeMask()};
    m.addEventListener('click',function(){setTimeout(function(){URL.revokeObjectURL(url)},300)});
  });
}

var hasDemo=getVideos().some(function(v){return v.demo});
if(!hasDemo){seedDemos()}else{render()}
</script>
</body>
</html>
