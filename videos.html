<meta charset="UTF-8">

<title>个人中心 · 模拟面试训练营 Pro</title>
<link rel="stylesheet" href="shared.css?v=20261115e10n">
<style>
/* 卡片语言 = rgba(255,255,255,.055→.02) 的白色玻璃渐变；背景用完全同源的白色光感，不带彩色色相 */
body{background:
  radial-gradient(ellipse 100% 60% at 50% -18%,rgba(255,255,255,.06),transparent 62%),
  radial-gradient(ellipse 58% 50% at 100% 38%,rgba(255,255,255,.035),transparent 65%),
  radial-gradient(ellipse 66% 55% at 0% 102%,rgba(255,255,255,.028),transparent 65%),
  #0a1020}
/* 与卡片玻璃渐变同向的白色渐变罩（上微亮→下微暗），让背景像卡片材质的延伸 */
.fp-wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 32%,transparent 72%,rgba(255,255,255,.014))}
/* 右上微光斑：同样只用白色透明度，与壳体材质一致 */
/* overflow:clip 保留装饰裁切，同时不生成滚动容器，保证左栏 sticky 生效 */
.fp-shell{position:relative;overflow:clip}
.fp-shell::after{content:"";position:absolute;right:-90px;top:-90px;width:360px;height:360px;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.055),rgba(255,255,255,.02) 46%,transparent 70%)}
/* 浅色模式适配 */
body.light{background:linear-gradient(180deg,#ffffff 0%,#f8fbff 42%,#eff4ff 100%)}
/* 与题库一致：壳体贴平，让极光背景连续铺满整页 */
body.light .fp-shell{
  background:transparent !important;
  border-color:transparent !important;
  box-shadow:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
body.light .fp-shell::before{display:none}
body.light .fp-wrap::before{background:linear-gradient(180deg,rgba(37,99,235,.028),transparent 34%,transparent 74%,rgba(37,99,235,.016))}
body.light .fp-shell::after{background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,.12) 46%,transparent 70%)}
.pc-stars{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.vtabs{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap;padding:6px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.vtab{padding:11px 18px;border-radius:12px;background:transparent;border:none;font-size:var(--fs-base);font-weight:600;color:var(--ink2);
  cursor:pointer;transition:.2s;position:relative;display:flex;align-items:center;gap:6px}
.vtab:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.vtab.on{color:#fff;background:linear-gradient(135deg,#6c8cff,#41e0c8);
  box-shadow:0 6px 18px rgba(108,140,255,.35)}
.vtabs.sub{margin:0 0 16px;padding:4px;border-radius:14px}
.vtabs.sub .vtab{padding:9px 15px;font-size:var(--fs-sm)}
.vtabs.sub .vtab.on{box-shadow:0 4px 14px rgba(108,140,255,.3)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--g-wide),1fr));gap:16px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.2)}
.vcard:hover{transform:translateY(-4px);border-color:rgba(108,140,255,.4);box-shadow:0 16px 36px rgba(0,0,0,.35),0 0 0 1px rgba(108,140,255,.15)}
.vthumb{height:130px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,rgba(30,40,80,.9),rgba(38,32,72,.85));position:relative;overflow:hidden}
.vthumb .vph{line-height:1;transition:opacity .3s}
.vthumb.has-poster .vph{opacity:0}
/* 封面：视频随机一帧，图片就位后淡入（未取到画面时保留图标兜底） */
.vthumb img.vposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s;display:block;pointer-events:none;z-index:1}
.vthumb img.vposter.on{opacity:1}
.vthumb::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .4s;
  background:linear-gradient(180deg,transparent 55%,rgba(6,10,22,.55))}
.vthumb.has-poster::after{opacity:1}
.vthumb.is-loading::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.06) 45%,transparent 70%);animation:vshim 1.3s linear infinite}
@keyframes vshim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.vthumb .vplay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,13,29,.35);opacity:0;transition:.2s;z-index:2}
.vcard:hover .vplay{opacity:1}
.vthumb .vplay span{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#4f6ef0,#6C8CFF);display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 8px 24px rgba(79,110,240,.5)}
.vbody{padding:12px 14px}
.vtitle{font-size:var(--fs-base);font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--fs-xs);color:var(--ink3);flex-wrap:wrap}
.vbadge{font-size:var(--fs-2xs);padding:2px 8px;border-radius:999px;font-weight:700}
.vbadge.pending{background:rgba(251,191,36,.15);color:#ffd68a}
.vbadge.approved{background:rgba(65,224,200,.15);color:#7dead6}
.vbadge.rejected{background:rgba(251,113,133,.15);color:#fda4af}
.vactions{display:flex;gap:6px;margin-top:10px}
.vactions .btn{flex:1;padding:7px 0;font-size:var(--fs-xs);border-radius:10px}
.vempty{text-align:center;padding:clamp(44px,7vw,70px) 20px;color:var(--ink3);font-size:var(--fs-base)}
.vempty .big{font-size:52px;margin-bottom:14px;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.up-card{max-width:540px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:clamp(20px,3vw,30px) clamp(16px,2.4vw,26px);
  box-shadow:0 8px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.04)}
.up-drop{border:2px dashed var(--line2);border-radius:16px;padding:clamp(24px,3.6vw,34px) 16px;text-align:center;color:var(--ink3);font-size:var(--fs-base);cursor:pointer;transition:.2s;margin-bottom:14px}
.up-drop:hover,.up-drop.has{border-color:var(--acc);color:var(--ink2);background:rgba(108,140,255,.06)}
.up-drop .big{font-size:36px;display:block;margin-bottom:8px}
.up-note{margin-top:12px;font-size:var(--fs-xs);color:var(--ink3);line-height:1.8;padding:10px 14px;border-radius:12px;background:rgba(251,191,36,.08);border:1px dashed rgba(251,191,36,.3)}
.mg-dot{display:inline-block;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#f59e0b;
  color:#1b1200;font-size:var(--fs-2xs);font-weight:800;line-height:17px;text-align:center;vertical-align:1px}
.mg-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--g-small),1fr));gap:12px;margin-bottom:16px}
.mg-k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(13px,1.5vw,16px);
  box-shadow:0 4px 14px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.04);transition:.2s}
.mg-k:hover{transform:translateY(-2px);border-color:rgba(108,140,255,.35)}
.mg-k .l{font-size:var(--fs-xs);color:var(--ink3);display:flex;align-items:center;gap:5px}
.mg-k .v{font-size:var(--fs-2xl);font-weight:900;margin-top:6px;line-height:1}
.mg-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mg-hd,.mg-row{display:grid;grid-template-columns:52px minmax(0,1fr) clamp(90px,11vw,146px) clamp(72px,8vw,110px) clamp(200px,17vw,246px);gap:12px;align-items:center;padding:12px 16px}
.mg-hd{font-size:var(--fs-xs);color:var(--ink3);background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);font-weight:700}
.mg-row{border-bottom:1px solid var(--line);transition:.16s}
.mg-row:last-child{border-bottom:0}
.mg-row:hover{background:rgba(108,140,255,.05)}
.mg-th{width:52px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:17px;
  background:linear-gradient(135deg,rgba(60,80,160,.55),rgba(40,32,96,.5));cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line)}
.mg-th .vph{line-height:1}
.mg-th img.vposter{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;z-index:1}
.mg-th img.vposter.on{opacity:1}
.mg-th.has-poster .vph{opacity:0}
.mg-ti{font-size:var(--fs-base);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mg-mt{font-size:var(--fs-xs);color:var(--ink3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.mg-reason{margin-top:5px;font-size:var(--fs-xs);color:#fda4af;line-height:1.6;background:rgba(251,113,133,.08);
  border:1px solid rgba(251,113,133,.22);border-radius:8px;padding:5px 8px}
.mg-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.mg-acts .btn{padding:6px 10px;font-size:var(--fs-xs);border-radius:9px}
.mg-tip{margin-top:14px;font-size:var(--fs-xs);color:var(--ink3);line-height:1.9}
@media (max-width:768px){
  .mg-hd{display:none}
  /* 三行网格：封面+标题 / 状态+日期 / 操作，标题可换行且不被状态和日期挤窄 */
  .mg-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;
    grid-template-areas:"th info info" "th st date" "acts acts acts";
    gap:8px 10px;padding:12px;align-items:center}
  .mg-row .mg-th{grid-area:th;width:44px;height:34px}
  .mg-row .mg-info{grid-area:info;min-width:0}
  .mg-row .mg-st{grid-area:st;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
  .mg-row .mg-date{grid-area:date;font-size:var(--fs-2xs);white-space:nowrap}
  .mg-row .mg-acts{grid-area:acts;justify-content:flex-start}
  .mg-ti{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45;word-break:break-word}
}

.myc-row .ai{font-size:var(--fs-xs);color:var(--ink3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.myc-cd .u{font-size:var(--fs-base);color:var(--ink3);margin-left:2px}
.myc-cd .d{font-size:var(--fs-xs);color:var(--ink3);line-height:1.7}
.f-err{font-size:var(--fs-xs);color:#f87171;margin-top:4px;min-height:14px}
.b-field label em.err{color:#f87171}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;

.myc-fav{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--g-wide),1fr));gap:14px}
.myc-fav .f{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;cursor:pointer;transition:.2s;
  box-shadow:0 4px 14px rgba(0,0,0,.18)}
.myc-fav .f:hover{border-color:rgba(108,140,255,.4);transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.28)}

.myc-fav .fm{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:var(--fs-xs);color:var(--ink3);flex-wrap:wrap}
.myc-gate{max-width:520px;margin:4px auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(24px,3.6vw,34px) clamp(18px,2.8vw,30px) clamp(18px,2.4vw,26px);text-align:center;

.myc-gate h3{font-size:var(--fs-xl);font-weight:800;margin-bottom:8px}

.myc-gate .gb .btn{min-width:132px;text-decoration:none}

  .myc-row{grid-template-columns:minmax(0,1fr) clamp(72px,12vw,84px);row-gap:4px}

/* 个人指挥舱：内容壳加宽至 1480px（窄屏自适应），壳体保留通栏质感 */
.wrap.fp-wrap{max-width:min(98vw,1480px);padding:0 0 40px}
.fp-shell{border-radius:0;border-left:0;border-right:0;border-top:0;
  padding:clamp(20px,2.6vw,36px) clamp(18px,3vw,44px) calc(64px + env(safe-area-inset-bottom,0px));
  min-height:calc(100vh - 64px)}
/* 背景与壳体一体化 + 左右对称：快捷栏让位移入壳内，左侧补等量让位，任何屏宽下左右留白一致 */
@media (min-width:1280px){.fp-shell{
  padding-right:calc(clamp(18px,3vw,44px) + 104px);
  padding-left:calc(clamp(18px,3vw,44px) + 104px)}}
.fp-shell::before{left:0;right:0}
.b-shell{display:grid;grid-template-columns:clamp(220px,23vw,292px) minmax(0,1fr);gap:18px;align-items:start;max-width:none}
.b-main{min-width:0}
.rail{position:relative;position:sticky;top:16px;border-radius:20px;padding:clamp(16px,2vw,24px) clamp(14px,1.6vw,20px);text-align:center;overflow:hidden;
  background:linear-gradient(180deg,rgba(108,140,255,.15),rgba(65,224,200,.04)),var(--card);
  border:1px solid var(--line);box-shadow:0 18px 44px -20px rgba(0,0,0,.55)}
.rail::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(108,140,255,.85),rgba(65,224,200,.6),transparent)}
.rail-avwrap{position:relative;width:92px;margin:0 auto 12px}

.rail-dot{position:absolute;right:2px;bottom:6px;width:12px;height:12px;border-radius:50%;background:var(--acc2);border:2px solid #0a1020;box-shadow:0 0 10px var(--acc2)}

.b-greet span{display:block;font-size:var(--fs-sm);color:var(--ink3);margin-top:5px}

.b-quick button{padding:12px 24px;border-radius:12px;font-size:var(--fs-lg);font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink2);transition:.2s}
.b-quick button:hover{border-color:var(--line2);color:var(--ink);transform:translateY(-1px)}
.b-quick .pri{background:linear-gradient(135deg,var(--acc),#4f6ef0);border:none;color:#fff;box-shadow:0 6px 18px rgba(79,110,240,.3)}
#secTabs.b-seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin:0 0 16px;box-shadow:none}
#secTabs.b-seg .vtab{flex:1 1 auto;min-width:0;justify-content:center;padding:9px 10px;border-radius:9px;font-size:var(--fs-sm);background:transparent;box-shadow:none;color:var(--ink3);white-space:nowrap}
#secTabs.b-seg .vtab:hover{color:var(--ink2);background:transparent}
#secTabs.b-seg .vtab.on{color:var(--ink);background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.b-set{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.b-swide{grid-column:1/-1}
.b-scard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,2vw,24px)}
.b-shead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.b-shead .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.07);font-size:18px;flex:none}
body.light .b-shead .ic{background:rgba(15,23,42,.05)}
.b-shead b{font-size:var(--fs-xl)}
.b-shead span{font-size:var(--fs-xs);color:var(--ink3);margin-left:auto}
.b-field{margin-bottom:16px}
.b-field label{display:flex;justify-content:space-between;align-items:center;font-size:var(--fs-sm);letter-spacing:.06em;color:var(--ink3);font-weight:700;margin-bottom:8px}
.b-field label em{font-style:normal;font-size:var(--fs-2xs);letter-spacing:0}
.b-inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:max(16px,var(--fs-lg));color:var(--ink);outline:none;transition:.2s}
body.light .b-inp{background:#fff}
.b-inp:focus{border-color:rgba(108,140,255,.55);box-shadow:0 0 0 3px rgba(108,140,255,.1)}
.b-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.b-avrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.b-avrow .av-emoji{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;cursor:pointer;
  background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.18s}
.b-avrow .av-emoji:hover{border-color:rgba(108,140,255,.5);transform:scale(1.08)}
.b-avrow .av-emoji.on{border-color:#41e0c8;background:rgba(65,224,200,.12);box-shadow:0 0 0 2px rgba(65,224,200,.25)}
body.light .b-avrow .av-emoji{background:#fff}
.b-inp textarea{resize:vertical}
.b-field .b-inp{font-family:inherit}
.b-two .b-field{margin-bottom:16px}
.b-cur{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(108,140,255,.12);border:1px solid rgba(108,140,255,.4);overflow:hidden}
.b-cur img{width:100%;height:100%;object-fit:cover}
.b-upbtn{padding:10px 15px;border-radius:11px;border:1px solid var(--line);background:transparent;font-size:var(--fs-sm);color:var(--ink2);transition:.2s}
.b-upbtn:hover{border-color:var(--line2);color:var(--ink)}
.b-upbtn.danger{color:#ffb3bd;border-color:rgba(251,113,133,.35)}
.b-savebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:18px;margin-top:8px;border-top:1px solid var(--line)}
.b-save{padding:13px 28px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#4f6ef0);color:#fff;font-size:var(--fs-lg);font-weight:700;box-shadow:0 6px 18px rgba(79,110,240,.28)}
.b-save:disabled{opacity:.6;cursor:not-allowed}
.b-savebar span{font-size:var(--fs-xs);color:var(--ink3)}
.b-danger{border-color:rgba(251,113,133,.3);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.b-danger b{display:block;font-size:var(--fs-xl)}
.b-danger span{display:block;font-size:var(--fs-sm);color:var(--ink3);margin-top:4px}
.b-out{padding:12px 20px;border-radius:11px;border:1px solid rgba(251,113,133,.4);color:#ffb3bd;font-size:var(--fs-lg);font-weight:700;background:rgba(251,113,133,.08);transition:.2s;flex:none}
.b-out:hover{background:rgba(251,113,133,.16);color:#fff}
body.light .b-out{color:#be123c}
body.light .b-out:hover{background:#be123c;border-color:#be123c;color:#fff}
@media (min-width:1000px){
  .b-shell{grid-template-columns:clamp(300px,24vw,372px) minmax(0,1fr);gap:clamp(20px,2vw,28px)}
  /* 让身份卡作为整列粘性元素：初始贴近视口垂直中心，滚动时持续跟随 */
  #heroCard{position:sticky;top:max(80px,calc(50vh - 290px));align-self:start}
  #heroCard>.rail{position:relative;top:auto;width:100%;border-radius:22px;padding:26px 20px 22px}
  .rail-avwrap{width:112px;margin-bottom:15px}
  .rail-av{width:112px;height:112px;font-size:54px}
  .rail-dot{width:14px;height:14px;right:3px;bottom:8px;border-width:3px}
  .rail-nm{font-size:clamp(22px,1.55vw,27px)}
  .rail-ac{font-size:var(--fs-xs);margin-top:7px}
  .rail-sig{font-size:var(--fs-sm);margin:12px 2px 18px}
  .rail-streak{padding:12px 14px;border-radius:14px;margin-bottom:16px}
  .rail-streak span{font-size:20px}
  .rail-streak b{font-size:clamp(21px,1.45vw,25px)}
  .rail-streak em{font-size:var(--fs-xs)}
  .rail-mini{gap:10px;margin-bottom:16px}
  .rail-mini>div{padding:13px 6px;border-radius:13px}
  .rail-mini b{font-size:clamp(21px,1.5vw,25px)}
  .rail-mini span{font-size:var(--fs-2xs)}
  .rail-badges{gap:8px;margin-bottom:18px}
  .rail-badge{width:40px;height:40px;border-radius:12px;font-size:18px}
  .rail-logout{padding:12px;font-size:var(--fs-sm);border-radius:12px}
}
@media (max-width:1024px){
  .b-set{grid-template-columns:1fr}
}
@media (max-width:768px){
  .b-shell{grid-template-columns:1fr}
  .rail{position:static;text-align:left;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 16px;align-items:center;padding:18px}
  .rail-avwrap{margin:0}
  .rail-av{width:64px;height:64px;font-size:30px}
  .rail-nm{font-size:var(--fs-xl)}
  .rail-sig{grid-column:1/-1;margin:0}
  .rail-streak{grid-column:1/-1;margin:0}
  .rail-mini{grid-column:1/-1;margin:0}
  .rail-badges{grid-column:1/-1;justify-content:flex-start;margin:0}
  .rail-logout{grid-column:1/-1}
}
@media (max-width:480px){
  .b-two{grid-template-columns:1fr}
  .b-greet{align-items:flex-start}
  .b-quick{width:100%}
  .b-savebar{gap:10px}
  .myc-gate .gb .btn{min-width:0;flex:1 1 auto}
  .mg-row{padding:11px 12px}
}
@media (pointer:coarse){
  .b-quick button,.b-upbtn,.rail-logout,.b-out,.mg-acts .btn,.vactions .btn{min-height:44px}
  .b-quick button,.b-upbtn,.rail-logout{display:inline-flex;align-items:center;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<body>
<div class="fp-wrap">
  <div class="fp-shell rise">
    <div class="pc-stars" aria-hidden="true"><div id="pcStars1"></div><div id="pcStars2"></div><div id="pcStars3"></div></div>
    <div class="fp-head">
      <div class="fp-ic" id="headAv">🧑</div>
      <div>
        <h1>个人中心</h1>
        <p class="fp-sub">视频回放、练习数据、收藏与账号设置，都在这里。</p>
      </div>
      <div class="fp-acts"><a class="btn gho sm" href="square.html" style="text-decoration:none">🌐 去观摩大厅 →</a></div>
    </div>

    <div id="gateBox"></div>

    <div class="b-shell" id="accBody">
      <div id="heroCard"></div>
      <div class="b-main">
        <div id="greetCard"></div>
        <div class="vtabs b-seg" id="secTabs">
          <button class="vtab on" data-s="videos">🎬 我的视频</button>
          <button class="vtab" data-s="data">📊 我的数据</button>
          <button class="vtab" data-s="fav">⭐ 我的收藏 <span class="mg-dot" id="favDot" style="display:none"></span></button>
          <button class="vtab" data-s="weak">🎯 薄弱点本 <span class="mg-dot" id="weakDot" style="display:none"></span></button>
          <button class="vtab" data-s="set">⚙️ 账号设置</button>
        </div>
        <div id="pane"></div>
      </div>
    </div>
  </div>
</div>

<script src="shared.js?v=20261115e14d"></script>
<script>
initPage('videos');

var SEC=(location.hash||'').replace('#','')||'videos';
var TAB='mine';
var pane=null;
var guestMode=false;

var SCENE_KEYS=Object.keys(SCENES);

function bindSecTabs(){
  $$('#secTabs .vtab').forEach(function(b){
    b.onclick=function(){
      var s=b.dataset.s;
      if(s===SEC){renderSec();return}
      SEC=s;
      try{history.replaceState(null,'','#'+s)}catch(e){}
      $$('#secTabs .vtab').forEach(function(x){x.classList.toggle('on',x===b)});
      renderSec();
    };
  });
}
/* 编程式切换分区（供「查看全部」等按钮调用） */
function switchSec(s){
  if(s===SEC){renderSec();return}
  SEC=s;
  try{history.replaceState(null,'','#'+s)}catch(e){}
  $$('#secTabs .vtab').forEach(function(x){x.classList.toggle('on',x.dataset.s===s)});
  renderSec();
}
$$('#secTabs .vtab').forEach(function(b){b.classList.toggle('on',b.dataset.s===SEC)});

function renderGate(){
  var box=document.getElementById('gateBox');if(!box)return;
  box.innerHTML='<div class="myc-gate rise">'+
    '<div class="gi">🔐</div>'+
    '<h3>登录后查看你的个人中心</h3>'+
    '<div class="gp">个人中心里的<b>视频回放、练习数据、收藏题目和账号设置</b>都属于私人内容，<br>需要先登录才能查看和管理。</div>'+
    '<div class="gb">'+
      '<button class="btn pri" id="gLogin">🔑 登录 / 注册</button>'+
      '<button class="btn gho" id="gQuick">🎭 游客快速登录</button>'+
    '</div>'+
    '<div class="gn">🔒 注册无需真实手机号，仅用于模拟训练；训练记录云端保存，可跨设备同步。<br>游客身份只能浏览公开内容（首页、题库、观摩大厅），个人中心需要登录后才解锁。</div>'+
    '<div class="gback"><a href="index.html">← 先随便逛逛</a></div>'+
  '</div>';
  document.getElementById('gLogin').onclick=function(){openLoginModal()};
  document.getElementById('gQuick').onclick=function(){
    openLoginModal();
    setTimeout(function(){var b=document.getElementById('lgQuick');if(b)b.click()},240);
  };
}
function applyGate(){
  guestMode=isGuestUser();
  var g=document.getElementById('gateBox');
  var body=document.getElementById('accBody');
  var pn=document.getElementById('pane');
  if(guestMode){
    var ha=document.getElementById('headAv');
    if(ha){ha.innerHTML='';ha.textContent='🔐'}
    if(body)body.style.display='none';
    if(pn)pn.innerHTML='';
    g.style.display='';renderGate();
    return false;
  }
  if(body)body.style.display='';
  if(pn)pn.style.display='';
  g.style.display='none';g.innerHTML='';
  return true;
}

function renderHero(){
  if(guestMode)return;
  var box=document.getElementById('heroCard');if(!box)return;
  var u=getUser()||{};
  var st=getStat(),ci=getCheckInfo();
  var achs=[];try{achs=getAchievements()}catch(e){}
  var got=achs.filter(function(a){return a.unlocked}).length;
  var avg=st.questions?st.scoreSum/st.questions:0;
  var a4=achs.slice(0,4).map(function(a){
    return '<div class="rail-badge'+(a.unlocked?'':' lock')+'" title="'+esc(a.t)+' · '+esc(a.d)+'">'+a.ic+'</div>';
  }).join('');
  var hh=new Date().getHours();
  var greet=hh<6?'夜深了':hh<12?'早上好':hh<18?'下午好':'晚上好';
  var cd=null;try{cd=cdParts()}catch(e){}
  var tip=cd?('距目标面试还有 '+cd.day+' 天 · 连续签到 '+(ci.days||0)+' 天'):('连续签到 '+(ci.days||0)+' 天 · 今天也来开口练一场');

  box.innerHTML='<div class="rail">'+
    '<div class="rail-avwrap"><div class="rail-av" id="heroAv"></div><span class="rail-dot"></span></div>'+
    '<div class="rail-nm">'+esc(u.name||'访客')+'</div>'+
    '<div class="rail-ac">@'+esc(u.account||'guest')+' · '+(u.guest?'游客':(u.oauth?'第三方':'本机账号'))+'</div>'+
    (u.signature?'<div class="rail-sig">'+esc(u.signature)+'</div>':'')+
    '<div class="rail-streak"><span>🔥</span><b>'+(ci.days||0)+'</b><em>连续签到</em></div>'+
    '<div class="rail-mini">'+
      '<div><b>'+(st.times||0)+'</b><span>面试场次</span></div>'+
      '<div><b>'+(st.questions||0)+'</b><span>作答题目</span></div>'+
      '<div><b>'+(avg?avg.toFixed(1):'—')+'</b><span>平均自评</span></div>'+
      '<div><b>'+got+'/'+achs.length+'</b><span>成就解锁</span></div>'+
    '</div>'+
    '<div class="rail-badges">'+a4+'</div>'+
    '<button class="rail-logout" id="heroOut">🚪 退出登录</button>'+
  '</div>';

  var g=document.getElementById('greetCard');
  if(g){
    g.innerHTML='<div class="b-greet">'+
      '<div><b>'+greet+'，'+esc(u.name||'访客')+'</b><span>'+tip+'</span></div>'+
      '<div class="b-quick">'+
        '<button class="pri" id="goPractice">▶ 继续练习</button>'+
        '<button id="goUpload">⬆ 上传视频</button>'+
      '</div>'+
    '</div>';
    var gp=document.getElementById('goPractice');if(gp)gp.onclick=function(){location.href='interview.html'};
    var gu=document.getElementById('goUpload');if(gu)gu.onclick=function(){TAB='upload';switchSec('videos')};
  }

  var hAv=document.getElementById('heroAv');
  renderAvatar(hAv,u.avatar||'🦊');
  renderAvatar(document.getElementById('headAv'),u.avatar||'🦊');
  var ho=document.getElementById('heroOut');
  if(ho)ho.onclick=function(){
    if(!confirm('确定退出登录吗？本机数据与视频会保留。'))return;
    logout();
  };
}

function renderSec(){
  var host=document.getElementById('pane');
  if(SEC==='videos'){
    host.innerHTML='<div class="vtabs sub">'+
      '<button class="vtab'+(TAB==='mine'?' on':'')+'" data-t="mine">🎬 我的回放</button>'+
      '<button class="vtab'+(TAB==='upload'?' on':'')+'" data-t="upload">⬆️ 上传视频</button>'+
      '<button class="vtab'+(TAB==='manage'?' on':'')+'" data-t="manage">🗂 视频管理 <span class="mg-dot" id="mgDot" style="display:none"></span></button>'+
    '</div><div id="vPane"></div>';
    $$('#pane .vtabs.sub .vtab').forEach(function(b){
      b.onclick=function(){
        TAB=b.dataset.t;
        $$('#pane .vtabs.sub .vtab').forEach(function(x){x.classList.toggle('on',x===b)});
        renderSec();
      };
    });
    pane=document.getElementById('vPane');
    render();
  }else{
    pane=host;
    if(SEC==='data')renderData();
    else if(SEC==='fav')renderFav();
    else if(SEC==='weak')renderWeak();
    else renderSet();
  }
}

function fmtTime(ts){var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtDate(ts){var d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function badge(st){return st==='pending'?'<span class="vbadge pending">⏳ 审核中</span>':st==='rejected'?'<span class="vbadge rejected">✕ 未通过</span>':'<span class="vbadge approved">✓ 已通过</span>'}
/* 与题库/观摩大厅同源的双轴标签（岗位 + 面试类型），旧 scene 自动映射 */
function sceneTag(sc){
  var v={scene:sc}, r=ROLE_MAP[roleOf(v)], rd=ROUND_MAP[roundOf(v)], out='';
  if(r)out+='<span class="tag" style="background:'+r.color+'22;color:'+r.color+'">'+r.name+'</span>';
  if(rd)out+='<span class="tag" style="background:'+rd.color+'22;color:'+rd.color+'">'+rd.name+'</span>';
  return out;
}

function vCard(v,actions){
  var ic=v.src==='interview'?'🎤':'📹';
  return '<div class="vcard" data-id="'+v.id+'">'+
    '<div class="vthumb"><span class="vph">'+ic+'</span><img class="vposter" alt="" data-vposter="'+v.id+'"><div class="vplay"><span>▶</span></div></div>'+
    '<div class="vbody">'+
      '<div class="vtitle">'+esc(v.title)+'</div>'+
      '<div class="vmeta">'+stBadge(stOf(v))+sceneTag(v.scene)+'<span>'+esc(v.owner)+'</span><span>'+fmtTime(v.ts)+'</span></div>'+
      (actions?'<div class="vactions">'+actions+'</div>':'')+
    '</div></div>';
}
function emptyHtml(ic,txt){return '<div class="vempty"><div class="big">'+ic+'</div>'+txt+'</div>'}

function stOf(v){
  if(!v.shared)return 'private';
  return v.status||'pending';
}
function stBadge(s){
  if(s==='pending')return '<span class="vbadge pending">⏳ 审核中</span>';
  if(s==='approved')return '<span class="vbadge approved">✓ 已通过</span>';
  if(s==='rejected')return '<span class="vbadge rejected">✕ 未通过</span>';
  return '<span class="vbadge" style="background:rgba(255,255,255,.07);color:var(--ink3)">🔒 仅本机可见</span>';
}
function myVideos(){
  var me=(getUser()||{}).name||'访客';
  var uid=ensureUid();
  return getVideos().filter(function(v){
    if(uid&&v.ownerUid)return v.ownerUid===uid;
    /* 兼容未带 ownerUid 的历史视频 */
    return v.owner===me;
  });
}

function render(){
  var all=getVideos();
  var mine=myVideos();
  var pend=mine.filter(function(v){return stOf(v)==='pending'}).length;
  var dot=document.getElementById('mgDot');
  if(dot){dot.textContent=pend||'';dot.style.display=pend?'inline-block':'none'}
  if(TAB==='mine'){
    pane.innerHTML=mine.length?('<div class="vgrid">'+mine.map(function(v){
      var acts='<button class="btn gho sm act-del">🗑 删除</button>';
      if(!v.shared&&v.status!=='pending')acts='<button class="btn pri sm act-share">🌐 投稿到观摩大厅</button>'+acts;
      else if(v.shared)acts='<button class="btn gho sm" disabled>'+(v.status==='pending'?'等待审核':v.status==='approved'?'已在观摩大厅':'未通过，可重新投稿')+'</button>'+acts;
      return vCard(v,acts);
    }).join('')+'</div>'):emptyHtml('🎬','还没有回放。<br>去「模拟面试」录制视频作答，或在「上传视频」投稿你的作品');
  }else if(TAB==='upload'){
    renderUpload();
  }else{
    renderManage();
  }
  bindCards();
  /* 封面：用视频里的随机一帧替换图标 */
  hydrateVideoPosters(pane);
}

function renderManage(){
  var mine=myVideos().slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  if(!mine.length){
    pane.innerHTML=emptyHtml('🗂','还没有任何视频。<br>去「上传视频」投稿一段，或到「模拟面试」用视频模式录一场');
    return;
  }
  var c={private:0,pending:0,approved:0,rejected:0};
  mine.forEach(function(v){c[stOf(v)]++});
  var h='';
  h+='<div class="mg-sum">'+
    '<div class="mg-k"><div class="l">我的视频</div><div class="v">'+mine.length+'</div></div>'+
    '<div class="mg-k"><div class="l">⏳ 审核中</div><div class="v txA">'+c.pending+'</div></div>'+
    '<div class="mg-k"><div class="l">✓ 已通过</div><div class="v txG">'+c.approved+'</div></div>'+
    '<div class="mg-k"><div class="l">✕ 未通过</div><div class="v txP">'+c.rejected+'</div></div>'+

function bindManage(){
  $$('#pane .mg-row').forEach(function(row){
    var id=row.dataset.id;
    function find(){return getVideos().filter(function(x){return x.id===id})[0]||{}}
    row.querySelectorAll('[data-act]').forEach(function(el){
      el.onclick=function(e){
        e.stopPropagation();
        var a=el.dataset.act;
        if(a==='play')return playVideo(id);
        if(a==='share'){
          updateVideoMeta(id,{shared:true,status:'pending',reason:''});
          syncVideoMeta(id);
          getVideoBlob(id).then(function(b){if(b)uploadVideoFile(id,b)});
          playSound('checkin');toast('已投稿，等待管理员审核','ok');render();return;
        }
        if(a==='undo'){
          updateVideoMeta(id,{shared:false,status:'private'});
          syncVideoMeta(id);
          playSound('click');toast('已撤回，视频恢复为仅本机可见','ok');render();return;
        }
        if(a==='down'){
          updateVideoMeta(id,{shared:false,status:'private'});
          syncVideoMeta(id);
          playSound('click');toast('已从观摩大厅撤下','ok');render();return;
        }
        if(a==='rename'){
          var v=find();
          var t=prompt('修改视频标题（最多 30 字）',v.title||'');
          if(t==null)return;
          t=String(t).trim().slice(0,30);
          if(!t){toast('标题不能为空','warn');return}
          updateVideoMeta(id,{title:t});syncVideoMeta(id);toast('标题已更新','ok');render();return;
        }
        if(a==='del'){
          if(!confirm('删除后视频文件将从本机移除，且不可恢复，确定删除？'))return;
          deleteVideoRemote(id);
          removeVideo(id).then(function(){toast('已删除','ok');render();renderHero()});
        }
      };
    });
  });
}

function bindCards(){
  $$('#pane .vcard').forEach(function(c){
    var id=c.dataset.id;
    c.querySelector('.vthumb').onclick=function(){playVideo(id)};

    };

}

function playVideo(id){
  getVideoBlob(id).then(function(blob){
    var v=getVideos().filter(function(x){return x.id===id})[0]||{};
    var src=null;
    if(blob){src=URL.createObjectURL(blob)}
    else{src='/api/videos/file/'+encodeURIComponent(id)} /* 本机没有文件时尝试服务器（其他设备投稿的视频） */
    var m=openMask('<div class="m-head"><div><h3>'+esc(v.title||'视频回放')+'</h3><div class="m-sub">'+esc(v.owner||'')+' · '+fmtTime(v.ts||Date.now())+'</div></div><button class="m-x" id="vpX">✕</button></div>'+
      '<video id="vpEl" src="'+src+'" controls autoplay style="width:100%;border-radius:14px;background:#000;max-height:60vh"></video>');
    m.querySelector('#vpX').onclick=function(){closeMask()};
    m.querySelector('#vpEl').onerror=function(){
      closeMask();toast('视频文件不存在（仅保存于投稿者的设备，尚未上传服务器）','warn');
    };
    if(blob)m.addEventListener('click',function(){setTimeout(function(){URL.revokeObjectURL(src)},300)});
  });
}

  pane.innerHTML='<div class="up-card rise">'+

        '<div class="b-field"><label>生日</label><input class="b-inp" id="fBd" value="'+esc(u.birthday||'')+'" placeholder="如 2000-01-01"></div>'+
      '</div>'+
      '<div class="b-savebar"><button class="b-save" id="editSave">💾 保存资料</button><span>资料云端保存 · 跨设备同步</span></div>'+
    '</div>'+
    /* 退出登录 */
    '<div class="b-scard b-danger">'+
      '<div><b>退出登录</b><span>清除本机登录状态，数据与视频会保留</span></div>'+
      '<button class="b-out" id="setOut">🚪 退出登录</button>'+
    '</div>'+
  '</div>';

  var editState={avatar:u.avatar||'__person__'};
  var curAvBox=document.getElementById('curAvBox');
  function refreshAv(){
    var isC=typeof editState.avatar==='string'&&editState.avatar.indexOf('data:')===0;
    curAvBox.innerHTML=isC?'<img src="'+esc(editState.avatar)+'">':esc(editState.avatar);
    $$('#mycEdit .av-emoji').forEach(function(b){b.classList.toggle('on',!isC&&b.dataset.a===editState.avatar)});
  }
  $$('#mycEdit .av-emoji').forEach(function(b){b.onclick=function(){editState.avatar=this.dataset.a;refreshAv()}});
  document.getElementById('avUpload').onclick=function(){document.getElementById('avFile').click()};
  document.getElementById('avFile').onchange=function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    if(f.size>3*1024*1024){toast('图片需小于 3MB','warn');return}
    compressImage(f,256,0.8,function(data){
      if(data){editState.avatar=data;refreshAv();toast('头像已更新','ok')}
      else toast('图片处理失败','warn');
    });
    e.target.value='';
  };
  var clr=document.getElementById('avClear');
  if(clr)clr.onclick=function(){editState.avatar='__person__';refreshAv()};
  var fName=document.getElementById('fName');
  fName.oninput=function(){
    var v=this.value;
    document.getElementById('nmCnt').textContent=v.length+'/12';
    document.getElementById('nmCnt').classList.toggle('err',v.length>12);
    document.getElementById('nmErr').textContent='';
  };
  var fSig=document.getElementById('fSig');
  fSig.oninput=function(){
    var v=this.value;
    document.getElementById('sigCnt').textContent=v.length+'/50';
    document.getElementById('sigCnt').classList.toggle('err',v.length>50);
  };
  /* 保存 */
  document.getElementById('editSave').onclick=function(){
    var name=fName.value.trim();
    var sigVal=fSig.value.trim();
    var err=0;
    if(!name||name.length<1){document.getElementById('nmErr').textContent='昵称不能为空';err++}
    else if(name.length>12){document.getElementById('nmErr').textContent='昵称不能超过 12 个字符';err++}
    else document.getElementById('nmErr').textContent='';
    if(sigVal.length>50){document.getElementById('sigErr').textContent='签名不能超过 50 个字符';err++}
    else document.getElementById('sigErr').textContent='';
    if(err)return;
    var btn=this;
    /* 资料保存：本地即时生效，同时经 /api/profile 同步云端 */
    var nu=getUser()||{};
    nu.name=name;nu.avatar=editState.avatar;
    nu.signature=sigVal;nu.gender=document.getElementById('fGender').value;
    nu.birthday=document.getElementById('fBd').value.trim();
    storeSet('ivsim_user',nu);
    try{syncProfile()}catch(e){}
    refreshNavAvatar();renderHero();
    btn.disabled=true;btn.innerHTML='✅ 已保存';
    toast('资料已保存','ok');
    setTimeout(function(){btn.disabled=false;btn.innerHTML='💾 保存资料'},1500);
  };

  /* 退出登录 */
  document.getElementById('setOut').onclick=function(){
    if(!confirm('确定退出登录吗？本机数据与视频会保留。'))return;
    logout();
  };
}

bindSecTabs();
/* 壳内星空：与首页 .bg-fx 同一套 seedStars（700×1px/60s、200×2px/120s、100×3px/180s 视差上飘） */
seedStars('pcStars1',700,1,60);
seedStars('pcStars2',200,2,120);
seedStars('pcStars3',100,3,180);
function boot(){
  if(!applyGate())return;
  $$('#secTabs .vtab').forEach(function(b){b.classList.toggle('on',b.dataset.s===SEC)});
  renderHero();
  renderSec();
  /* 与服务器对齐审核状态：管理员在后台通过 / 拒绝后，本机状态与理由自动更新 */
  syncVideoStatusFromServer().then(function(ch){if(ch){renderHero();renderSec()}});
  reuploadLocalVideoFiles(); /* 已通过审核的视频若服务器缺文件，自动补传 */
}
boot();
/* 登录成功后（登录弹窗里登录 / 注册 / 游客快速登录）自动解锁个人中心 */
window.addEventListener('ivsim:login',function(){
  if(!isGuestUser()){
    boot();
    toast('登录成功，个人中心已解锁','ok');
  }
});
/* 资料卡片在别的弹层里改过之后自动刷新 */
setInterval(function(){if(!guestMode)renderHero()},3000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!guestMode)renderHero()});
</script>
</body>
</html>
